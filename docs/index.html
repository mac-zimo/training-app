  "md": "# 12 — Azure Service Bus & messaging (`messaging`)\n\n## En 30 secondes\n**Azure Service Bus** est le broker de messages d'entreprise d'Azure : **queues** (point à point) et\n**topics/subscriptions** (publish/subscribe), livraison **at-least-once** avec **peek-lock**, sessions\n(ordre FIFO par clé), dead-letter queue, détection de doublons, transactions, messages planifiés.\nChoix entre les services : **Service Bus** pour des messages métier à forte valeur (commandes,\névénements d'intégration) ; **Event Grid** pour du routage d'événements réactif (notifications\nd'état) ; **Event Hubs** pour l'ingestion de flux massifs (télémétrie, logs, streaming, compatible Kafka).\n\n## Notions clés\n\n### Service Bus — concepts\n- **Namespace** (conteneur, FQDN `xxx.servicebus.windows.net`) → queues, topics.\n- **Queue** : un message consommé par **un seul** récepteur (competing consumers → scalabilité).\n- **Topic + subscriptions** : chaque subscription reçoit une copie ; **filtres** SQL\n  (`EventType = 'CustomerVerified' AND Country = 'FR'`) ou **correlation filters** (plus performants),\n  **actions** (modifier des propriétés).\n- **Tiers** : Basic (queues seulement), **Standard** (topics, multi-tenant, messages ≤ 256 Ko),\n  **Premium** (ressources dédiées en messaging units, isolation, messages jusqu'à 100 Mo, **VNet/Private\n  Endpoint**, geo-disaster recovery, prédictibilité) → Premium attendu en contexte bancaire.\n\n### Modes de réception\n- **PeekLock** (défaut) : le message est verrouillé (lock duration, max 5 min, renouvelable) ; le consommateur\n  doit **Complete** (supprimer), **Abandon** (remettre, incrémente `DeliveryCount`), **DeadLetter** ou **Defer**.\n  Si le lock expire → message redélivré → **at-least-once** → **idempotence obligatoire**.\n- **ReceiveAndDelete** : supprimé à la lecture, perte possible en cas de crash (at-most-once).\n- **MaxDeliveryCount** (défaut 10) dépassé → message envoyé en **Dead-Letter Queue** (`<queue>/$deadletterqueue`)\n  avec raison. La DLQ doit être **monitorée** (alerte) et traitée (rejeu, analyse).\n- Messages **poison** : erreurs non transitoires → dead-letter immédiat plutôt que 10 retries.\n\n### Fonctionnalités avancées\n- **Sessions** (`SessionId`) : ordre FIFO garanti et traitement exclusif par session (ex. tous les messages\n  d'un même client traités dans l'ordre, par un seul consommateur à la fois). Sans session, **pas de garantie\n  d'ordre** avec plusieurs consommateurs.\n- **Duplicate detection** : fenêtre de temps sur `MessageId` (à activer à la création) → un envoi rejoué avec le\n  même `MessageId` est ignoré. Utile côté producteur (outbox qui republie).\n- **Scheduled messages** (`ScheduledEnqueueTime`) : relances, timeouts de saga.\n- **Deferral** : mettre de côté un message pour le traiter plus tard (par sequence number).\n- **Transactions** : opérations atomiques sur une même entité (ex. compléter un message reçu et en envoyer un\n  autre, \"send via\").\n- **Auto-forwarding**, **TTL** (expiration → DLQ si configuré), propriétés applicatives\n  (`ApplicationProperties`), `CorrelationId`, `Subject`, `ContentType`.\n\n### SDK .NET : `Azure.Messaging.ServiceBus`\n```csharp\n// Program.cs : client singleton, auth Entra ID (Managed Identity), pas de connection string\nbuilder.Services.AddSingleton(_ => new ServiceBusClient(\n    \"kyc-prod.servicebus.windows.net\", new DefaultAzureCredential()));\n\n// Envoi\nawait using var sender = client.CreateSender(\"customer-events\");\nvar msg = new ServiceBusMessage(BinaryData.FromObjectAsJson(evt))\n{\n    MessageId = evt.EventId.ToString(),          // idempotence + duplicate detection\n    Subject = nameof(CustomerVerified),\n    CorrelationId = correlationId,\n    SessionId = evt.CustomerId.ToString(),       // si ordre par client requis\n    ContentType = \"application/json\"\n};\nawait sender.SendMessageAsync(msg, ct);\n\n// Réception (dans un BackgroundService)\nvar processor = client.CreateProcessor(\"customer-events\", \"kyc-subscription\",\n    new ServiceBusProcessorOptions { AutoCompleteMessages = false, MaxConcurrentCalls = 8 });\nprocessor.ProcessMessageAsync += async args =>\n{\n    var evt = args.Message.Body.ToObjectFromJson<CustomerVerified>();\n    await handler.HandleAsync(evt, args.CancellationToken);   // idempotent !\n    await args.CompleteMessageAsync(args.Message);\n};\nprocessor.ProcessErrorAsync += args => { logger.LogError(args.Exception, \"SB error\"); return Task.CompletedTask; };\nawait processor.StartProcessingAsync(ct);\n```\n- `ServiceBusClient`, senders et processors sont **thread-safe et à réutiliser** (singletons).\n- `ServiceBusSessionProcessor` pour les sessions. Retry intégré au client (`ServiceBusRetryOptions`).\n- Azure Functions : trigger `ServiceBusTrigger` (complete automatique en cas de succès, configurable).\n- Émulateur Service Bus local (Docker) disponible pour le dev et les tests d'intégration.\n- Traçage distribué : le SDK propage le contexte (`Diagnostic-Id` / `traceparent`).\n\n### Comparatif des services de messaging Azure\n| | Service Bus | Event Grid | Event Hubs |\n|---|---|---|---|\n| Modèle | broker de messages (pull) | routage d'événements (push) | streaming / log partitionné |\n| Usage | commandes, transactions métier, workflows | réactions à des changements d'état (blob créé, ressource Azure, événements custom) | télémétrie, IoT, logs, analytics |\n| Garanties | at-least-once, ordre (sessions), DLQ, transactions | at-least-once, retry, dead-letter vers blob | ordre par partition, rétention, relecture (offset) |\n| Volume | milliers–dizaines de milliers msg/s | grand | millions d'événements/s |\n| Consommation | message supprimé après traitement | livré aux abonnés | lu par consumer groups avec checkpoint |\n\n- Event Hubs : partitions, **consumer groups**, **checkpointing** (Blob Storage), **Capture** vers stockage,\n  endpoint Kafka. Ce n'est pas une file : les événements restent pendant la rétention.\n\n## Pièges et nuances\n- Croire à l'exactly-once : non, at-least-once → idempotence côté consommateur.\n- Traitement long > lock duration → redélivrance concurrente ; renouveler le lock (le processor le fait via\n  `MaxAutoLockRenewalDuration`) ou découper.\n- Ordre : ni les queues sans session ni les retries ne garantissent l'ordre → sessions ou version d'agrégat\n  côté consommateur pour ignorer les événements obsolètes.\n- DLQ non monitorée = pertes silencieuses.\n- Connection strings avec SAS en clair → préférer Managed Identity + RBAC (`Azure Service Bus Data Sender/Receiver`).\n- Messages volumineux : **claim check pattern** (payload dans Blob Storage, référence dans le message) — et\n  pas de données sensibles inutiles dans les messages.\n\n## Questions d'entretien probables\n- **Queue vs topic ?** Point à point vs pub/sub avec subscriptions filtrées.\n- **PeekLock et que se passe-t-il si ton process crash au milieu ?** Lock expire, message redélivré,\n  `DeliveryCount++`, DLQ après MaxDeliveryCount ; d'où l'idempotence.\n- **Comment garantir l'ordre des événements d'un même client ?** Sessions (`SessionId = customerId`), ou\n  vérification de version côté consommateur.\n- **Service Bus vs Event Grid vs Event Hubs ?** Voir tableau ; savoir donner un cas pour chacun.\n- **Comment éviter les doublons à l'envoi ?** `MessageId` déterministe + duplicate detection ; outbox.\n- **Que fais-tu des messages en DLQ ?** Alerte, analyse de la raison, correction, rejeu outillé (resubmit),\n  ou abandon documenté.\n\n## Pour aller plus loin\n- Microsoft Learn : \"Service Bus messaging overview\", \"Message sessions\", \"Duplicate detection\",\n  \"Compare Azure messaging services\".\n- Clemens Vasters (architecte Service Bus) — talks sur le messaging.\n"
 },
 "13-azure.md": {
  "title": "13 — Azure IaaS/PaaS/FaaS, identité, réseau, migration cloud (azure)",
  "md": "# 13 — Azure IaaS/PaaS/FaaS, identité, réseau, migration cloud (`azure`)\n\n## En 30 secondes\nAzure propose trois grands niveaux de service : **IaaS** (VM : on gère l'OS), **PaaS** (App Service,\nSQL Database, Cosmos DB, Service Bus : on gère l'app et les données), **FaaS/serverless** (Azure\nFunctions : on gère le code, facturation à l'exécution). Le **modèle de responsabilité partagée**\nfixe qui sécurise quoi. Pour une banque, les sujets incontournables : **identité (Entra ID,\nManaged Identity), secrets (Key Vault), réseau privé (VNet, Private Endpoints), résilience\n(zones, régions), gouvernance (Policy, RBAC), coûts**. La transition vers le cloud se fait\napplication par application, selon une stratégie de migration (les \"R\").\n\n## Notions clés\n\n### Organisation\n- **Entra ID tenant** → Management groups → **Subscriptions** → **Resource groups** → Ressources.\n- **RBAC** : rôle (Owner, Contributor, Reader, rôles data plane spécifiques) assigné à un principal sur un\n  scope. **Moindre privilège.** Control plane (gérer la ressource) ≠ data plane (lire les données).\n- **Azure Policy** (règles de conformité : régions autorisées, chiffrement, pas d'IP publique) ;\n  **Landing zones** (Cloud Adoption Framework) ; tags ; **Well-Architected Framework** (5 piliers :\n  fiabilité, sécurité, optimisation des coûts, excellence opérationnelle, efficacité des performances).\n\n### Compute : choisir\n| Service | Type | Quand |\n|---|---|---|\n| Virtual Machines / VM Scale Sets | IaaS | lift & shift, logiciel non conteneurisable, contrôle OS |\n| **App Service** (Web Apps) | PaaS | API/web .NET classiques, deployment slots, autoscale, simple |\n| **Azure Functions** | FaaS | traitements événementiels (queue, timer, HTTP), pics, glue |\n| **Azure Container Apps** | PaaS conteneurs (serverless) | microservices conteneurisés, scale to zero, KEDA, Dapr, révisions |\n| **AKS** | Kubernetes managé | plateforme conteneurs complexe, contrôle fin, équipe plateforme |\n| Container Instances | conteneur simple | jobs ponctuels |\n\n- **App Service** : App Service Plan (taille/instances partagés), **deployment slots** (staging → swap\n  sans downtime, slot settings), autoscale, VNet integration (sortant), Private Endpoint (entrant),\n  Easy Auth, health check.\n\n### Azure Functions\n- **Triggers** (HTTP, Timer, Service Bus, Event Grid, Event Hubs, Cosmos DB change feed, Blob, Queue) et\n  **bindings** input/output déclaratifs.\n- **Modèle isolated worker** obligatoire pour .NET récent : le modèle **in-process** arrive en fin de support\n  le **10 novembre 2026** (**à vérifier**, mais c'est l'annonce Microsoft) → sujet de migration d'actualité.\n- **Plans d'hébergement** : Consumption (historique, scale to zero, cold start), **Flex Consumption** (nouveau\n  plan serverless recommandé : VNet, instances toujours prêtes, scale rapide), **Premium** (instances\n  préchauffées, VNet, pas de cold start), **Dedicated** (App Service Plan), Container Apps.\n- Limites : timeout d'exécution (Consumption 5 min par défaut, 10 max), cold start, statelessness.\n- **Durable Functions** : orchestrations avec état (code C#), patterns : chaînage, **fan-out/fan-in**, async HTTP\n  API, monitor, **interaction humaine** (attente d'un événement externe avec timeout — ex. validation manuelle\n  d'un dossier KYC), entités durables. Orchestrateur **déterministe** (pas de `DateTime.Now`, pas d'I/O direct :\n  `context.CurrentUtcDateTime`, activités). Alternative récente : Durable Task Scheduler (**à vérifier**).\n\n### Identité et secrets\n- **Entra ID** (ex-Azure AD) : utilisateurs, groupes, **app registrations** (client id, secrets/certificats,\n  scopes, app roles), **service principals**.\n- **Managed Identity** : identité Entra gérée par Azure pour une ressource, **sans secret à stocker**.\n  System-assigned (liée au cycle de vie de la ressource) vs **user-assigned** (réutilisable, gérée à part).\n  Utilisation : `DefaultAzureCredential` (chaîne : env, workload identity, managed identity, Visual Studio,\n  Azure CLI…) — en prod, préférer `ManagedIdentityCredential` explicite (plus rapide, plus prévisible).\n- **Key Vault** : secrets, clés (HSM en Premium / Managed HSM), certificats ; RBAC recommandé (vs access\n  policies) ; **soft delete + purge protection** ; références Key Vault dans App Service/Functions\n  (`@Microsoft.KeyVault(SecretUri=...)`) ; intégration `builder.Configuration.AddAzureKeyVault(...)`.\n- **App Configuration** : configuration centralisée + **feature flags** (`Microsoft.FeatureManagement`).\n- **Workload identity federation** : pipelines Azure DevOps/GitHub qui s'authentifient sans secret (OIDC).\n\n### Réseau\n- **VNet**, subnets, **NSG** (règles de filtrage), **Private Endpoint** (IP privée pour un service PaaS dans\n  votre VNet + DNS privé ; on désactive l'accès public) vs **Service Endpoint** (le trafic reste sur le\n  backbone mais le service garde une IP publique).\n- **VNet integration** (sortant d'App Service/Functions vers le VNet).\n- Entrée : **Application Gateway** (L7, WAF régional), **Front Door** (global, CDN, WAF), **API Management**\n  (passerelle d'API : policies JWT, quotas, transformation, versions/révisions, portail développeur).\n- Hub & spoke, Azure Firewall, ExpressRoute/VPN vers l'on-premise.\n\n### Stockage\n- Storage account : **Blob** (tiers Hot/Cool/Cold/Archive, lifecycle policies, immutabilité WORM pour\n  l'archivage réglementaire), Queue, Table, Files. Redondance : LRS, ZRS, GRS, GZRS.\n- **Static website** sur Blob Storage : héberger un site HTML/JS statique (conteneur `$web`).\n- SAS (Shared Access Signature) : déléguer un accès limité ; préférer **user delegation SAS** (signée via Entra).\n\n### Résilience et coûts\n- **Availability zones** (datacenters séparés dans une région), paires de régions, SLA composites\n  (SLA A × SLA B < chacun), RPO/RTO, backups, géo-réplication.\n- Coûts : réservations/savings plans, autoscale, scale to zero, tiers de stockage, **FinOps** (budgets,\n  alertes, tags d'imputation).\n\n### Migration vers le cloud\n- Stratégies (Cloud Adoption Framework / Gartner) : **Rehost** (lift & shift VM), **Replatform** (ex. IIS →\n  App Service, SQL Server → Azure SQL Managed Instance), **Refactor/Rearchitect** (cloud-native, microservices,\n  serverless), **Rebuild**, **Replace** (SaaS), **Retire**, **Retain**.\n- Outils : Azure Migrate, App Service Migration Assistant, Data Migration Assistant / Azure Database Migration\n  Service.\n- **.NET Framework → .NET** : inventaire des dépendances (portability analysis), librairies partagées en\n  .NET Standard 2.0, `System.Web` → ASP.NET Core, **WCF → CoreWCF ou gRPC/REST**, EF6 → EF Core, config\n  `web.config` → `appsettings`/App Configuration/Key Vault, `System.Web.Adapters` + **YARP** pour une migration\n  incrémentale (strangler fig). Outillage : .NET Upgrade Assistant (déprécié au profit de **GitHub Copilot\n  app modernization**, **à vérifier**).\n- Cloud-native : stateless (sessions hors process → Redis), logs vers stdout/OTel, config externalisée,\n  12-factor app, health checks, arrêt gracieux.\n\n## Pièges et nuances\n- `DefaultAzureCredential` qui prend une identité inattendue en local ou lente au démarrage en prod.\n- Secrets dans le code, les pipelines ou `appsettings.json` versionné.\n- Accès publics laissés ouverts sur des PaaS (Storage, SQL, Cosmos) en environnement bancaire.\n- Functions Consumption pour une API à faible latence → cold starts.\n- Ignorer les quotas/limites (connexions SNAT sortantes d'App Service → réutiliser `HttpClient`).\n- Région : souveraineté et résidence des données (France Central / France South pour une banque française).\n\n## Questions d'entretien probables\n- **IaaS / PaaS / FaaS : différences et exemples ?** Niveau de responsabilité ; VM / App Service / Functions.\n- **Comment ton app accède à Key Vault ou Service Bus sans secret ?** Managed Identity + RBAC data plane +\n  `DefaultAzureCredential`/`ManagedIdentityCredential`.\n- **Functions ou Container Apps ou App Service pour un nouveau microservice ?** Selon charge, durée de\n  traitement, besoin de conteneurs, latence (cold start), VNet, coûts, compétences de l'équipe.\n- **Comment migrerais-tu une application .NET Framework/WCF vers Azure ?** Évaluer, choisir la stratégie\n  (replatform d'abord si contrainte de temps), CI/CD, observabilité, puis refactor progressif (strangler).\n- **Private Endpoint vs Service Endpoint ?** IP privée dans le VNet et accès public coupé vs restriction de\n  source sur endpoint public.\n- **Comment déployer sans interruption ?** Slots + swap, révisions Container Apps (traffic splitting),\n  blue/green, canary, feature flags.\n\n## Pour aller plus loin\n- Azure Architecture Center (patterns, reference architectures) ; Well-Architected Framework.\n- Microsoft Learn : parcours AZ-204 ; \"Migrate .NET apps to Azure\" ; \"Azure Functions isolated worker guide\".\n"
 },
 "14-data.md": {
  "title": "14 — SQL, EF Core, NoSQL Cosmos DB (data)",
  "md": "# 14 — SQL, EF Core, NoSQL Cosmos DB (`data`)\n\n## En 30 secondes\nSQL (SQL Server / Azure SQL) : modèle relationnel, transactions ACID, intégrité, requêtes riches.\nNoSQL **Cosmos DB** : base distribuée multi-modèle, scalabilité horizontale par **partition key**,\nfacturation en **Request Units (RU/s)**, 5 niveaux de cohérence, **change feed**. Le bon choix dépend\ndes patterns d'accès. En microservices, chaque service choisit son stockage (polyglot persistence).\nEF Core est l'ORM standard ; savoir ce qu'il génère et quand passer à Dapper/SQL brut.\n\n## Notions clés\n\n### SQL\n- **ACID** : Atomicité, Cohérence, Isolation, Durabilité.\n- **Niveaux d'isolation** : Read Uncommitted (lectures sales), **Read Committed** (défaut SQL Server),\n  Repeatable Read, Serializable, **Snapshot / RCSI** (versionnement de lignes ; RCSI activé par défaut sur\n  Azure SQL Database). Anomalies : dirty read, non-repeatable read, phantom read, lost update.\n- **Index** : clustered (ordre physique, un seul) vs non-clustered ; index couvrant (`INCLUDE`) ; sélectivité ;\n  coût en écriture. Lire un **plan d'exécution** (scan vs seek, key lookup).\n- Pièges perf : fonctions sur colonne indexée dans le `WHERE` (non-sargable), `SELECT *`, N+1, conversions\n  implicites (nvarchar vs varchar), parameter sniffing.\n- Pagination keyset (`WHERE Id > @last ORDER BY Id`) plutôt que `OFFSET` sur gros volumes.\n- Concurrence optimiste : colonne `rowversion` ; pessimiste : `UPDLOCK`, `SELECT ... FOR UPDATE` (PostgreSQL).\n- Contraintes d'unicité = dernière ligne de défense de l'idempotence.\n- Window functions (`ROW_NUMBER`, `LAG`), CTE, `MERGE` (à manier avec précaution).\n\n### EF Core\n- `DbContext` = **Unit of Work** + identity map ; durée de vie **Scoped** ; non thread-safe.\n- Change tracking ; `AsNoTracking()` pour les lectures ; `SaveChanges` = une transaction.\n- Chargement : eager (`Include`), explicit, lazy (proxy, à éviter : N+1 caché). **Split queries**\n  (`AsSplitQuery`) contre l'explosion cartésienne.\n- Projections `Select(x => new Dto(...))` : ne charge que les colonnes utiles.\n- Migrations (`dotnet ef migrations add`, scripts idempotents `--idempotent` en CI/CD, bundles).\n- Mapping DDD : **owned types** / **complex types** (.NET 8) pour les Value Objects, champs privés\n  (`_documents`) via backing fields, conversions de valeur (`HasConversion` pour `CustomerId`).\n- Concurrence : `[Timestamp]` / `IsRowVersion()` → `DbUpdateConcurrencyException`.\n- `ExecuteUpdate`/`ExecuteDelete` (.NET 7) : mises à jour en masse sans chargement.\n- Compiled queries, `DbContext` pooling ; logs SQL (`LogTo`) pour vérifier ce qui est généré.\n- **Dapper** : micro-ORM, SQL explicite, idéal pour les read models (côté query de CQRS).\n- Provider EF Core pour Cosmos DB existe (avec limites).\n\n### Cosmos DB\n- **APIs** : NoSQL (native, SQL-like sur JSON), MongoDB, Cassandra, Gremlin, Table, et Azure Cosmos DB for\n  PostgreSQL (Citus).\n- Hiérarchie : account → database → **container** → items (JSON avec `id` + partition key).\n- **Partition key** : choix crucial et (quasi) définitif. Doit avoir une **forte cardinalité**, répartir\n  uniformément lectures **et** écritures, et correspondre au filtre des requêtes fréquentes. Une\n  **partition logique** ≤ **20 Go**. Partitions physiques gérées par Azure. **Hierarchical partition keys**\n  (jusqu'à 3 niveaux) pour dépasser les limites d'une clé unique.\n- **Hot partition** : une clé trop sollicitée → throttling (`429`) même si le RU total n'est pas atteint.\n- `id` unique **au sein d'une partition logique**.\n- **Request Units** : coût normalisé (un **point read** de 1 Ko par `id` + partition key ≈ **1 RU**) ;\n  écritures plus coûteuses ; requêtes **cross-partition** coûteuses. Modes : provisioned (manuel),\n  **autoscale** (entre 10 % et 100 % du max), **serverless**. Dépassement → `429 Too Many Requests` +\n  `x-ms-retry-after-ms` (le SDK retry automatiquement).\n- **Niveaux de cohérence** (du plus fort au plus faible) : **Strong**, **Bounded Staleness**, **Session**\n  (défaut : read-your-writes pour un même client/session), **Consistent Prefix**, **Eventual**. Plus fort =\n  plus de latence/coût, moindre disponibilité multi-région.\n- **Change feed** : flux ordonné (par partition) des créations/mises à jour → projections, outbox, intégration\n  (Azure Function trigger ou Change Feed Processor). Mode \"latest version\" par défaut ; les suppressions ne\n  sont visibles qu'avec le mode \"all versions and deletes\" ou via soft delete + TTL.\n- **Concurrence optimiste** : `_etag` + `IfMatchEtag` dans `ItemRequestOptions` → `412` si modifié.\n- **TransactionalBatch** : transaction ACID **dans une même partition logique** uniquement.\n- **TTL** par container/item ; indexation automatique (politique configurable : exclure les chemins inutiles\n  réduit le coût des écritures) ; multi-région avec écritures multiples possible.\n- Modélisation : **dénormaliser** selon les patterns d'accès, embarquer ce qui est lu ensemble, référencer\n  ce qui grossit sans limite ; plusieurs types de documents dans un même container (champ `type`).\n- SDK : `CosmosClient` **singleton**, mode direct (TCP) par défaut, `bulk` pour l'import.\n\n### SQL ou Cosmos ?\n| Critère | SQL | Cosmos DB |\n|---|---|---|\n| Transactions multi-entités | oui | seulement dans une partition logique |\n| Requêtes ad hoc / jointures | excellent | limité (pas de jointures entre documents) |\n| Scalabilité horizontale, global | limitée / complexe | native |\n| Schéma | strict | flexible |\n| Latence garantie | non | SLA de latence (lectures/écritures < 10 ms au P99) |\n| Exemples | comptes, écritures comptables, reporting | profils, dossiers KYC (documents JSON), event store, sessions, read models |\n\n## Pièges et nuances\n- Mauvaise partition key Cosmos (ex. `country`, `status`, date du jour) → hot partitions, coût.\n- Requêtes Cosmos sans partition key → fan-out cross-partition → RU élevés.\n- EF Core lazy loading + boucle = N+1.\n- Transaction longue = verrous, contention ; ne jamais appeler un service externe dans une transaction.\n- Migrations EF appliquées au démarrage de l'app en prod (plusieurs instances !) → les exécuter dans le pipeline.\n- Données personnelles : chiffrement au repos (par défaut, CMK possible), Always Encrypted pour des colonnes\n  sensibles, masquage dynamique, purge/rétention.\n\n## Questions d'entretien probables\n- **Comment choisis-tu une partition key pour des dossiers clients KYC ?** `customerId`/`onboardingId` :\n  forte cardinalité, requêtes par client, transactions par dossier ; pas `status` ni `country`.\n- **Qu'est-ce qu'un RU, comment réduire la facture ?** Point reads, bonne partition key, indexation ciblée,\n  projections, autoscale/serverless selon le profil.\n- **Niveaux de cohérence Cosmos ? Lequel par défaut et pourquoi ?** Session : cohérence forte pour sa propre\n  session, bon compromis.\n- **Comment gères-tu deux mises à jour concurrentes ?** ETag/rowversion, concurrence optimiste, retry.\n- **Pourquoi ta requête EF est lente ?** Logs SQL, plan d'exécution, index manquant, N+1, tracking,\n  projection, pagination.\n\n## Pour aller plus loin\n- Microsoft Learn : \"Partitioning and horizontal scaling in Azure Cosmos DB\", \"Consistency levels\",\n  \"Change feed design patterns\", \"Data modeling in Azure Cosmos DB\".\n- *Use The Index, Luke* (Markus Winand, gratuit en ligne).\n- EF Core docs : \"Performance\" et \"Testing\".\n"
 },
 "15-devops.md": {
  "title": "15 — Git, Azure DevOps, CI/CD, IaC, Docker (devops)",
  "md": "# 15 — Git, Azure DevOps, CI/CD, IaC, Docker (`devops`)\n\n## En 30 secondes\nDevOps = réduire le temps entre une idée et sa mise en production fiable, en automatisant\nbuild, tests, sécurité et déploiement, et en partageant la responsabilité du run. Outils du poste :\n**Git** (trunk-based ou GitFlow), **Azure DevOps** (Repos, **Pipelines YAML**, Boards, Artifacts,\nTest Plans), **Docker**, Infrastructure as Code (**Bicep/ARM** ou **Terraform**). Un pipeline type :\nbuild → tests → analyse qualité/sécurité → artefact/image → déploiement par environnement avec\napprobations → smoke tests → monitoring.\n\n## Notions clés\n\n### Git\n- Branches : **trunk-based development** (branches courtes < 1–2 jours, feature flags, intégration continue\n  réelle) vs **GitFlow** (develop/release/hotfix, adapté aux releases planifiées, plus lourd) vs GitHub Flow.\n- `merge` (conserve l'historique, commit de merge) vs `rebase` (historique linéaire, réécrit les commits — jamais\n  sur une branche partagée) vs **squash merge** (un commit par PR).\n- Outils utiles : `git bisect` (trouver le commit fautif), `git reflog` (récupérer un état perdu),\n  `git cherry-pick` (porter un hotfix), `git revert` (annuler proprement un commit publié),\n  `git stash`, `git commit --fixup` + `rebase --autosquash`.\n- **Pull requests** : revue, policies de branche (reviewers min., build validation, résolution des commentaires,\n  work item lié), CODEOWNERS. Conventional Commits pour des historiques lisibles.\n- Signature des commits, protection de `main`, secrets jamais committés (et rotation si fuite : l'historique\n  Git garde tout).\n\n### Azure Pipelines (YAML)\n```yaml\ntrigger:\n  branches: { include: [ main ] }\n\nvariables:\n  - group: kyc-common            # variable group (lié à Key Vault possible)\n  - name: buildConfiguration\n    value: Release\n\nstages:\n- stage: Build\n  jobs:\n  - job: build\n    pool: { vmImage: ubuntu-latest }\n    steps:\n    - task: UseDotNet@2\n      inputs: { version: 10.x }\n    - script: dotnet restore && dotnet build -c $(buildConfiguration) --no-restore\n    - script: dotnet test -c $(buildConfiguration) --no-build --collect:\"XPlat Code Coverage\"\n    - task: PublishCodeCoverageResults@2\n      inputs: { summaryFileLocation: '**/coverage.cobertura.xml' }\n    - task: Docker@2\n      inputs:\n        command: buildAndPush\n        containerRegistry: acr-connection\n        repository: kyc-api\n        tags: $(Build.BuildId)\n\n- stage: DeployStaging\n  dependsOn: Build\n  jobs:\n  - deployment: deploy\n    environment: kyc-staging          # approbations, checks, historique des déploiements\n    strategy:\n      runOnce:\n        deploy:\n          steps:\n          - task: AzureCLI@2\n            inputs:\n              azureSubscription: sc-kyc-staging   # service connection (workload identity federation)\n              scriptType: bash\n              scriptLocation: inlineScript\n              inlineScript: az containerapp update -n kyc-api -g rg-kyc-stg --image ...\n\n- stage: DeployProd\n  dependsOn: DeployStaging\n  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))\n  jobs: [ ... ]   # environment kyc-prod avec approbation manuelle\n```\n- Hiérarchie : **stages → jobs → steps** (tasks ou scripts). Jobs en parallèle sur des agents.\n- **Agents** : Microsoft-hosted vs self-hosted (réseau privé, outils spécifiques) ; agents dans un VNet pour\n  déployer sur des ressources privées (Managed DevOps Pools).\n- **Templates** YAML (`template:` steps/jobs/stages, `extends` pour imposer des étapes de sécurité),\n  paramètres, expressions `${{ }}` (compilation) vs `$[ ]` (runtime) vs `$( )` (macro).\n- **Environments** : approbations, checks (horaires, Azure Monitor, branche), traçabilité des déploiements.\n- **Service connections** (de préférence par **workload identity federation**, sans secret).\n- Variable groups, secrets masqués, intégration Key Vault ; **Artifacts** (feeds NuGet privés, upstream sources).\n- Release : déploiement multi-stage YAML (les \"Classic Releases\" sont l'ancien modèle).\n\n### Stratégies de déploiement\n- Rolling, **blue/green** (slots App Service, swap), **canary** (révisions Container Apps avec pourcentage de\n  trafic), **feature flags** (découpler déploiement et activation), dark launch.\n- Rollback rapide : redeploy de l'image précédente, swap inverse, désactivation du flag.\n- Migrations de base **expand/contract** (ajouter, migrer, puis supprimer) pour rester compatible avec deux\n  versions de l'app.\n\n### Infrastructure as Code\n- **Bicep** (DSL Azure, compile en ARM, état géré par Azure, `what-if`) vs **Terraform** (multi-cloud,\n  fichier d'état à protéger — backend Azure Storage avec verrou, `plan`/`apply`).\n- Principes : idempotence, revue en PR, environnements identiques, pas de modifications manuelles (drift),\n  modules réutilisables (Azure Verified Modules).\n\n### Docker\n```dockerfile\n# build multi-stage\nFROM mcr.microsoft.com/dotnet/sdk:10.0 AS build\nWORKDIR /src\nCOPY *.sln Directory.*.props ./\nCOPY src/Kyc.Api/*.csproj src/Kyc.Api/\nRUN dotnet restore src/Kyc.Api/Kyc.Api.csproj      # couche mise en cache tant que les csproj ne changent pas\nCOPY . .\nRUN dotnet publish src/Kyc.Api -c Release -o /app --no-restore\n\nFROM mcr.microsoft.com/dotnet/aspnet:10.0-noble-chiseled AS runtime   # image minimale, non-root\nWORKDIR /app\nCOPY --from=build /app .\nUSER $APP_UID\nEXPOSE 8080\nENTRYPOINT [\"dotnet\", \"Kyc.Api.dll\"]\n```\n- Image vs conteneur ; couches et cache (ordre des instructions) ; `.dockerignore`.\n- Images **chiseled** (Ubuntu minimal, sans shell ni gestionnaire de paquets, non-root) ; port par défaut\n  **8080** depuis .NET 8 ; `dotnet publish /t:PublishContainer` construit une image sans Dockerfile.\n- Registre : **Azure Container Registry** (scan de vulnérabilités via Defender for Containers).\n- Tags immuables (SHA/BuildId), jamais `latest` en prod. Docker Compose pour le dev local\n  (ou .NET Aspire).\n\n## Pièges et nuances\n- Pipeline lent → les devs le contournent : cache NuGet, parallélisme, tests ciblés.\n- Tests flaky dans la CI : à corriger en priorité.\n- Secrets en variables non secrètes ou affichés dans les logs.\n- Environnements non reproductibles (configuration manuelle) → IaC.\n- GitFlow avec branches longues = intégration tardive, conflits.\n\n## Questions d'entretien probables\n- **Décris un pipeline CI/CD idéal pour un microservice .NET sur Azure.** Build, tests unitaires +\n  intégration, analyse (Sonar, SCA, SAST, scan d'image), image versionnée, IaC, déploiement staging,\n  smoke tests, approbation, prod en canary/slot, monitoring post-déploiement, rollback.\n- **Trunk-based vs GitFlow ?** Fréquence d'intégration, feature flags, maturité des tests.\n- **Comment déployer une migration de schéma sans downtime ?** Expand/contract, scripts idempotents, compatibilité\n  N/N-1.\n- **Comment le pipeline s'authentifie-t-il sur Azure ?** Service connection avec workload identity federation (OIDC).\n- **Optimiser une image Docker .NET ?** Multi-stage, restore en couche séparée, image chiseled, non-root,\n  `.dockerignore`, éventuellement AOT/trimming.\n\n## Pour aller plus loin\n- Microsoft Learn : \"Azure Pipelines YAML schema\", \"Deployment jobs\", \"Workload identity federation\".\n- trunkbaseddevelopment.com ; *Continuous Delivery* (Humble, Farley).\n"
 },
 "16-devsecops.md": {
  "title": "16 — DevSecOps & sécurité applicative (devsecops)",
  "md": "# 16 — DevSecOps & sécurité applicative (`devsecops`)\n\n## En 30 secondes\nDevSecOps = intégrer la sécurité **à chaque étape** du cycle (shift left) plutôt qu'en audit final :\nmodélisation des menaces à la conception, règles de code sûr, analyses automatiques dans la CI\n(SAST, SCA, secrets, conteneurs, IaC), DAST en recette, durcissement de l'infrastructure, gestion des\nidentités sans secret, surveillance en prod. En banque, c'est aussi une exigence réglementaire\n(DORA, DSP2, recommandations ACPR/EBA).\n\n## Notions clés\n\n### OWASP Top 10 (web, édition 2021 ; une édition 2025 a été publiée, **à vérifier**)\n1. **Broken Access Control** (IDOR, élévation de privilèges) — n°1.\n2. Cryptographic Failures (données sensibles en clair, algorithmes faibles).\n3. **Injection** (SQL, commandes, LDAP ; XSS inclus) → requêtes paramétrées, EF Core, encodage de sortie.\n4. Insecure Design (absence de threat modeling, de limites métier).\n5. Security Misconfiguration (défauts, erreurs verbeuses, CORS `*`).\n6. Vulnerable and Outdated Components (dépendances).\n7. Identification and Authentication Failures.\n8. Software and Data Integrity Failures (supply chain, désérialisation non sûre, CI/CD compromise).\n9. Security Logging and Monitoring Failures.\n10. SSRF (Server-Side Request Forgery).\n\n### OWASP API Security Top 10 (2023) — le plus pertinent pour des microservices\n- API1 **Broken Object Level Authorization** (accès au dossier KYC d'un autre client en changeant l'ID),\n  API2 Broken Authentication, API3 Broken Object Property Level Authorization (mass assignment / exposition\n  excessive), API4 Unrestricted Resource Consumption (rate limiting), API5 Broken Function Level Authorization,\n  API6 Unrestricted Access to Sensitive Business Flows, API7 SSRF, API8 Misconfiguration, API9 Improper\n  Inventory Management, API10 Unsafe Consumption of APIs (faire confiance aveuglément aux API tierces).\n\n### Outillage dans la chaîne CI/CD\n| Type | Quoi | Exemples |\n|---|---|---|\n| **SAST** | analyse statique du code source | SonarQube/SonarCloud, CodeQL (GitHub Advanced Security for Azure DevOps), Roslyn analyzers, Security Code Scan |\n| **SCA** | vulnérabilités et licences des dépendances | `dotnet list package --vulnerable`, Dependabot, Mend, Snyk, NuGet audit (warnings au restore depuis .NET 8) |\n| **Secrets scanning** | secrets committés | GitHub/GHAS secret scanning, gitleaks, push protection |\n| **Images** | CVE des conteneurs | Defender for Containers (ACR), Trivy |\n| **IaC** | mauvaises configs Bicep/Terraform | Checkov, tfsec/Trivy, PSRule for Azure |\n| **DAST** | attaque de l'app en fonctionnement | OWASP ZAP, Burp |\n| Posture cloud | configuration des ressources | **Microsoft Defender for Cloud**, Azure Policy |\n\n- **Quality gate** bloquante en PR sur les vulnérabilités critiques ; exceptions tracées.\n- **Supply chain** : SBOM (CycloneDX/SPDX), lockfiles NuGet (`packages.lock.json`), Central Package Management,\n  sources NuGet de confiance (Package Source Mapping), signature, SLSA ; épingler les versions des tâches/actions.\n\n### Pratiques de code sûr en .NET\n- Requêtes paramétrées / EF Core (jamais de concaténation SQL ; attention à `FromSqlRaw` vs `FromSqlInterpolated`).\n- Validation des entrées en whitelist ; encodage des sorties (Razor encode par défaut).\n- Pas de `BinaryFormatter` (supprimé de .NET 9) ; `System.Text.Json` sans polymorphisme non contrôlé.\n- Cryptographie : ne pas inventer ; `RandomNumberGenerator`, AES-GCM, hash de mots de passe avec PBKDF2/Argon2\n  (ASP.NET Core Identity), TLS 1.2+ ; clés dans Key Vault/HSM ; Data Protection API pour les tokens applicatifs.\n- Autorisation **côté serveur** systématique et au niveau objet (ressource appartient à l'appelant).\n- Headers de sécurité (HSTS, CSP, X-Content-Type-Options), cookies `Secure`/`HttpOnly`/`SameSite`, anti-CSRF.\n- Rate limiting, tailles de requêtes bornées, timeouts.\n- **Logs** : jamais de secrets, tokens, mots de passe, numéros de carte (PAN), données KYC en clair (pièce\n  d'identité, IBAN complet) → masquage, redaction (`Microsoft.Extensions.Compliance.Redaction`), classification\n  des données.\n- Erreurs : messages génériques côté client, détails côté logs avec correlation ID.\n\n### Identités et secrets\n- **Zéro secret** quand c'est possible : Managed Identity, workload identity federation.\n- Sinon : Key Vault, rotation automatique, durée de vie courte, moindre privilège, séparation par environnement.\n- **Zero Trust** : vérifier explicitement, moindre privilège, supposer la compromission (segmentation réseau,\n  Private Endpoints, mTLS).\n\n### Threat modeling\n- **STRIDE** : Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege.\n  Repudiation ↔ audit trail (Event Sourcing, logs signés/immuables).\n- Faire un diagramme de flux de données, identifier les frontières de confiance, lister les menaces, mitiger.\n  Outil : Microsoft Threat Modeling Tool, OWASP Threat Dragon.\n\n### Sécurité LLM (bonus, ton profil)\n- OWASP Top 10 for LLM Applications : prompt injection, fuite de données sensibles, sortie non validée,\n  agence excessive… → validation des sorties, séparation des données, garde-fous.\n\n## Pièges et nuances\n- La sécurité ne doit pas être un goulot : automatiser, donner du feedback rapide aux devs, trier les faux positifs.\n- Scanner sans corriger = théâtre de sécurité ; suivre un SLA de correction par criticité.\n- Un secret committé puis supprimé reste dans l'historique : **rotation** obligatoire.\n- La sécurité réseau ne remplace pas l'autorisation applicative (et inversement).\n\n## Questions d'entretien probables\n- **Qu'est-ce que DevSecOps concrètement dans ton pipeline ?** SAST + SCA + secrets + scan d'image + IaC scan\n  en PR, DAST en recette, Defender for Cloud en prod, quality gates, SBOM.\n- **Comment éviter qu'un client accède au dossier d'un autre ?** Contrôle d'autorisation au niveau objet,\n  identité issue du token (pas du body), tests automatisés de ce cas.\n- **Une CVE critique sort sur une dépendance : que fais-tu ?** Évaluer l'exposition, mettre à jour, rebuild de\n  toutes les images, déployer, vérifier ; process de patch rapide.\n- **Comment gères-tu les secrets ?** Managed Identity d'abord, Key Vault, rotation, pas dans le repo ni les logs.\n- **STRIDE appliqué à une API d'upload de pièce d'identité ?** Spoofing (auth forte), Tampering (intégrité,\n  hash), Repudiation (audit), Info disclosure (chiffrement, accès restreint, SAS courte durée), DoS (taille,\n  rate limit), EoP (autorisation, scan antivirus du fichier).\n\n## Pour aller plus loin\n- OWASP Top 10, OWASP API Security Top 10, OWASP ASVS, OWASP Cheat Sheet Series (.NET Security Cheat Sheet).\n- Microsoft Security Development Lifecycle (SDL) ; Microsoft Cloud Security Benchmark.\n"
 },
 "17-observabilite.md": {
  "title": "17 — Monitoring, observabilité, Datadog, run (observabilite)",
  "md": "# 17 — Monitoring, observabilité, Datadog, run (`observabilite`)\n\n## En 30 secondes\nLe **monitoring** répond à \"est-ce que ça marche ?\" (alertes sur symptômes connus) ;\nl'**observabilité** permet de répondre à des questions imprévues sur le comportement du système\nà partir de ses sorties : **logs**, **métriques**, **traces distribuées** (+ profiling, événements).\nEn .NET, le standard d'instrumentation est **OpenTelemetry** (`ILogger`, `ActivitySource`, `Meter`).\n**Datadog** est la plateforme SaaS (APM, logs, métriques infra, dashboards, monitors, SLO) utilisée\npar l'équipe. On pilote la fiabilité par des **SLI/SLO** et des alertes actionnables.\n\n## Notions clés\n\n### Les trois piliers\n- **Logs** : événements horodatés. **Structurés** (JSON, propriétés nommées), niveaux cohérents, contexte\n  (correlation/trace ID, customerId pseudonymisé), pas de données sensibles.\n  ```csharp\n  logger.LogInformation(\"Onboarding {OnboardingId} verified with risk {RiskLevel}\", id, risk); // template, pas d'interpolation\n  ```\n  Haute performance : `[LoggerMessage]` source generator. Librairies : `Microsoft.Extensions.Logging`, Serilog, NLog.\n- **Métriques** : valeurs numériques agrégées dans le temps (compteurs, jauges, histogrammes) ; peu coûteuses ;\n  attention à la **cardinalité** des tags (jamais un ID client en tag).\n  Méthodes : **RED** (Rate, Errors, Duration — pour les services), **USE** (Utilization, Saturation, Errors —\n  pour les ressources), **4 golden signals** Google (latence, trafic, erreurs, saturation).\n- **Traces distribuées** : une trace = arbre de **spans** traversant les services ; propagation via\n  **W3C Trace Context** (`traceparent`) en HTTP et dans les messages Service Bus. En .NET : `Activity` /\n  `ActivitySource` = span OpenTelemetry.\n- **Corrélation** : trace_id/span_id injectés dans les logs → passer d'une trace aux logs associés et inversement.\n\n### OpenTelemetry en .NET\n```csharp\nbuilder.Services.AddOpenTelemetry()\n    .ConfigureResource(r => r.AddService(\"kyc-api\"))\n    .WithTracing(t => t.AddAspNetCoreInstrumentation()\n                       .AddHttpClientInstrumentation()\n                       .AddSource(\"Azure.*\")              // SDK Azure (Service Bus, Cosmos…)\n                       .AddSource(\"Kyc.Onboarding\")       // spans métier custom\n                       .AddOtlpExporter())\n    .WithMetrics(m => m.AddAspNetCoreInstrumentation()\n                       .AddRuntimeInstrumentation()\n                       .AddMeter(\"Kyc.Onboarding\")\n                       .AddOtlpExporter());\nbuilder.Logging.AddOpenTelemetry(o => o.AddOtlpExporter());\n```\n- Métrique métier : `Meter` → `Counter<long> onboardingsCompleted`, `Histogram<double> verificationDuration`.\n- Span métier : `using var activity = ActivitySource.StartActivity(\"VerifyIdentity\"); activity?.SetTag(...)`.\n- .NET Aspire \"service defaults\" configure tout cela par défaut.\n\n### Datadog\n- **Agent Datadog** (host, DaemonSet AKS, sidecar Container Apps, extension App Service) collecte métriques,\n  traces, logs ; intégration Azure (métriques Azure Monitor via l'intégration cloud).\n- **APM .NET** : traceur `dd-trace-dotnet` en **instrumentation automatique** (profiler CLR : ASP.NET Core,\n  HttpClient, SQL, Service Bus, etc.) ou instrumentation manuelle ; accepte aussi les données OpenTelemetry\n  (OTLP vers l'agent ou le Collector).\n- **Unified Service Tagging** : `DD_ENV`, `DD_SERVICE`, `DD_VERSION` → filtrer par environnement/service/version\n  (comparer une version déployée avec la précédente).\n- **Corrélation logs ↔ traces** : `DD_LOGS_INJECTION=true` ajoute `dd.trace_id`/`dd.span_id` aux logs.\n- Produits : **APM** (service map, flame graphs, latences par endpoint), **Log Management** (pipelines,\n  parsing, index vs archives, facets, rétention), **Infrastructure**, **Dashboards**, **Monitors**\n  (metric, APM, log, anomaly, forecast, outlier, composite, SLO alerts), **SLOs** (metric-based ou\n  monitor-based, error budget), **Error Tracking**, **Continuous Profiler**, **Database Monitoring**,\n  **Synthetics** (tests d'API/navigateur planifiés), **RUM** (front), **Watchdog** (détection automatique\n  d'anomalies), **Incident Management**, **Sensitive Data Scanner** (masquer PII/PAN dans les logs),\n  Cloud Security/ASM (**à vérifier** selon le contrat de l'équipe).\n- **DogStatsD** pour métriques custom. Attention coûts : métriques custom (cardinalité des tags), volume de logs\n  indexés, spans ingérés → échantillonnage et exclusion de logs bruyants.\n- Équivalent natif Azure : **Azure Monitor** (Application Insights, Log Analytics avec KQL) — savoir comparer.\n\n### SLI / SLO / SLA et error budget\n- **SLI** : mesure (ex. % de requêtes `POST /onboardings` réussies en < 500 ms).\n- **SLO** : objectif interne sur le SLI (99,9 % sur 30 jours).\n- **SLA** : engagement contractuel, avec pénalités (moins strict que le SLO).\n- **Error budget** : 100 % − SLO (0,1 % ≈ 43 min/mois) ; s'il est consommé → priorité à la fiabilité.\n- Alerter sur les **symptômes** visibles par l'utilisateur et le **burn rate** de l'error budget, pas sur\n  chaque CPU à 80 %.\n\n### Alerting et run\n- Alerte **actionnable** : chaque alerte a un propriétaire, un **runbook** (quoi vérifier, comment mitiger),\n  une sévérité ; éviter la fatigue d'alertes.\n- Alertes indispensables pour un service messagerie : longueur de file / âge du plus vieux message,\n  **messages en DLQ**, taux d'erreurs, latence P95/P99, saturation (connexions, CPU, mémoire, RU Cosmos `429`),\n  certificats/secrets qui expirent.\n- Incident : détecter → qualifier (impact, sévérité) → communiquer → **mitiger** (rollback, flag, scale) →\n  résoudre → **postmortem blameless** (timeline, causes, actions).\n- Métriques d'exploitation : MTTD, MTTR, nombre d'incidents, change failure rate.\n\n## Pièges et nuances\n- Logs non structurés (`$\"...\"` interpolé) → impossible à requêter efficacement.\n- Données personnelles dans les logs/traces/tags → non-conformité RGPD et secret bancaire.\n- Trop de logs = coût Datadog élevé et bruit ; niveaux adaptés, échantillonnage des traces, log de l'essentiel.\n- Corrélation cassée dans les traitements asynchrones si le contexte n'est pas propagé dans les messages.\n- Dashboards \"vanity\" sans lien avec les SLO.\n- Health check \"toujours vert\" qui ne teste rien.\n\n## Questions d'entretien probables\n- **Logs, métriques, traces : quand utiliser quoi ?** Métriques pour détecter (alerte), traces pour localiser,\n  logs pour comprendre le détail.\n- **Comment suivre une demande d'onboarding de l'API jusqu'au consumer Service Bus ?** Trace context propagé\n  dans les propriétés du message, spans par étape, correlation ID dans les logs, service map Datadog.\n- **Qu'est-ce qu'un SLO, comment le définirais-tu pour le service KYC ?** Disponibilité et latence des API\n  d'onboarding, délai de traitement bout en bout d'un dossier (P95 < N minutes), taux de messages en DLQ.\n- **Une alerte \"latence P99\" se déclenche la nuit : ta démarche ?** Dashboard du service, déploiement récent\n  (version tag), dépendances (Cosmos 429, SQL, API externe), traces lentes, mitigation (rollback/scale), postmortem.\n- **Comment éviter que des données sensibles finissent dans Datadog ?** Redaction à la source, pas de PII en\n  tags, Sensitive Data Scanner, revue des logs en PR, tests.\n\n## Pour aller plus loin\n- Datadog docs : \"Tracing .NET Core Applications\", \"Unified Service Tagging\", \"Correlating .NET logs and traces\",\n  \"Service Level Objectives\".\n- OpenTelemetry .NET : https://opentelemetry.io/docs/languages/dotnet/\n- Google SRE Book (chap. SLO, alerting) ; *Observability Engineering* (Majors, Fong-Jones, Miranda).\n"
 },
 "18-banque.md": {
  "title": "18 — Domaine bancaire, KYC, DSP2/SCA, réglementaire (banque)",
  "md": "# 18 — Domaine bancaire, KYC, DSP2/SCA, réglementaire (`banque`)\n\n## En 30 secondes\nLa squad **User & KYC** gère l'entrée en relation et la connaissance client : identifier et vérifier\nle client (KYC — Know Your Customer), évaluer son risque, le filtrer contre les listes de sanctions\net de personnes politiquement exposées, et maintenir ces informations à jour. C'est le cœur des\nobligations de **LCB-FT** (lutte contre le blanchiment et le financement du terrorisme). Autour :\n**DSP2** et l'**authentification forte (SCA)**, **RGPD**, **DORA** (résilience opérationnelle numérique),\nsupervision par l'**ACPR**. Pour un dev, ça se traduit par : traçabilité totale, données sensibles\nprotégées, règles métier exactes et testées, résilience et auditabilité.\n\n## Notions clés\n\n### Contexte Xpollens (**à vérifier** sur le site et dans l'échange avec l'équipe)\n- Fintech du **Groupe BPCE** (issue de S-money / Natixis Payments), spécialisée dans le\n  **Banking-as-a-Service (BaaS)** / embedded finance : elle fournit à des partenaires (fintechs, marques,\n  plateformes) des comptes de paiement, IBAN, cartes, paiements, sous sa licence réglementée.\n- Conséquence : les partenaires distribuent, mais **l'établissement régulé reste responsable** du KYC et de la\n  LCB-FT → le service KYC doit être robuste, multi-partenaires (multi-tenant), API-first, auditable.\n- Statuts réglementaires possibles en France : établissement de crédit, **établissement de paiement (EP)**,\n  **établissement de monnaie électronique (EME)** ; agréments délivrés par l'ACPR.\n- Questions à poser : statut exact, volumes d'onboarding, fournisseurs de vérification d'identité, part de\n  legacy .NET Framework à migrer, organisation run/astreinte.\n\n### KYC et LCB-FT\n- Cadre : Code monétaire et financier (art. L.561-1 et suivants), directives européennes anti-blanchiment\n  (4e et 5e AMLD) ; nouveau paquet européen 2024 : **règlement AMLR** (applicable à partir de **juillet 2027**,\n  **à vérifier**) et autorité européenne **AMLA** (Francfort).\n- **Approche par les risques** : classification du risque client (pays, activité, produit, canal, montants)\n  → niveau de vigilance : simplifiée, standard, **renforcée** (EDD).\n- Étapes de l'entrée en relation :\n  1. **Identification** (collecter : nom, prénoms, date et lieu de naissance, adresse…) ;\n  2. **Vérification** de l'identité (pièce d'identité valide, selfie/liveness, moyens d'identification\n     électronique eIDAS, prestataire de **vérification d'identité à distance certifié PVID par l'ANSSI**,\n     **à vérifier** selon les cas) ;\n  3. **Screening** : listes de **sanctions / gel des avoirs** (UE, ONU, registre national DG Trésor),\n     **PPE** (personnes politiquement exposées), médias défavorables ;\n  4. Objet et nature de la relation d'affaires, origine des fonds si nécessaire ;\n  5. Pour une personne morale (**KYB**) : Kbis, statuts, **bénéficiaires effectifs** (détention > 25 % du capital\n     ou des droits de vote, ou contrôle).\n- **Vigilance constante** : surveillance des opérations, mise à jour périodique du dossier (fréquence selon le\n  risque), revue sur événement (pièce expirée, changement d'adresse, alerte).\n- **Déclaration de soupçon à TRACFIN** ; interdiction d'informer le client (tipping-off).\n- **Conservation** des documents et données KYC : **5 ans** après la fin de la relation d'affaires.\n- Ouverture/fermeture de compte déclarée au fichier **FICOBA** (DGFiP).\n\n### DSP2 / PSD2 et SCA\n- **DSP2** (directive (UE) 2015/2366) : ouverture du marché des paiements, agrégateurs (**AISP**, accès aux\n  informations de compte) et initiateurs de paiement (**PISP**) via API (open banking), sécurité renforcée.\n- **SCA — Strong Customer Authentication** (RTS de l'EBA, règlement délégué (UE) 2018/389) : au moins **deux\n  facteurs indépendants** parmi trois catégories :\n  - **connaissance** (mot de passe, code PIN) ;\n  - **possession** (téléphone enrôlé, carte, clé de sécurité) ;\n  - **inhérence** (biométrie : empreinte, visage).\n- Obligatoire pour : accès en ligne au compte, initiation d'un paiement électronique, action à distance à risque\n  de fraude (ex. ajout d'un bénéficiaire, changement de téléphone).\n- **Dynamic linking** pour les paiements à distance : le code d'authentification est lié au **montant** et au\n  **bénéficiaire** ; toute modification l'invalide.\n- **Exemptions** (choisies par le prestataire, sous conditions) : paiements sans contact de faible montant,\n  paiements à distance de faible montant (≤ 30 €, avec plafonds cumulés), bénéficiaires de confiance,\n  opérations récurrentes identiques, virements entre comptes du même titulaire, **analyse de risque de la\n  transaction (TRA)** selon le taux de fraude, consultation des comptes (renouvellement de la SCA tous les\n  **180 jours** depuis la révision des RTS en 2022, auparavant 90 jours).\n- 3-D Secure 2 pour les paiements carte e-commerce.\n- **DSP3 / PSR** (Payment Services Regulation) en cours d'adoption — accord politique fin 2025, **à vérifier** :\n  renforcement contre la fraude (usurpation d'identité de la banque, vérification IBAN/nom), SCA plus accessible.\n- **Lien KYC ↔ SCA** : l'enrôlement de l'appareil (facteur de possession) se fait après vérification d'identité ;\n  la réinitialisation de la SCA (perte du téléphone) exige une ré-identification forte ; les équipes SCA\n  consomment des événements du KYC (client vérifié, client bloqué) → contrats d'événements, collaboration\n  cross-teams (mentionné dans l'annonce).\n\n### Autres réglementations à connaître\n- **RGPD** : licéité (base légale — pour le KYC : **obligation légale**), minimisation, limitation de conservation,\n  sécurité, droits des personnes (accès, rectification, effacement — limité par l'obligation de conservation\n  LCB-FT), **privacy by design**, analyse d'impact (AIPD/DPIA), registre des traitements, DPO, notification de\n  violation à la CNIL sous 72 h. Données biométriques (selfie/liveness) = **données sensibles**.\n- **DORA** (règlement (UE) 2022/2554, applicable depuis le **17 janvier 2025**) : gestion du risque informatique\n  (TIC), **déclaration des incidents majeurs**, tests de résilience (dont TLPT, tests de pénétration fondés sur la\n  menace), **gestion du risque lié aux prestataires tiers** (cloud : registre des contrats, stratégie de sortie,\n  concentration), partage d'informations. Impact dev : observabilité, plans de reprise testés, classification\n  des incidents, documentation, dépendances maîtrisées.\n- **Orientations EBA sur l'externalisation** (cloud) et exigences ACPR : résidence des données, droits d'audit,\n  réversibilité.\n- **PCI DSS** (v4.0) si données de carte (PAN) : ne jamais logger/stocker le PAN en clair, tokenisation.\n- **eIDAS 2** (règlement (UE) 2024/1183) : portefeuille d'identité numérique européen (EUDI Wallet), que les banques\n  devront accepter pour l'identification (**à vérifier** calendrier) → impact direct futur sur un service KYC.\n- Secret bancaire, protection des données de paiement ; lutte contre la fraude (usurpation d'identité, documents\n  falsifiés, mules).\n\n### Traduction technique des contraintes\n| Contrainte | En pratique dans le code / l'archi |\n|---|---|\n| Traçabilité, audit | Event Sourcing ou journal d'audit immuable : qui, quoi, quand, pourquoi, sur quelle base ; horodatage UTC |\n| Exactitude des règles | Value Objects, invariants dans le domaine, TDD/BDD avec la conformité, tests de régression |\n| Données sensibles | chiffrement au repos et en transit, Key Vault/CMK, accès minimal, masquage dans les logs, durée de rétention |\n| Pas de doublon de traitement | idempotence (clés, inbox), concurrence optimiste |\n| Résilience (DORA) | multi-zones, retry/circuit breaker, DLQ monitorées, PRA testé, SLO |\n| Séparation des tâches | validation 4 yeux (revue de dossier par un analyste conformité), RBAC, PR obligatoires, environnements protégés |\n| Prestataires externes (vérif. d'identité, screening) | ACL, timeouts, fallback (revue manuelle), contrats testés, traçabilité des réponses |\n| Multi-partenaires (BaaS) | isolation des données par partenaire (tenant), règles de KYC paramétrables par produit/risque |\n| Montants | `decimal`, devise ISO 4217, arrondi explicite |\n| Matching de noms (sanctions/PPE) | normalisation (accents, translittération), correspondance floue (Jaro-Winkler, Levenshtein, phonétique), gestion des faux positifs |\n\n### Modèle métier possible d'un onboarding (à confronter à l'équipe)\n- États : `Draft → AwaitingDocuments → AwaitingVerification → (Verified | EnhancedDueDiligence → ManualReview) →\n  Approved | Rejected`, plus `Blocked`, `Closed`, `ReviewRequired` (revue périodique).\n- Événements : `ProspectRegistered`, `IdentityDocumentSubmitted`, `IdentityVerificationSucceeded/Failed`,\n  `SanctionsScreeningHit`, `RiskAssessed`, `CustomerApproved`, `CustomerRejected`, `KycReviewDue`.\n- Process long et asynchrone (prestataire externe, revue humaine) → saga / Durable Functions / process manager,\n  timeouts, relances.\n\n## Pièges et nuances\n- Ne pas promettre l'effacement RGPD d'un dossier KYC : l'obligation de conservation prime pendant 5 ans.\n- Faux positifs du screening : ne jamais bloquer automatiquement sans revue humaine traçable si la règle ne l'impose pas.\n- Logs contenant noms, dates de naissance, numéros de pièce : violation de la minimisation.\n- Les règles réglementaires évoluent : les rendre configurables/versionnées, tracer la version de règle appliquée\n  à chaque décision.\n- Ne pas confondre **DORA** (règlement résilience) et **métriques DORA** (DevOps).\n\n## Questions d'entretien probables\n- **Qu'est-ce que le KYC et pourquoi c'est critique ?** Obligation LCB-FT ; sanctions lourdes de l'ACPR ;\n  premier rempart contre la fraude.\n- **Qu'est-ce que la SCA ? Exemples d'exemptions ?** Deux facteurs indépendants parmi trois ; dynamic linking ;\n  faible montant, bénéficiaires de confiance, TRA, récurrent.\n- **Comment concevrais-tu la traçabilité d'une décision KYC ?** Événements immuables avec acteur, horodatage,\n  données d'entrée (références), version des règles, résultat ; read model d'audit ; rétention 5 ans.\n- **Un fournisseur de vérification d'identité est indisponible : que fais-tu ?** Retry/backoff, circuit breaker,\n  file d'attente, statut \"en attente\" pour le client, alerte, éventuellement fournisseur de secours ou revue manuelle.\n- **RGPD vs obligation de conservation ?** Base légale obligation légale, conservation limitée à la durée\n  réglementaire, puis purge ; accès restreint ; crypto-shredding si Event Sourcing.\n- **Qu'implique DORA pour une équipe de dev ?** Gestion des incidents et de leur classification, résilience\n  testée, observabilité, maîtrise des dépendances cloud/tiers, documentation.\n\n## Pour aller plus loin\n- ACPR : \"Lignes directrices relatives à l'identification, la vérification de l'identité et la connaissance de\n  la clientèle\" ; site TRACFIN.\n- EBA : RTS on SCA and CSC ; Q&A SCA. Banque de France / Observatoire de la sécurité des moyens de paiement (OSMP).\n- Texte DORA (EUR-Lex 2022/2554) ; CNIL : référentiels et fiches sur la LCB-FT.\n- ANSSI : référentiel PVID (prestataires de vérification d'identité à distance).\n"
 },
 "19-ia.md": {
  "title": "19 — IA pour le développement : agents de code, LLM, MCP, gouvernance (ia)",
  "md": "# 19 — IA pour le développement : agents de code, LLM, MCP, gouvernance (`ia`)\n\n## En 30 secondes\nUn **LLM** prédit des tokens : il est puissant mais **non déterministe**, limité par sa **fenêtre de contexte**\net capable d'**halluciner**. Un **agent de code** = un LLM + des **outils** (lire/écrire des fichiers, lancer des\ncommandes, appeler des API) + une **boucle** (raisonner → agir → observer → recommencer) jusqu'à l'objectif.\nLa qualité du résultat dépend surtout du **contexte** fourni (instructions projet type `AGENTS.md`, skills,\noutils **MCP**) et des **boucles de vérification** (tests, build, lint, revue humaine).\nEn banque, l'enjeu n'est pas \"utiliser l'IA ou pas\" mais l'utiliser **avec des garde-fous** : confidentialité\ndes données, sécurité (prompt injection, supply chain), traçabilité, conformité (RGPD, DORA, AI Act).\nPosition senior : **l'IA amplifie** — une équipe avec de bons tests, de petits incréments et une CI solide\naccélère ; une équipe sans filet produit plus vite de la dette.\n\n## Notions clés\n\n### Ce qu'il faut savoir d'un LLM pour bien s'en servir\n- **Token** : unité de texte (~¾ de mot en anglais, moins en français et en code). Coût et latence sont\n  facturés/mesurés en tokens d'entrée et de sortie (la sortie coûte plus cher).\n- **Fenêtre de contexte** : tout ce que le modèle \"voit\" à un instant (prompt système, instructions, historique,\n  fichiers lus, résultats d'outils). Au-delà, il faut **résumer/compacter** ou perdre de l'information.\n  **Context rot** : la qualité baisse quand le contexte grossit et se remplit de bruit, bien avant la limite.\n- **Non-déterminisme** : même prompt → réponses différentes (échantillonnage, `temperature`). Conséquence :\n  on ne \"fait pas confiance\", on **vérifie** (tests, compilation, revue).\n- **Hallucination** : réponse plausible mais fausse (API inexistante, package inventé, référence réglementaire\n  fausse). Plus fréquent sur ce qui est rare dans les données d'entraînement ou postérieur au **cutoff**.\n- **Modèles de raisonnement** (thinking) : le modèle \"réfléchit\" avant de répondre ; meilleur sur les tâches\n  complexes, plus lent et plus cher. Choisir le modèle selon la tâche (petit/rapide pour du mécanique,\n  grand pour l'architecture ou le debug difficile).\n- **Prompt caching** : réutiliser un préfixe de contexte identique → moins cher et plus rapide (d'où l'intérêt\n  de contextes stables : instructions en tête, variable en fin).\n- **Embeddings** : vecteurs représentant le sens d'un texte → recherche sémantique, base du **RAG**.\n\n### Du chat à l'agent : les niveaux d'usage\n| Niveau | Exemple | Qui contrôle |\n|--------|---------|--------------|\n| Autocomplétion | Copilot inline | le dev, ligne à ligne |\n| Chat | poser une question, coller du code | le dev copie/colle |\n| Agent dans l'IDE | Copilot agent mode, Cursor | l'agent modifie plusieurs fichiers, le dev valide |\n| Agent CLI | Claude Code, Codex CLI, Copilot CLI | l'agent lit, exécute, teste en boucle ; permissions |\n| Agent asynchrone | Copilot coding agent (issue → PR), agent dans la CI | l'agent travaille seul, l'humain revoit la PR |\n| Multi-agents | orchestrateur + sous-agents spécialisés | découpage, contexte isolé par sous-agent |\n\n**Boucle agentique** (pattern ReAct) : le modèle choisit un outil (*tool call*), l'hôte l'exécute, le résultat\nrevient dans le contexte, le modèle décide de la suite. Le modèle n'exécute rien lui-même : c'est l'**hôte**\n(IDE, CLI) qui exécute, donc c'est l'hôte qui porte les **permissions** et le **sandboxing**.\n\n### Context engineering (plus important que le \"prompt engineering\")\n- **Fichiers d'instructions projet** chargés automatiquement :\n  - `AGENTS.md` : format ouvert, lu par la plupart des agents (Codex, Copilot, Cursor, Gemini CLI…) ;\n    confié à l'**Agentic AI Foundation** (Linux Foundation) fin 2025 avec MCP **(à vérifier)** ;\n  - `CLAUDE.md` (Claude Code, peut importer `@AGENTS.md`), `.github/copilot-instructions.md` et\n    `.github/instructions/*.instructions.md` (Copilot, ciblables par glob).\n  - Contenu utile : commandes build/test, conventions, architecture, interdits (\"ne jamais modifier les\n    migrations appliquées\"), définition de \"terminé\". Court, factuel, maintenu comme du code (revu en PR).\n- **Skills** (Agent Skills, `SKILL.md`) : dossier d'instructions + scripts + ressources, chargé **à la demande**\n  quand la description correspond à la tâche → *progressive disclosure* (le contexte n'est pas pollué par\n  tout le savoir de l'équipe en permanence). Format ouvert repris par plusieurs outils **(à vérifier)**.\n- **Mémoire persistante** : fichiers de mémoire, ou outils dédiés qui capturent les observations de session\n  et réinjectent un résumé à la session suivante. Risque : mémoire obsolète ou contenant des données sensibles.\n- **Sous-agents** : déléguer une recherche ou une revue à un agent au contexte isolé → le contexte principal\n  reste propre ; seule la synthèse revient.\n- **Plan d'abord** : faire produire un plan (mode plan), le corriger, puis exécuter. Moins de dérive.\n- **Compaction** : résumé automatique de la conversation quand le contexte sature ; repartir d'une session\n  neuve avec un fichier de passation (`HANDOFF.md`, `ROADMAP.md`) est souvent plus fiable.\n- **Hooks** : scripts déclenchés par l'hôte sur des événements (avant/après un outil, fin de tâche) →\n  formatter, lancer les tests, bloquer une commande dangereuse. Contrôle **déterministe**, contrairement au prompt.\n\n### MCP (Model Context Protocol)\n- Protocole ouvert (lancé par Anthropic fin 2024) pour brancher des **outils et données** sur n'importe quel\n  hôte IA : \"l'USB-C des agents\". Évite N×M intégrations.\n- Architecture : **host** (Claude Code, VS Code/Copilot…) → **client** MCP (un par serveur) → **server** MCP.\n- Primitives serveur : **tools** (actions appelables par le modèle), **resources** (données lisibles),\n  **prompts** (modèles réutilisables). Côté client : *sampling*, *elicitation* (demander une info à l'utilisateur).\n- Transports : **stdio** (processus local) et **Streamable HTTP** (serveur distant ; l'ancien HTTP+SSE est\n  déprécié). Auth des serveurs distants basée sur **OAuth 2.1** (le serveur MCP est un *resource server*).\n- Exemples utiles pour l'équipe : GitHub MCP, **Azure DevOps MCP** (work items, PR, pipelines), **Azure MCP**,\n  Microsoft Learn docs MCP, Datadog MCP **(à vérifier)**, serveurs internes (catalogue d'API, runbooks).\n- Serveur MCP en C# (SDK officiel `ModelContextProtocol`) :\n  ```csharp\n  var builder = Host.CreateApplicationBuilder(args);\n  builder.Logging.AddConsole(o => o.LogToStandardErrorThreshold = LogLevel.Trace); // stdout réservé au protocole\n  builder.Services.AddMcpServer()\n      .WithStdioServerTransport()\n      .WithToolsFromAssembly();\n  await builder.Build().RunAsync();\n\n  [McpServerToolType]\n  public static class OnboardingTools\n  {\n      [McpServerTool, Description(\"Statut d'un dossier d'onboarding (environnement de recette, données fictives).\")]\n      public static string GetOnboardingStatus(string onboardingId) => /* appel API interne */ \"PendingReview\";\n  }\n  ```\n- Risques : un serveur MCP tiers = du **code qui s'exécute chez vous** et du **texte qui entre dans le\n  contexte** (injection) → registre de serveurs approuvés, versions épinglées, moindre privilège, pas de\n  token \"admin\" donné à un agent.\n\n### Intégrer un LLM dans une application .NET\n- **`Microsoft.Extensions.AI`** : abstractions `IChatClient`, `IEmbeddingGenerator<,>`, middleware (logging,\n  cache, OpenTelemetry, *function invocation*) — comme `ILogger` pour les LLM, fournisseur interchangeable.\n  ```csharp\n  IChatClient client = new AzureOpenAIClient(endpoint, new DefaultAzureCredential())\n      .GetChatClient(\"gpt-deployment\").AsIChatClient()\n      .AsBuilder().UseFunctionInvocation().UseOpenTelemetry().Build();\n\n  var options = new ChatOptions { Tools = [AIFunctionFactory.Create(GetOnboardingStatus)] };\n  var response = await client.GetResponseAsync(\"Où en est le dossier 42 ?\", options);\n  // En local : new OllamaApiClient(new Uri(\"http://localhost:11434\"), \"qwen3\") implémente aussi IChatClient (OllamaSharp)\n  ```\n- **Microsoft Agent Framework** : successeur unifié de Semantic Kernel et AutoGen pour les agents et\n  workflows multi-agents en .NET/Python **(à vérifier : statut GA)**.\n- **Azure** : Azure OpenAI dans **Microsoft Foundry** (ex-Azure AI Foundry, catalogue de modèles dont Claude\n  **(à vérifier)**), auth **Entra ID / Managed Identity** plutôt que clé, déploiement en région UE / Data Zone EU,\n  **Azure AI Content Safety**, **Azure AI Search** pour le RAG (index vectoriel + hybride + semantic ranker).\n- **RAG** (Retrieval-Augmented Generation) : découper les documents (*chunking*) → embeddings → index ; à la\n  requête, chercher les passages pertinents et les injecter dans le prompt → réponses sourcées sur des données\n  privées, sans réentraîner. **Fine-tuning** : changer le comportement/style, pas ajouter des connaissances\n  fraîches. Ordre de préférence : prompt/contexte → RAG → fine-tuning.\n\n### Workflow d'ingénierie avec un agent\n1. **Explorer** : faire lire le code et expliquer (cartographie, dépendances) avant de toucher.\n2. **Planifier** : plan écrit, découpé en petits pas, validé par l'humain.\n3. **Tests d'abord** : l'humain définit le comportement attendu (tests, critères d'acceptation) ; l'agent\n   implémente jusqu'au vert. Sur du legacy : faire générer des **tests de caractérisation / golden master**\n   puis refactorer sous filet (exactement la démarche Gilded Rose).\n4. **Petits diffs**, commits fréquents, l'agent lance build + tests + lint à chaque étape.\n5. **Revue humaine** : le dev reste **auteur et responsable** du code qu'il merge ; relire comme le code d'un\n   collègue junior très rapide et très sûr de lui.\n- *Vibe coding* (accepter sans lire) : acceptable pour un prototype jetable, **jamais** pour du code de\n  production bancaire. *Spec-driven development* : spec → plan → tâches → code, la spec devient la source de vérité.\n- Bons usages : boilerplate, tests, migration de langage/framework, lecture de legacy, scripts, docs, analyse de\n  logs, revue de PR en premier filtre, montée en compétence sur un langage inconnu.\n- Mauvais usages : logique métier critique non spécifiée, crypto/sécurité \"maison\", décisions d'architecture\n  déléguées sans discussion, données réelles de clients dans le prompt.\n\n### Mesurer l'impact (ne pas croire, mesurer)\n- **Étude METR (2025)** : des devs open source expérimentés étaient ~19 % **plus lents** avec l'IA sur leurs\n  propres repos, tout en s'estimant ~20 % plus rapides → la perception n'est pas une mesure.\n- **Rapport DORA 2025** (State of AI-assisted Software Development) : adoption quasi générale ; l'IA est un\n  **amplificateur** des forces et des faiblesses de l'organisation ; capacités clés : position claire sur l'IA,\n  données internes accessibles, contrôle de version solide, **petits lots**, plateforme interne de qualité\n  **(à vérifier : liste exacte)**.\n- Mesurer avec les **métriques DORA** (lead time, fréquence de déploiement, change failure rate, temps de\n  restauration), la taille/temps de revue des PR, le taux de bugs, la satisfaction (SPACE / DevEx) — **pas** le\n  nombre de lignes générées ni le taux d'acceptation des suggestions seul.\n- **Evals** pour les fonctionnalités LLM d'un produit : jeu de cas de référence (*golden dataset*), critères\n  automatiques + **LLM-as-judge** calibré par des humains, exécutées en CI comme des tests de régression.\n\n### Sécurité (OWASP Top 10 for LLM Applications 2025)\nLLM01 **Prompt Injection** · LLM02 Sensitive Information Disclosure · LLM03 Supply Chain · LLM04 Data and Model\nPoisoning · LLM05 Improper Output Handling · LLM06 **Excessive Agency** · LLM07 System Prompt Leakage ·\nLLM08 Vector and Embedding Weaknesses · LLM09 Misinformation · LLM10 Unbounded Consumption.\n- **Injection indirecte** : instructions cachées dans un fichier, une issue, une page web, un résultat d'outil\n  MCP, un README de dépendance → l'agent les exécute. Aucun filtre ne la bloque à 100 %.\n- **Lethal trifecta** (S. Willison) : accès à des **données privées** + exposition à du **contenu non fiable** +\n  capacité de **communiquer vers l'extérieur** = exfiltration possible. Casser au moins une des trois branches.\n- **Slopsquatting** : l'IA invente un nom de package, un attaquant le publie → vérifier chaque nouvelle\n  dépendance (lock file, source NuGet interne/proxy, SCA).\n- **Secrets** : ne jamais laisser un `.env` ou un `appsettings.Development.json` avec secrets lisible par\n  l'agent ; Key Vault + Managed Identity ; scan de secrets en CI.\n- **Moindre privilège / sandbox** : permissions par outil, liste blanche de commandes, conteneur ou devcontainer\n  sans accès réseau sortant, pas de credentials de prod sur le poste de dev, branche protégée + PR obligatoire.\n- **Rules file / config poisoning** : un `AGENTS.md` ou une config MCP modifié dans une PR peut détourner\n  l'agent → ces fichiers sont revus comme du code (CODEOWNERS).\n- **Sortie du LLM = entrée non fiable** : la valider, l'échapper, jamais l'exécuter (SQL, shell) sans contrôle.\n\n### Contraintes d'une banque / fintech régulée\n- **Données** : secret bancaire + **RGPD** → pas de données clients réelles (PII, IBAN, pièces d'identité KYC)\n  dans un outil non approuvé ; jeux de données fictifs ou anonymisés ; classification des données avant usage.\n- **Outils entreprise** : licences Business/Enterprise (pas d'entraînement sur le code, rétention limitée,\n  journaux d'audit, exclusion de contenu, filtre de code public, indemnisation PI), hébergement UE\n  (EU Data Boundary, Data Zone EU sur Azure). Vérifier la **politique IA du groupe** avant tout outil.\n- **DORA** : un fournisseur de LLM est un **prestataire TIC tiers** → contrat, registre d'information, stratégie\n  de sortie, gestion du risque de concentration ; un service critique ne doit pas dépendre d'un seul modèle\n  sans plan B.\n- **AI Act (UE)** : en vigueur depuis août 2024 ; pratiques interdites et **obligation de maîtrise de l'IA\n  (art. 4, *AI literacy*)** depuis février 2025 ; obligations des modèles à usage général depuis août 2025 ;\n  systèmes **à haut risque** (annexe III : notamment **évaluation de solvabilité / scoring de crédit**)\n  prévus août 2026, report envisagé par le *Digital Omnibus* **(à vérifier)**. La **vérification biométrique\n  1:1** (confirmer qu'une personne est bien celle qu'elle prétend être, cas du KYC) est exclue de\n  l'identification biométrique à haut risque ; la détection de fraude est exclue du scoring de crédit\n  **(à vérifier avec la conformité)**. Un assistant de code n'est pas un système à haut risque.\n- **Traçabilité** : savoir dire quel code/quelle décision a impliqué l'IA ; la responsabilité reste humaine\n  (principe des quatre yeux = revue de PR obligatoire).\n\n### IA locale (open-weight)\n- **Ollama** : exécute des modèles open-weight (Qwen, Llama, Mistral, Gemma, gpt-oss, DeepSeek…) en local ;\n  API sur `localhost:11434`, endpoint **compatible OpenAI** (`/v1`) et compatibilité API Anthropic permettant\n  de brancher Claude Code **(à vérifier : version)**. `Modelfile` pour fixer prompt système et paramètres.\n- **Quantization** (GGUF, Q4_K_M, Q8…) : réduire la précision des poids pour tenir en mémoire ; ordre de grandeur\n  ~0,6 Go de VRAM par milliard de paramètres en 4 bits + le **KV cache** qui grossit avec la taille du contexte.\n- **Piège classique** : la fenêtre de contexte par défaut (`num_ctx`) est petite → un agent perd ses\n  instructions et ses définitions d'outils ; l'augmenter explicitement (coût mémoire).\n- **Open WebUI** : interface web auto-hébergée (chat, RAG sur documents, multi-utilisateur) devant Ollama ou\n  une API compatible OpenAI. Alternatives : LM Studio, vLLM (serveur de production).\n- Intérêts : **confidentialité** (rien ne sort du poste/du réseau), souveraineté, coût marginal nul, hors ligne,\n  expérimentation. Limites : qualité inférieure aux modèles frontière sur les tâches agentiques longues,\n  **tool calling moins fiable**, matériel (GPU/VRAM), maintenance, pas de SLA. Usage réaliste : tâches ciblées,\n  classification, extraction, données sensibles, prototypage — pas l'agent principal d'une équipe.\n\n### Adopter l'IA dans une équipe (playbook)\n1. **Cadre** : outils approuvés, classes de données autorisées, règles d'or (revue humaine, pas de prod, pas de\n   PII) — en lien avec la sécurité et la conformité, pas contre elles.\n2. **Contexte partagé dans le repo** : `AGENTS.md` par service (commandes, conventions, architecture, interdits),\n   skills d'équipe (créer un consumer Service Bus idempotent, ajouter un endpoint selon les conventions…), serveurs\n   MCP approuvés. Versionnés et revus comme du code.\n3. **Filets automatiques** : tests, analyse statique, SAST/SCA, scan de secrets, mutation testing → ce qui rend\n   l'IA sûre, c'est la CI, pas la confiance.\n4. **Cas d'usage à fort ROI** d'abord : tests de caractérisation sur le legacy, migrations (.NET Framework →\n   .NET), revue de PR en premier filtre, analyse d'incident (logs/traces via MCP), documentation et ADR.\n5. **Mesurer** avant/après (DORA, temps de revue, défauts), partager les retours (démos, guilde, champions),\n   ajuster.\n6. **Compétences** : former (obligation de maîtrise de l'IA de l'AI Act), garder la capacité à coder et\n   raisonner sans IA (juniors en particulier : risque de *deskilling*).\n\n## Pièges et nuances\n- \"L'IA écrit 50 % de notre code\" ne dit rien sur la valeur livrée : mesurer le flux et la qualité.\n- Le goulot se déplace vers la **revue** : plus de code produit = plus de code à relire. Des PR petites et\n  des tests lisibles deviennent encore plus importants.\n- Un agent qui \"fait passer les tests\" peut modifier les tests ou ajouter des cas particuliers en dur :\n  surveiller les diffs sur les tests, protéger les tests de référence.\n- Plus de contexte n'est pas mieux : un `AGENTS.md` de 2 000 lignes dégrade les résultats.\n- Un prompt n'est pas un contrôle de sécurité : ce qui doit être garanti passe par des permissions, des hooks,\n  la CI ou l'architecture.\n- Les plugins, skills et serveurs MCP communautaires sont de la **supply chain** : les auditer comme une\n  dépendance NuGet. Un outil de mémoire persistante stocke du contenu de session : vérifier où et quoi.\n- Ne pas confondre \"le modèle sait\" et \"le modèle a accès\" : un fait récent ou interne doit être fourni (RAG,\n  MCP, doc), sinon il sera inventé.\n- Dépendance à un fournisseur : prévoir l'abstraction (`IChatClient`, AGENTS.md ouvert, MCP) pour changer de\n  modèle ou d'outil.\n- Un senior sait coder sans l'IA : en kata ou en entretien, ne pas dépendre de l'outil.\n\n## Questions d'entretien probables\n- **Comment utilises-tu les agents de code au quotidien ?** Exemples concrets par type de tâche, workflow\n  explorer → planifier → tests → petits diffs → revue, fichiers d'instructions partagés, ce que tu ne délègues pas.\n- **Quelle différence entre Copilot autocomplétion, agent mode et un agent CLI / asynchrone ?** Degré\n  d'autonomie, boucle outil, permissions, qui exécute, où se fait la revue.\n- **Qu'est-ce que MCP ? Pourquoi c'est utile ? Quels risques ?** Protocole standard host/client/server,\n  tools/resources/prompts, stdio/HTTP ; risques injection, supply chain, privilèges.\n- **Comment éviter qu'un agent fasse n'importe quoi dans le repo ?** Contexte (AGENTS.md), plan validé,\n  permissions et sandbox, hooks, branche + PR, CI, revue humaine.\n- **Qu'est-ce qu'une prompt injection ? Comment s'en protéger ?** Directe vs indirecte, lethal trifecta,\n  moindre privilège, humain dans la boucle pour les actions sensibles, pas de filtre magique.\n- **Peut-on utiliser l'IA sur du code banca
