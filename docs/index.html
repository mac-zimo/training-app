  "question": "Clean Architecture vs hexagonale : quelle règle centrale ?",
  "ref": "01-fiches/00-essentiel-poste.md#q34---clean-architecture-vs-hexagonale--quelle-règle-centrale-",
  "explanation": "**À dire** : même idée : le **domaine au centre**, indépendant des frameworks, de la base, du bus. Règle de\ndépendance : les dépendances pointent **vers l'intérieur**. Hexagonale (ports & adapters) : le domaine\ndéfinit des **ports** (interfaces), l'infrastructure fournit les **adapters** (SQL, Service Bus, API\nexterne), côté entrant (API, consumer) et sortant. Clean Architecture : couches concentriques (Domain,\nApplication/use cases, Infrastructure, Presentation). Bénéfice : domaine testable sans infrastructure,\ninfrastructure remplaçable (migration cloud !).\n\n**Piège** : multiplier projets et couches pour un service simple ; mapper 4 fois le même objet sans valeur."
 },

  "question": "CQRS : quand ? Est-ce lié à l'Event Sourcing ?",
  "ref": "01-fiches/00-essentiel-poste.md#q35---cqrs--quand--est-ce-lié-à-levent-sourcing-",
  "explanation": "**À dire** : séparer le modèle d'**écriture** (commandes, règles, invariants) du modèle de **lecture**\n(requêtes, projections optimisées pour l'affichage). Utile quand lecture et écriture ont des besoins très\ndifférents (charge, forme des données). **Indépendant** de l'Event Sourcing : on peut faire du CQRS avec une\nseule base (deux modèles de code), ou deux bases synchronisées. L'ES, lui, pousse presque toujours vers le\nCQRS (on ne requête pas un flux d'événements).\n\n**Si on creuse** : coût = cohérence éventuelle côté lecture, plus de code. MediatR est souvent utilisé pour\ndispatcher commandes/requêtes ; il est passé sous **licence commerciale** en 2025 : on peut s'en passer\n(simples handlers injectés)."
 },

  "question": "Monolithe, monolithe modulaire, microservices : comment choisir ?",
  "ref": "01-fiches/00-essentiel-poste.md#q36---monolithe-monolithe-modulaire-microservices--comment-choisir-",
  "explanation": "**À dire** : microservices = déploiement indépendant, autonomie d'équipe, scalabilité ciblée ; coût =\ncomplexité distribuée (réseau, cohérence, observabilité, ops). Un **monolithe modulaire** bien découpé en\nbounded contexts est souvent le meilleur point de départ ; on extrait un service quand un besoin réel\n(cadence de déploiement, charge, équipe) le justifie.\n\n**Piège** : le **monolithe distribué** : des services qui doivent être déployés ensemble ou partagent une base.\n\n---"

  "question": "Comment gérer une transaction qui traverse plusieurs microservices ?",
  "ref": "01-fiches/00-essentiel-poste.md#q38---comment-gérer-une-transaction-qui-traverse-plusieurs-microservices-",
  "explanation": "**À dire** : pas de transaction distribuée (2PC) en pratique. On utilise une **saga** : une suite de\ntransactions locales, chacune publiant un événement ; en cas d'échec, des **actions compensatoires**\n(annuler, marquer, notifier). **Chorégraphie** : chaque service réagit aux événements (simple, mais flux\ndifficile à suivre) ; **orchestration** : un orchestrateur pilote les étapes (flux explicite, état\ncentralisé ; ex. Durable Functions, ou machine à états du dossier).\n\n**Si on creuse** : chaque étape doit être **idempotente** ; la compensation n'est pas un rollback (on ne\n\"désenvoie\" pas un e-mail) ; timeouts et états intermédiaires visibles."
 },

  "question": "C'est quoi le pattern Outbox ? Pourquoi ?",
  "ref": "01-fiches/00-essentiel-poste.md#q39---cest-quoi-le-pattern-outbox--pourquoi-",
  "explanation": "**À dire** : problème du **dual write** : sauvegarder en base **et** publier un message ne sont pas\natomiques ; si le service tombe entre les deux, l'état et les événements divergent. Outbox : dans la\n**même transaction** que la donnée métier, on écrit l'événement dans une table `Outbox` ; un process\nséparé (ou le change feed Cosmos) publie ensuite sur le bus et marque comme envoyé. Garantit\n**at-least-once** → le consommateur doit être idempotent (pattern **Inbox** : table des messages déjà traités)."
 },

  "question": "Idempotence : pourquoi, comment ?",
  "ref": "01-fiches/00-essentiel-poste.md#q40---idempotence--pourquoi-comment-",
  "explanation": "**À dire** : avec un bus, la livraison est **au moins une fois** : un message peut arriver deux fois (retry,\ncrash avant `Complete`). Le \"exactly once\" de bout en bout n'existe pas, on fait **exactly-once processing**\npar idempotence : identifiant de message/de commande stocké et vérifié (contrainte unique), opérations\nnaturellement idempotentes (`SetStatus` plutôt que `Increment`), concurrence optimiste sur la version.\nCôté API : `Idempotency-Key`.\n\n---"
 },

  "question": "C'est quoi l'Event Sourcing ? Avantages, inconvénients ?",
  "ref": "01-fiches/00-essentiel-poste.md#q41---cest-quoi-levent-sourcing--avantages-inconvénients-",
  "explanation": "**À dire** : on ne stocke pas l'état courant mais la **suite des événements** qui l'ont produit\n(`KycCaseOpened`, `DocumentSubmitted`, `IdentityVerified`, `CaseApproved`), en **append-only**. L'état se\nreconstruit en rejouant les événements (fold). **Avantages** : **audit trail complet et natif** (précieux\nen banque et pour le régulateur), historique et \"voyage dans le temps\", projections multiples créées\naprès coup, intégration naturelle avec l'événementiel. **Inconvénients** : complexité, versioning des\névénements, cohérence éventuelle des lectures, courbe d'apprentissage, RGPD, requêtes impossibles sans\nprojections.\n\n**Si on creuse** : ES ≠ architecture événementielle (on peut publier des événements sans faire d'ES) ;\nl'ES se justifie sur un **agrégat core** avec forte valeur d'historique, pas sur tout le système."
 },

  "question": "Projections, read models : comment ça marche ? Comment les reconstruire ?",
  "ref": "01-fiches/00-essentiel-poste.md#q42---projections-read-models--comment-ça-marche--comment-les-reconstruire-",
  "explanation": "**À dire** : une **projection** consomme le flux d'événements et maintient un modèle de lecture (table SQL,\ndocument Cosmos, index de recherche). Elle est **jetable** : on peut la supprimer et la reconstruire en\nrejouant tous les événements (nouveau besoin, bug corrigé). Elle doit être idempotente et suivre sa\nposition (checkpoint). La lecture est **éventuellement cohérente** : l'UI doit le gérer (retour de la\ncommande avec la version, polling, read-your-writes)."
 },

  "question": "Concurrence, snapshots, versioning des événements ?",
  "ref": "01-fiches/00-essentiel-poste.md#q43---concurrence-snapshots-versioning-des-événements-",
  "explanation": "**À dire** : **concurrence optimiste** : on écrit avec la **version attendue** du flux ; si quelqu'un a écrit\nentre-temps, conflit → recharger et rejouer la commande. **Snapshots** : pour les flux longs, on stocke\npériodiquement l'état pour ne rejouer que la fin (optimisation, à n'ajouter que si mesuré). **Versioning** :\nles événements sont immuables et éternels ; ajouter des champs optionnels (compatible), sinon nouvelle\nversion d'événement + **upcasting** à la lecture. Ne jamais modifier un événement stocké."
 },

  "question": "Event Sourcing et RGPD : comment supprimer des données dans un log immuable ?",
  "ref": "01-fiches/00-essentiel-poste.md#q44---event-sourcing-et-rgpd--comment-supprimer-des-données-dans-un-log-immuable-",
  "explanation": "**À dire** : **crypto-shredding** : les données personnelles des événements sont chiffrées avec une clé\npar personne (stockée dans un coffre, ex. Key Vault ou table de clés) ; pour \"effacer\", on détruit la clé :\nles données deviennent illisibles. Autre option : ne mettre dans les événements que des références, les\ndonnées personnelles étant dans un stockage à part, effaçable. **Nuance banque** : le droit à\nl'effacement est limité par les **obligations LCB-FT** de conservation (5 ans après la fin de la relation\nd'affaires) : on purge à l'issue de la durée légale, pas à la demande."

  "question": "Service Bus vs Event Grid vs Event Hubs ?",
  "ref": "01-fiches/00-essentiel-poste.md#q46---service-bus-vs-event-grid-vs-event-hubs-",
  "explanation": "**À dire** :\n- **Service Bus** : **messages métier** à forte valeur (commandes, événements d'intégration) : queues et\n  topics/subscriptions, transactions, sessions (ordre), dead-letter, duplicate detection. Le choix pour un\n  flux KYC.\n- **Event Grid** : **notification d'événements** réactive, push, routage par filtres (ex. \"un blob a été\n  déposé\" → déclencher l'analyse d'un document). Faible latence, pas de file durable longue.\n- **Event Hubs** : **streaming** à haut débit (télémétrie, logs, IoT, millions d'événements/s), partitions,\n  rétention, relecture par offset, compatible Kafka.\n\n**Phrase clé** : *message = intention / donnée dont l'émetteur attend le traitement ; event = notification\nd'un fait ; stream = flux continu.*"
 },

  "question": "Comment un message Service Bus est-il consommé ? Que se passe-t-il en cas d'échec ?",
  "ref": "01-fiches/00-essentiel-poste.md#q47---comment-un-message-service-bus-est-il-consommé--que-se-passe-t-il-en-cas-déchec-",
  "explanation": "**À dire** : mode **peek-lock** (par défaut) : le message est verrouillé pendant la *lock duration* ; le\nconsommateur fait `Complete` (supprimé), `Abandon` (redisponible, compteur de livraison +1),\n`DeadLetter` (mis de côté explicitement) ou `Defer`. Après **MaxDeliveryCount** (10 par défaut) échecs, le\nmessage part en **dead-letter queue (DLQ)** : il faut la **surveiller** (alerte) et avoir une procédure de\nretraitement. Mode **receive-and-delete** : rapide mais perte possible.\n\n**Si on creuse** : traitement plus long que le lock → renouvellement automatique du lock (le SDK le fait\navec `MaxAutoLockRenewalDuration`) ; erreur **non transitoire** (message invalide) → DLQ directe plutôt que\n10 retries ; erreur transitoire → retry, éventuellement replanification avec délai (`ScheduledEnqueueTime`)."
 },

  "explanation": "**À dire** : par défaut pas de garantie d'ordre stricte. **Sessions** Service Bus : tous les messages avec\nle même `SessionId` (ex. id du client / du dossier) sont traités dans l'ordre, par un seul consommateur à\nla fois : ordre **par entité** tout en gardant du parallélisme entre entités. Alternative : rendre le\ntraitement tolérant au désordre (numéro de version, ignorer un événement plus ancien que l'état)."
 },

  "question": "Queue ou topic ? Duplicate detection ?",

  "explanation": "**À dire** : **queue** = point à point, un message traité par un consommateur (competing consumers pour\nscaler). **Topic** = publish/subscribe : chaque **subscription** reçoit sa copie, avec filtres (SQL ou\ncorrelation). **Duplicate detection** : Service Bus ignore un message dont le `MessageId` a déjà été vu\ndans une fenêtre de temps : protège contre les doublons **à l'envoi**, pas contre la double livraison\nau consommateur → l'idempotence côté consommateur reste nécessaire."

  "question": "Comment migrer une application vers Azure ? Quelles stratégies ?",

  "explanation": "**À dire** : partir d'un **inventaire** (dépendances, données, flux, contraintes de sécurité et de\nconformité), puis choisir **par application** : **Rehost** (lift & shift sur VM : rapide, peu de gains),\n**Replatform** (ex. App Service, Azure SQL, peu de modifications), **Refactor / Rearchitect** (PaaS natif,\nFunctions, Service Bus, conteneurs), **Rebuild**, **Replace** (SaaS), ou **Retire / Retain**. Migration\n**incrémentale**, environnements, tests de non-régression, plan de bascule et de **retour arrière**,\nobservabilité avant la bascule.\n\n**Bloquants classiques d'une app .NET Framework** : état en session en mémoire, écriture sur le disque\nlocal, authentification Windows intégrée, dépendances COM/GAC, tâches planifiées Windows, configuration\ndans `web.config` avec secrets, appels à des ressources on-premise (→ connectivité hybride).\n\n**Banque** : réversibilité et plan de sortie (DORA), localisation des données, validation sécurité/RSSI."
 },

  "question": "IaaS, PaaS, FaaS : différences ? Quand choisir quoi ?",

  "explanation": "**À dire** : **IaaS** (VM) : contrôle total, tu gères l'OS et les patchs ; pour du legacy non portable.\n**PaaS** (App Service, Azure SQL, Container Apps) : tu gères l'application, Azure gère la plateforme : le\ndéfaut raisonnable. **FaaS** (Azure Functions) : code événementiel, facturation à l'exécution, scale\nautomatique ; idéal pour des traitements déclenchés par événements (message, blob, timer) ; limites :\ncold start, durée d'exécution, état. **Conteneurs** : Container Apps (serverless, KEDA, Dapr) avant AKS si\non n'a pas besoin de toute la puissance de Kubernetes."

  "explanation": "**À dire** : triggers (HTTP, Service Bus, Timer, Blob, Event Grid, Cosmos DB change feed) et bindings.\nModèle **isolated worker** (process séparé, versions .NET récentes, middleware, DI standard) :\nl'**in-process** arrive en **fin de support le 10 novembre 2026** **(à vérifier)** → sujet de migration\nd'actualité. Plans : Consumption, **Flex Consumption** (réseau privé, instances toujours prêtes),\nPremium (pas de cold start, VNet), Dedicated (App Service). **Durable Functions** pour orchestrer\n(saga, attente d'événement externe, timeouts).\n\n**Pièges** : cold start, timeout, idempotence du trigger Service Bus, `HttpClient` statique / factory."

  "question": "Cosmos DB : partition key, RU, niveaux de cohérence ?",
  "ref": "01-fiches/00-essentiel-poste.md#q57---cosmos-db--partition-key-ru-niveaux-de-cohérence-",
  "explanation": "**À dire** : la **partition key** est la décision la plus importante : forte cardinalité, répartition\nuniforme des écritures et du stockage, et requêtes les plus fréquentes **dans une seule partition**\n(ex. `customerId`). Une partition logique est limitée à 20 Go. Coût en **Request Units** (RU/s, provisionné\nou serverless) ; les requêtes cross-partition coûtent cher. **5 niveaux de cohérence** : Strong, Bounded\nStaleness, **Session** (par défaut : read-your-writes pour un client), Consistent Prefix, Eventual.\n**Change feed** : flux ordonné (par partition) des modifications → projections, outbox, intégration.\nTransactions : seulement dans une partition logique (batch transactionnel, procédures stockées).\n\n**Piège** : une partition key \"chaude\" (date du jour, statut) → throttling (429)."
 },

  "explanation": "**À dire** : la sécurité **intégrée tout au long du cycle** et portée par l'équipe, pas un audit en fin de\nprojet (**shift left**) : threat modeling à la conception, revue de code, **SAST**, **SCA** (dépendances\nvulnérables, SBOM), **scan de secrets**, scan d'images, **DAST** en recette, durcissement de l'infra en IaC,\nmonitoring de sécurité en prod. Failles : **OWASP Top 10** et surtout **OWASP API Security Top 10**, dont\nla n°1 : **BOLA** (Broken Object Level Authorization : accéder à l'objet d'un autre en changeant un id),\ninjection, authentification cassée, exposition excessive de données, absence de rate limiting, SSRF.\n\n**Si on creuse** : supply chain : verrouiller les versions (lock files, Central Package Management), sources\nNuGet maîtrisées, Dependabot/Renovate, signature des artefacts."

 },

  "question": "Explique le KYC et la LCB-FT en 1 minute",
  "ref": "01-fiches/00-essentiel-poste.md#q70---explique-le-kyc-et-la-lcb-ft-en-1-minute",
  "explanation": "**À dire** : **LCB-FT** = lutte contre le blanchiment et le financement du terrorisme, obligation légale\ndes établissements financiers (Code monétaire et financier, directives européennes, supervision ACPR).\nLe **KYC** en est le socle : **identifier** le client, **vérifier** son identité (pièce d'identité, selfie,\nidentité numérique), le **filtrer** contre les listes de **sanctions / gel des avoirs** et de **PPE**,\ncomprendre l'objet de la relation, puis **évaluer son risque** pour appliquer une **vigilance** simplifiée,\nstandard ou renforcée. Et c'est **continu** : mise à jour du dossier, revue périodique, surveillance des\nopérations, déclaration de soupçon à Tracfin (par la conformité). Pour une personne morale : **KYB**,\navec les **bénéficiaires effectifs**.\n\n**Contexte Xpollens** : en BaaS, les partenaires distribuent les comptes, mais l'établissement régulé reste\n**responsable** du KYC → service robuste, multi-partenaires, auditable **(à vérifier)**."
 },

  "question": "DSP2 et SCA : c'est quoi ? Quel impact pour une squad User & KYC ?",

  "explanation": "**À dire** : **DSP2** (directive européenne sur les services de paiement) : ouverture des comptes aux tiers\n(agrégation, initiation de paiement via API) et **authentification forte (SCA)** : au moins **2 facteurs de\ncatégories différentes** parmi **connaissance** (mot de passe, code), **possession** (téléphone enrôlé) et\n**inhérence** (biométrie). Requise pour l'accès au compte, les paiements électroniques, les actions\nsensibles. Pour les paiements : **dynamic linking** (l'authentification est liée au montant et au\nbénéficiaire). **Exemptions** : faibles montants, bénéficiaires de confiance, analyse de risque (TRA),\npaiements récurrents. **Impact squad** : l'**enrôlement** du moyen d'authentification se fait souvent\npendant l'onboarding, et la modification de données sensibles (téléphone, e-mail, IBAN de retrait) doit\npasser par une SCA → collaboration avec l'équipe SCA (contrats d'API, événements). La fiche de poste le\nmentionne : *\"collaborer avec les autres équipes qui intègrent le SCA\"*.\n\n**À savoir citer** : DSP3 / règlement PSR en cours d'adoption **(à vérifier)**."
 },

  "explanation": "**À dire** :\n- **Traçabilité / audit** : qui a fait quoi, quand, pourquoi (décision de KYC, version des règles\n  appliquées) → journal d'audit immuable, event sourcing possible.\n- **Exactitude des règles** : règles métier explicites, testées (BDD avec la conformité), versionnées.\n- **Protection des données** : RGPD, minimisation, chiffrement, logs sans données personnelles.\n- **Conservation** : 5 ans après la fin de la relation (LCB-FT), puis purge.\n- **Résilience** : DORA (tests, plans de continuité, gestion des prestataires tiers critiques, incidents).\n- **Contrôle** : séparation des rôles, validation à 4 yeux pour certaines décisions, revue de code\n  obligatoire, traçabilité des déploiements."

  "question": "DORA, RGPD : l'essentiel ?",

  "explanation": "**À dire** : **DORA** (règlement UE, applicable depuis le **17 janvier 2025**) : résilience opérationnelle\nnumérique des acteurs financiers : gestion des risques TIC, **déclaration des incidents majeurs**, tests de\nrésilience, maîtrise des **prestataires tiers** (dont le cloud : contrats, plan de sortie, concentration).\n**RGPD** : base légale, minimisation, durée de conservation, droits des personnes (accès, rectification,\neffacement limité par les obligations légales), sécurité, privacy by design. Tension classique : RGPD\n(minimiser, effacer) vs LCB-FT (collecter, conserver) → l'obligation légale LCB-FT fonde la conservation.\n\n---"
