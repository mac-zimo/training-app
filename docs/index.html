<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Quiz — entretien senior .NET / Azure</title>
  <style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --fg: #1d2330;
  --muted: #5d6677;
  --line: #dde1e8;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --good: #2b8a3e;
  --good-soft: #e6f6ea;
  --bad: #c92a2a;
  --bad-soft: #fdeaea;
  --mid: #e67700;
  --code: #eef0f4;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b;
    --card: #1b2029;
    --fg: #e6e9ef;
    --muted: #9aa3b2;
    --line: #2c3340;
    --accent: #7b93ff;
    --accent-soft: #232c4a;
    --good: #5fd27a;
    --good-soft: #17301e;
    --bad: #ff7b7b;
    --bad-soft: #3a1c1f;
    --mid: #ffb84d;
    --code: #262c37;
    --shadow: none;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}

body.fiche-open { overflow: hidden; }

button { font: inherit; color: inherit; }

code {
  font: .9em ui-monospace, "Cascadia Code", Consolas, monospace;
  background: var(--code);
  padding: .1em .35em;
  border-radius: 4px;
}

/* ------------------------------------------------------------ barre du haut */
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .6rem 1rem;
  padding-top: calc(.6rem + env(safe-area-inset-top));
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.topbar button {
  background: none;
  border: 0;
  padding: .3rem .5rem;
  cursor: pointer;
  border-radius: 8px;
}
.topbar button:hover { background: var(--accent-soft); }
.topbar .brand { font-weight: 700; }
.topbar nav { display: flex; gap: .25rem; }

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 1rem;
}

/* ------------------------------------------------------------ blocs */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}
.card h2 { font-size: 1rem; margin: 0 0 .6rem; }
.card h2 + .seg, .card .seg + h2 { margin-top: .2rem; }
.card .seg + h2 { margin-top: 1rem; }
.center { text-align: center; }
.hint { color: var(--muted); font-size: .9rem; margin: .4rem 0; }
.warn { color: var(--mid); font-size: .9rem; }
.bad { color: var(--bad); }
.row { display: flex; gap: .5rem; align-items: center; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.row.small { font-size: .85rem; }

.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; text-align: center; }
.kpi strong { display: block; font-size: 1.25rem; }
.kpi span { color: var(--muted); font-size: .75rem; }

/* ------------------------------------------------------------ boutons */
.btn {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: .65rem 1rem;
  cursor: pointer;
  min-height: 44px;
}
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.big { width: 100%; font-size: 1.05rem; padding: .9rem; }

.link {
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  text-align: left;
}
.link:hover { text-decoration: underline; }

.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: .4rem .85rem;
  cursor: pointer;
  min-height: 36px;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.toggles { margin-top: 1rem; display: grid; gap: .4rem; }
.toggle { display: flex; align-items: center; gap: .4rem; font-size: .95rem; }
.toggle input { width: 1.1rem; height: 1.1rem; }

.sticky-start {
  position: sticky;
  bottom: 0;
  padding: .5rem 0 calc(.5rem + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 35%);
}

/* ------------------------------------------------------------ thèmes */
.themes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: .5rem;
}
.theme {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: .15rem;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: .55rem .65rem .8rem;
  cursor: pointer;
  overflow: hidden;
}
.theme.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.theme.empty { opacity: .45; }
.t-label { font-weight: 600; font-size: .92rem; line-height: 1.25; }
.t-meta { font-size: .78rem; color: var(--muted); }
.prio { color: var(--mid); letter-spacing: -1px; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--line); }
.bar span { display: block; height: 100%; background: var(--good); }

/* ------------------------------------------------------------ question */
.qhead { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; }
.progress { height: 4px; background: var(--line); border-radius: 2px; margin: .4rem 0 .8rem; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.qmeta { display: flex; flex-wrap: wrap; gap: .35rem; }
.tag { font-size: .75rem; padding: .15rem .55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.lvl1 { background: var(--good-soft); color: var(--good); }
.tag.lvl2 { background: var(--accent-soft); color: var(--accent); }
.tag.lvl3 { background: var(--bad-soft); color: var(--bad); }
.tag.hint-tag { background: var(--code); color: var(--muted); }
.question { font-size: 1.15rem; line-height: 1.4; margin: .8rem 0 1rem; }

.choices { display: grid; gap: .55rem; }
.choice {
  display: flex;
  gap: .7rem;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 10px;
  padding: .75rem .85rem;
  cursor: pointer;
  min-height: 48px;
  line-height: 1.4;
}
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice[disabled] { cursor: default; }
.choice .key {
  flex: none;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: 50%;
  background: var(--code);
  color: var(--muted);
  font-size: .8rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.picked .key { background: var(--accent); color: #fff; }
.choice.correct { border-color: var(--good); background: var(--good-soft); }
.choice.correct .key { background: var(--good); color: #fff; }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .key { background: var(--bad); color: #fff; }
.choice.missed { border-color: var(--good); border-style: dashed; }

textarea {
  width: 100%;
  font: inherit;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: .7rem;
  resize: vertical;
}
blockquote.mine {
  margin: 0 0 .8rem;
  padding: .6rem .8rem;
  border-left: 3px solid var(--line);
  color: var(--muted);
  white-space: pre-wrap;
}

.feedback {
  margin-top: 1rem;
  padding: .8rem 1rem;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
}
.feedback.ok { border-color: var(--good); background: var(--good-soft); }
.feedback.ko { border-color: var(--bad); background: var(--bad-soft); }
.feedback p { margin: .5rem 0; }
.expected { font-weight: 500; }
.fiche-link { display: inline-block; margin-top: .2rem; font-size: .95rem; }

.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.actions .btn.primary { flex: 1; }

/* ------------------------------------------------------------ résultats / stats */
.score { font-size: 2.6rem; font-weight: 800; margin: .2rem 0; }
.score.good { color: var(--good); }
.score.mid { color: var(--mid); }
.score.low { color: var(--bad); }
.table-wrap { overflow-x: auto; }
table.stats { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.stats th, table.stats td { padding: .45rem .4rem; border-bottom: 1px solid var(--line); text-align: left; }
table.stats .num { text-align: right; white-space: nowrap; }
details.review { border-bottom: 1px solid var(--line); padding: .5rem 0; }
details.review summary { cursor: pointer; font-weight: 500; }
.fiche-list { padding-left: 1.1rem; margin: 0; }
.fiche-list li { margin: .35rem 0; }

/* ------------------------------------------------------------ fiche (overlay) */
#fiche {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: var(--bg);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.fiche-bar {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  gap: .8rem;
  padding: .6rem 1rem;
  padding-top: calc(.6rem + env(safe-area-inset-top));
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.fiche-bar button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: .35rem .7rem; cursor: pointer; }
#fiche-title { font-weight: 600; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.md { max-width: 760px; margin: 0 auto; padding: 1rem 1rem 4rem; }
.md h1 { font-size: 1.45rem; }
.md h2 { font-size: 1.2rem; margin-top: 2rem; padding-bottom: .3rem; border-bottom: 1px solid var(--line); }
.md h3 { font-size: 1.05rem; margin-top: 1.5rem; }
.md h1, .md h2, .md h3, .md h4 { scroll-margin-top: 4rem; }
.md a { color: var(--accent); }
.md ul, .md ol { padding-left: 1.3rem; }
.md li { margin: .25rem 0; }
.md pre {
  background: var(--code);
  padding: .8rem;
  border-radius: 8px;
  overflow-x: auto;
  font-size: .85rem;
  line-height: 1.4;
}
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; font-size: .88rem; }
.md th, .md td { border: 1px solid var(--line); padding: .35rem .5rem; vertical-align: top; text-align: left; }
.md th { background: var(--code); }
.md blockquote { margin: .8rem 0; padding: .2rem .9rem; border-left: 3px solid var(--accent); color: var(--muted); }
.md .flash { animation: flash 2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }

@media (max-width: 480px) {
  main { padding: .75rem; }
  .kpis { gap: .2rem; }
  .kpi strong { font-size: 1.05rem; }
  .kpi span { font-size: .68rem; }
  .themes { grid-template-columns: repeat(2, 1fr); }
  .question { font-size: 1.05rem; }
}

/* ------------------------------------------------------------ parcours "Essentiel du poste" */
.card.ess { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent), var(--shadow); }
.card.ess .kpis { grid-template-columns: repeat(4, 1fr); margin: .5rem 0 .7rem; }
.card.ess .seg { margin-bottom: .2rem; }
.card.ess > .btn.primary { width: 100%; margin-top: .4rem; }
.tag.ess-tag { background: var(--accent); color: #fff; font-weight: 600; }
.tag.prio { background: var(--code); color: var(--mid); letter-spacing: -1px; }
.ess-row td:first-child .link { font-weight: 600; }
.expl { line-height: 1.5; }
.expl p { margin: .5rem 0; }
.expl ul, .expl ol { margin: .3rem 0 .5rem; padding-left: 1.2rem; }
.expl li { margin: .15rem 0; }
.expl code { background: var(--code); padding: 0 .25rem; border-radius: 4px; font-size: .9em; }
.expl a { color: var(--accent); }
</style>
  <script>
/*
 * Mini moteur Markdown (sous-ensemble GitHub) sans dépendance.
 * Utilisé par le quiz (rendu des fiches et du texte des questions) et par tools/build.mjs
 * (validation des ancres `ref`). Les slugs suivent l'algorithme de GitHub (github-slugger).
 */
(function (root) {
  "use strict";

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function unesc(s) {
    return String(s)
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/&amp;/g, "&");
  }

  function plain(html) {
    return unesc(String(html).replace(/<[^>]*>/g, ""));
  }

  // Algorithme de slug GitHub : minuscules, suppression de la ponctuation, espaces -> tirets.
  function slugify(text) {
    return String(text)
      .toLowerCase()
      .replace(/[^\p{L}\p{M}\p{N}\p{Pc}\- ]/gu, "")
      .replace(/ /g, "-");
  }

  // opts.link(href, textHtml) -> chaîne HTML ; par défaut lien externe pour http(s), texte sinon.
  function defaultLink(href, text) {
    if (/^https?:\/\//i.test(href)) {
      return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + text + "</a>";
    }
    return text;
  }

  function inline(src, opts) {
    opts = opts || {};
    var link = opts.link || defaultLink;
    var codes = [];
    var s = String(src).replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c);
      return "\u0000" + (codes.length - 1) + "\u0000";
    });
    s = esc(s);
    var links = [];
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, text, href) {
      links.push(link(unesc(href), text));
      return "\u0001" + (links.length - 1) + "\u0001";
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:])/g, function (_, pre, url) {
      links.push(link(unesc(url), url));
      return pre + "\u0001" + (links.length - 1) + "\u0001";
    });
    s = s.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
    s = s.replace(/\u0001(\d+)\u0001/g, function (_, i) { return links[+i]; });
    s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return "<code>" + esc(codes[+i]) + "</code>"; });
    return s;
  }

  var RE_FENCE = /^(\s*)(`{3,}|~{3,})(.*)$/;
  var RE_HEADING = /^(#{1,6})\s+(.*?)\s*#*\s*$/;
  var RE_HR = /^\s*([-*_])(\s*\1){2,}\s*$/;
  var RE_LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  var RE_QUOTE = /^\s*>/;

  function isTableStart(lines, i) {
    return /^\s*\|/.test(lines[i]) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1]);
  }

  function splitRow(line) {
    var s = line.trim().replace(/\\\|/g, "\u0002");
    if (s.charAt(0) === "|") s = s.slice(1);
    if (s.charAt(s.length - 1) === "|") s = s.slice(0, -1);
    return s.split("|").map(function (c) { return c.replace(/\u0002/g, "|").trim(); });
  }

  function indentOf(line) {
    return line.match(/^\s*/)[0].replace(/\t/g, "    ").length;
  }

  function startsBlock(lines, i) {
    var l = lines[i];
    return RE_FENCE.test(l) || RE_HEADING.test(l) || RE_HR.test(l) || RE_LIST.test(l) ||
      RE_QUOTE.test(l) || isTableStart(lines, i);
  }

  function render(md, opts) {
    opts = opts || {};
    var ctx = { opts: opts, slugs: opts._slugs || {}, headings: opts._headings || [] };
    var lines = String(md).replace(/\r\n?/g, "\n").split("\n");
    var html = renderLines(lines, ctx);
    return { html: html, headings: ctx.headings };
  }

  function renderLines(lines, ctx) {
    var out = [];
    var i = 0;
    var opts = ctx.opts;
    var m;
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      if ((m = line.match(RE_FENCE))) {
        var fence = m[2];
        var pad = m[1].length;
        var lang = m[3].trim();
        var code = [];
        i++;
        while (i < lines.length && lines[i].trim().indexOf(fence) !== 0) {
          code.push(lines[i].slice(Math.min(pad, indentOf(lines[i]))));
          i++;
        }
        i++;
        out.push('<pre><code' + (lang ? ' data-lang="' + esc(lang) + '"' : "") + ">" +
          esc(code.join("\n")) + "</code></pre>");
        continue;
      }

      if ((m = line.match(RE_HEADING))) {
        var level = m[1].length;
        var content = inline(m[2], opts);
        var base = slugify(plain(content));
        var slug = base;
        if (ctx.slugs[base] !== undefined) {
          ctx.slugs[base]++;
          slug = base + "-" + ctx.slugs[base];
        } else {
          ctx.slugs[base] = 0;
        }
        ctx.headings.push({ level: level, text: plain(content), slug: slug });
        out.push("<h" + level + ' id="' + esc((opts.idPrefix || "") + slug) + '">' + content + "</h" + level + ">");
        i++;
        continue;
      }

      if (RE_HR.test(line)) { out.push("<hr>"); i++; continue; }

      if (isTableStart(lines, i)) {
        var head = splitRow(line);
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        var t = '<div class="table-wrap"><table><thead><tr>' +
          head.map(function (c) { return "<th>" + inline(c, opts) + "</th>"; }).join("") +
          "</tr></thead><tbody>" +
          rows.map(function (r) {
            return "<tr>" + r.map(function (c) { return "<td>" + inline(c, opts) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table></div>";
        out.push(t);
        continue;
      }

      if (RE_QUOTE.test(line)) {
        var q = [];
        while (i < lines.length && RE_QUOTE.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + renderLines(q, ctx) + "</blockquote>");
        continue;
      }

      if (RE_LIST.test(line)) {
        var res = renderList(lines, i, ctx);
        out.push(res.html);
        i = res.next;
        continue;
      }

      var para = [line.trim()];
      i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !startsBlock(lines, i)) {
        para.push(lines[i].trim());
        i++;
      }
      out.push("<p>" + inline(para.join(" "), opts) + "</p>");
    }
    return out.join("\n");
  }

  function renderList(lines, start, ctx) {
    var first = lines[start].match(RE_LIST);
    var baseIndent = indentOf(lines[start]);
    var ordered = /\d/.test(first[2]);
    var items = [];
    var cur = null;
    var i = start;
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) {
        // ligne vide : la liste continue seulement si la suite est indentée ou un nouvel item de même niveau
        var j = i + 1;
        while (j < lines.length && /^\s*$/.test(lines[j])) j++;
        if (j < lines.length && cur && (indentOf(lines[j]) > baseIndent ||
            (RE_LIST.test(lines[j]) && indentOf(lines[j]) === baseIndent))) {
          cur.lines.push("");
          i = j;
          continue;
        }
        break;
      }
      var ind = indentOf(line);
      var m = line.match(RE_LIST);
      if (m && ind === baseIndent && /\d/.test(m[2]) === ordered) {
        cur = { lines: [m[3]], width: m[1].length + m[2].length + 1 };
        if (!items.length) cur.start = parseInt(m[2], 10);
        items.push(cur);
        i++;
        continue;
      }
      if (ind > baseIndent && cur) {
        cur.lines.push(line.slice(Math.min(ind, cur.width)));
        i++;
        continue;
      }
      if (cur && !m && !startsBlock(lines, i)) {
        // continuation paresseuse d'un paragraphe
        cur.lines.push(line.trim());
        i++;
        continue;
      }
      break;
    }
    var tag = ordered ? "ol" : "ul";
    var startAttr = ordered && items[0] && items[0].start && items[0].start !== 1 ? ' start="' + items[0].start + '"' : "";
    var html = "<" + tag + startAttr + ">" + items.map(function (it) {
      var inner = renderLines(it.lines, ctx);
      inner = inner.replace(/^<p>([\s\S]*?)<\/p>/, "$1");
      return "<li>" + inner + "</li>";
    }).join("") + "</" + tag + ">";
    return { html: html, next: i };
  }

  <script>
/*
 * Moteur du quiz — HTML/JS statique, sans dépendance, fonctionne en file:// et hors ligne.
 * Données : data/index.js (thèmes) + data/<id>.js (questions, via QUIZ.register)
 *           + data/fiches.js (fiches markdown embarquées, généré par tools/build.mjs).
 * Progression : localStorage (repli en mémoire si indisponible).
 */
(function () {
  "use strict";

  var QUIZ = (window.QUIZ = window.QUIZ || {});
  var MD = window.QUIZ_MD;

  // ---------------------------------------------------------------- registre
  var all = [];
  var byId = new Map();
  var themes = [];
  var fiches = {};

  QUIZ.register = function (list) {
    list.forEach(function (q) {
      if (byId.has(q.id)) { console.warn("Question en double ignorée :", q.id); return; }
      byId.set(q.id, q);
      all.push(q);
    });
  };
  QUIZ.setThemes = function (list) { themes = list.slice(); };
  QUIZ.registerFiches = function (map) { Object.assign(fiches, map); };

  // ---------------------------------------------------------------- stockage
  var KEY = "quiz-entretien-dotnet.v1";
  var storage = (function () {
    try {
      localStorage.setItem("__quiz_test", "1");
      localStorage.removeItem("__quiz_test");
      return localStorage;
    } catch (e) {
      var mem = {};
      return {
        getItem: function (k) { return k in mem ? mem[k] : null; },
        setItem: function (k, v) { mem[k] = String(v); },
        removeItem: function (k) { delete mem[k]; },
        volatile: true
      };
    }
  })();

  function defaults() {
    return {
      stats: {},       // id -> { n: essais, ok: réussites, last: bool, ts }
      history: [],     // { ts, total, ok, themes }
      session: null,
      prefs: { mode: "smart", themes: [], levels: [1, 2, 3], open: true, shuffle: true, count: 20, essScope: "top" }
    };
  }

  function load() {
    var d = defaults();
    try {
      var raw = JSON.parse(storage.getItem(KEY));
      if (raw && raw.stats) {
        d.stats = raw.stats;
        d.history = raw.history || [];
        d.session = raw.session || null;
        Object.assign(d.prefs, raw.prefs || {});

    } catch (e) { /* données corrompues : on repart de zéro */ }
    return d;
  }

  var db = load();
  function save() { try { storage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* quota */ } }

  // ---------------------------------------------------------------- utilitaires
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") el.className = v;
        else if (k === "html") el.innerHTML = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);

    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el) {
    for (var i = 1; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); continue; }
      el.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
    }
  }
  function md(s) { return MD ? MD.inline(s) : String(s).replace(/</g, "&lt;"); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function theme(id) {
    return themes.find(function (t) { return t.id === id; }) || { id: id, label: id, prio: 1 };
  }
  function pct(x) { return x === null || isNaN(x) ? "—" : Math.round(x * 100) + " %"; }
  function stars(n) { return "★★★".slice(0, n || 1); }
  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    var s = new Set(a);
    return b.every(function (x) { return s.has(x); });
  }
  function main() { return document.getElementById("main"); }
  function screen(name) {
    var m = main();
    m.innerHTML = "";
    m.setAttribute("data-screen", name);
    window.scrollTo(0, 0);
    return m;
  }

  // ---------------------------------------------------------------- statistiques
  // Banque principale = questions par thème. Les questions d'un parcours (q.track, ex. "essentiel",
  // générées depuis la fiche 00) ont leurs propres sessions et statistiques.
  function isMain(q) { return !q.track; }
  function essAll() { return all.filter(function (q) { return q.track === "essentiel"; }); }

  function statsOf(qs) {
    var r = { total: qs.length, seen: 0, mastered: 0, wrong: 0, n: 0, ok: 0 };
    qs.forEach(function (q) {
      var s = db.stats[q.id];
      if (!s) return;
      r.seen++; r.n += s.n; r.ok += s.ok;
      if (s.last === true) r.mastered++;
      if (s.last === false) r.wrong++;
    });
    r.rate = r.n ? r.ok / r.n : null;
    return r;
  }
  function themeStats(themeId) { return statsOf(all.filter(function (q) { return isMain(q) && q.theme === themeId; })); }
  function globalStats() { return statsOf(all.filter(isMain)); }

  // ---------------------------------------------------------------- sélection des questions
  function pool(prefs) {
    var th = new Set(prefs.themes.length ? prefs.themes : themes.map(function (t) { return t.id; }));
    var lv = new Set(prefs.levels.length ? prefs.levels : [1, 2, 3]);
    return all.filter(function (q) {
      return isMain(q) && th.has(q.theme) && lv.has(q.level) && (prefs.open || q.type !== "open");
    });
  }

  function applyMode(p, mode) {
    if (mode === "errors") p = p.filter(function (q) { var s = db.stats[q.id]; return s && s.last === false; });
    if (mode === "new") p = p.filter(function (q) { return !db.stats[q.id]; });
    return p;
  }
  function candidates(prefs) { return applyMode(pool(prefs), prefs.mode); }

  // Parcours "Essentiel du poste" : périmètre (top / ★★★ / toutes) + thèmes sélectionnés + mode.
  var ESS_FICHE = "00-essentiel-poste.md";
  var ESS_SCOPES = [["top", "Top 20"], ["p3", "★★★"], ["all", "Toutes"]];
  function essPool(prefs, scope) {
    var th = prefs.themes.length ? new Set(prefs.themes) : null;
    var sc = scope || prefs.essScope || "top";
    return essAll().filter(function (q) {
      return (!th || th.has(q.theme)) && (sc === "all" || (sc === "top" ? q.top : q.prio >= 3));
    });
  }
  function essCandidates(prefs) { return applyMode(essPool(prefs), prefs.mode); }

  function pick(prefs, list) {
    var p = shuffle((list || candidates(prefs)).slice());
    if (prefs.mode === "smart") {
      // erreurs d'abord, puis jamais vues, puis les plus anciennes
      var rank = function (q) {
        var s = db.stats[q.id];
        if (!s) return 1;
        return s.last === false ? 0 : 2;
      };
      p.sort(function (a, b) {
        var d = rank(a) - rank(b);
        if (d || rank(a) !== 2) return d;
        return db.stats[a.id].ts - db.stats[b.id].ts;
      });
    }
    var n = prefs.count > 0 ? Math.min(prefs.count, p.length) : p.length;
    p = p.slice(0, n);
    if (prefs.mode === "smart") shuffle(p);
    return p.map(function (q) { return q.id; });
  }

  // ---------------------------------------------------------------- session
  function startSession(ids) {
    if (!ids.length) return;
    var order = {};
    ids.forEach(function (id) {
      var q = byId.get(id);
      var idx = (q.choices || []).map(function (_, i) { return i; });
      order[id] = db.prefs.shuffle && (q.type === "mcq" || q.type === "multi") ? shuffle(idx) : idx;
    });
    db.session = { ids: ids, i: 0, results: {}, order: order, picked: [], startedAt: Date.now() };

    renderQuestion();
  }

  function record(q, ok, picked) {
    var S = db.session;
    S.results[q.id] = { ok: ok, picked: picked };
    var s = db.stats[q.id] || { n: 0, ok: 0 };
    s.n++;
    if (ok) s.ok++;
    s.last = ok;
    s.ts = Date.now();
    db.stats[q.id] = s;
    S.picked = [];
    save();
    renderQuestion();
  }

  function next() {
    var S = db.session;
    S.i++;
    S.picked = [];
    save();
    if (S.i >= S.ids.length) renderResults();
    else renderQuestion();
  }

  // ---------------------------------------------------------------- écran : accueil
  function renderHome() {
    var m = screen("home");
    var P = db.prefs;
    var g = globalStats();

    var count = function () { return candidates(P).length; };
    var startBtn = h("button", { class: "btn primary big", onclick: function () { startSession(pick(P)); } });
    function refreshStart() {
      var c = count();
      var n = P.count > 0 ? Math.min(P.count, c) : c;
      startBtn.textContent = c ? "Commencer (" + n + " question" + (n > 1 ? "s" : "") + ")" : "Aucune question pour ces filtres";
      startBtn.disabled = !c;
      if (!ess.length) return;
      var e = essCandidates(P).length;
      var en = P.count > 0 ? Math.min(P.count, e) : e;
      essBtn.textContent = e ? "Réviser l'essentiel (" + en + " question" + (en > 1 ? "s" : "") + ")" : "Aucune question pour ces filtres";
      essBtn.disabled = !e;
      essHint.textContent = "Le mode, le nombre de questions" + (P.themes.length ? " et les thèmes sélectionnés (" + P.themes.length + ")" : " et les thèmes") + " choisis ci-dessous s'appliquent aussi.";
      drawEssScopes();
    }

    append(m, h("section", { class: "card summary" },
      h("div", { class: "kpis" },
        kpi(g.total, "questions"),
        kpi(g.seen, "vues"),
        kpi(g.mastered, "maîtrisées"),
        kpi(g.wrong, "à revoir"),
        kpi(pct(g.rate), "réussite")),
      storage.volatile ? h("p", { class: "warn" }, "Stockage local indisponible : la progression sera perdue à la fermeture.") : null
    ));

    if (db.session && db.session.i < db.session.ids.length) {
      var S = db.session;
      append(m, h("section", { class: "card resume" },
        h("p", null, "Session en cours : question " + (S.i + 1) + " / " + S.ids.length),
        h("div", { class: "row" },
          h("button", { class: "btn primary", onclick: renderQuestion }, "Reprendre"),
          h("button", { class: "btn", onclick: function () { db.session = null; save(); renderHome(); } }, "Abandonner"))
      ));
    }

    // Essentiel du poste
    var ess = essAll();
    var essBtn = h("button", { class: "btn primary", onclick: function () { startSession(pick(P, essCandidates(P))); } });
    var essScopeBox = h("div", { class: "seg" });
    var essHint = h("p", { class: "hint" });
    function drawEssScopes() {
      essScopeBox.innerHTML = "";
      ESS_SCOPES.forEach(function (sc) {
        append(essScopeBox, h("button", {
          class: "chip" + ((P.essScope || "top") === sc[0] ? " on" : ""),
          onclick: function () { P.essScope = sc[0]; save(); refreshStart(); }
        }, sc[1] + " · " + essPool(P, sc[0]).length));
      });
    }
    if (ess.length) {
      var es = statsOf(ess);
      append(m, h("section", { class: "card ess" },
        h("div", { class: "row between" },
          h("h2", null, "Essentiel du poste"),
          fiches[ESS_FICHE]
            ? h("button", { class: "link small", onclick: function () { openFiche(ESS_FICHE, ""); } }, "📖 La fiche")
            : null),
        h("p", { class: "hint" }, "Les questions quasi certaines pour ce poste. Réponds à voix haute en 1 min, puis compare et auto-évalue-toi."),
        h("div", { class: "kpis" }, kpi(es.total, "questions"), kpi(es.seen, "vues"), kpi(es.mastered, "maîtrisées"), kpi(es.wrong, "à revoir")),
        essScopeBox, essHint, essBtn));
    }

    // Mode
    var modes = [
      ["smart", "Intelligent", "erreurs, puis nouvelles, puis anciennes"],
      ["random", "Aléatoire", "tirage au hasard"],
      ["new", "Nouvelles", "jamais vues"],
      ["errors", "Erreurs", "dernière réponse fausse"]
    ];
    var modeBox = h("div", { class: "seg" });
    var modeHint = h("p", { class: "hint" });
    function drawModes() {
      modeBox.innerHTML = "";
      modes.forEach(function (md_) {
        append(modeBox, h("button", {
          class: "chip" + (P.mode === md_[0] ? " on" : ""),
          onclick: function () { P.mode = md_[0]; save(); drawModes(); refreshStart(); }
        }, md_[1]));
        if (P.mode === md_[0]) modeHint.textContent = md_[2];
      });
    }
    drawModes();

    // Thèmes
    var themeBox = h("div", { class: "themes" });
    function drawThemes() {
      themeBox.innerHTML = "";
      themes.forEach(function (t) {
        var s = themeStats(t.id);
        var on = P.themes.indexOf(t.id) >= 0;
        append(themeBox, h("button", {
          class: "theme" + (on ? " on" : "") + (s.total ? "" : " empty"),
          title: t.label,
          onclick: function () {
            var k = P.themes.indexOf(t.id);
            if (k >= 0) P.themes.splice(k, 1); else P.themes.push(t.id);
            save(); drawThemes(); refreshStart();
          }
        },
          h("span", { class: "t-label" }, t.label),
          h("span", { class: "t-meta" },
            h("span", { class: "prio" }, stars(t.prio)),
            " " + s.total + " q" + (s.wrong ? " · " : ""),
            s.wrong ? h("span", { class: "bad" }, s.wrong + " ✗") : null),
          h("span", { class: "bar" }, h("span", { style: "width:" + (s.total ? Math.round(100 * s.mastered / s.total) : 0) + "%" }))
        ));
      });
    }
    drawThemes();
    var setThemes = function (ids) { P.themes = ids; save(); drawThemes(); refreshStart(); };

    // Niveaux
    var levelBox = h("div", { class: "seg" });
    function drawLevels() {
      levelBox.innerHTML = "";
      [[1, "1 · bases"], [2, "2 · confirmé"], [3, "3 · senior"]].forEach(function (l) {
        var on = P.levels.indexOf(l[0]) >= 0;
        append(levelBox, h("button", {
          class: "chip" + (on ? " on" : ""),
          onclick: function () {
            var k = P.levels.indexOf(l[0]);
            if (k >= 0) P.levels.splice(k, 1); else P.levels.push(l[0]);
            save(); drawLevels(); refreshStart();
          }
        }, l[1]));
      });
    }
    drawLevels();

    // Nombre
    var countBox = h("div", { class: "seg" });
    function drawCount() {
      countBox.innerHTML = "";
      [[10, "10"], [20, "20"], [40, "40"], [0, "Toutes"]].forEach(function (c) {
        append(countBox, h("button", {
          class: "chip" + (P.count === c[0] ? " on" : ""),
          onclick: function () { P.count = c[0]; save(); drawCount(); refreshStart(); }
        }, c[1]));
      });
    }
    drawCount();

    var toggle = function (key, label) {
      return h("label", { class: "toggle" },
        h("input", {
          type: "checkbox", checked: P[key],
          onchange: function (e) { P[key] = e.target.checked; save(); refreshStart(); }
        }), " " + label);
    };

    append(m,
      h("section", { class: "card" },
        h("h2", null, "Mode"), modeBox, modeHint),
      h("section", { class: "card" },
        h("div", { class: "row between" },
          h("h2", null, "Thèmes"),
          h("div", { class: "row small" },
            h("button", { class: "link", onclick: function () { setThemes([]); } }, "Tous"),
            h("button", { class: "link", onclick: function () {
              setThemes(themes.filter(function (t) { return t.prio >= 3; }).map(function (t) { return t.id; }));
            } }, "★★★"),
            h("button", { class: "link", onclick: function () {
              setThemes(themes.filter(function (t) { return themeStats(t.id).wrong > 0; }).map(function (t) { return t.id; }));
            } }, "Avec erreurs"))),
        h("p", { class: "hint" }, "Aucune sélection = tous les thèmes."),
        themeBox),
      h("section", { class: "card" },
        h("h2", null, "Niveau"), levelBox,
        h("h2", null, "Nombre de questions"), countBox,
        h("div", { class: "toggles" },
          toggle("open", "Inclure les questions ouvertes (auto-évaluées)"),
          toggle("shuffle", "Mélanger l'ordre des réponses"))),
      h("div", { class: "sticky-start" }, startBtn)
    );
    refreshStart();
  }

  function kpi(v, label) {
    return h("div", { class: "kpi" }, h("strong", null, String(v)), h("span", null, label));
  }

  // ---------------------------------------------------------------- écran : question
  function renderQuestion() {
    var S = db.session;
    if (!S) return renderHome();
    if (S.i >= S.ids.length) return renderResults();
    var q = byId.get(S.ids[S.i]);
    if (!q) { next(); return; }
    var m = screen("question");
    var res = S.results[q.id];
    var answered = res && res.ok !== null && res.ok !== undefined;
    var answeredCount = Object.keys(S.results).filter(function (k) { return S.results[k].ok !== null; }).length;
    var okCount = Object.keys(S.results).filter(function (k) { return S.results[k].ok === true; }).length;
    var t = theme(q.theme);

    append(m,
      h("div", { class: "qhead" },
        h("span", null, "Question " + (S.i + 1) + " / " + S.ids.length),
        h("span", null, answeredCount ? okCount + " / " + answeredCount + " ✓" : "")),
      h("div", { class: "progress" }, h("span", { style: "width:" + Math.round(100 * S.i / S.ids.length) + "%" })),
      h("div", { class: "qmeta" },
        q.track ? h("span", { class: "tag ess-tag" }, "Essentiel") : null,
        h("span", { class: "tag" }, q.section || t.label),
        q.track ? h("span", { class: "tag prio" }, stars(q.prio)) : h("span", { class: "tag lvl" + q.level }, "Niveau " + q.level),
        q.type === "multi" ? h("span", { class: "tag hint-tag" }, "Plusieurs réponses") : null,
        q.type === "open" && !q.track ? h("span", { class: "tag hint-tag" }, "Question ouverte") : null),
      h("h2", { class: "question", html: md(q.question) })
    );

    var actions = h("div", { class: "actions" });

    if (q.type === "open") {
      if (!res) {
        var ta = h("textarea", { rows: 5, placeholder: q.track
          ? "Réponds à voix haute en 1 min (ou note tes mots-clés), puis compare. Rien n'est enregistré."
          : "Formule ta réponse (à voix haute ou par écrit), puis compare. Rien n'est enregistré." });
        append(m, ta);
        append(actions, h("button", {
          class: "btn primary", onclick: function () { S.results[q.id] = { ok: null, text: ta.value }; save(); renderQuestion(); }
        }, "Voir les éléments de réponse"));
      } else {
        if (res.text) append(m, h("blockquote", { class: "mine" }, res.text));
        append(m, feedback(q, res));
        if (!answered) {
          append(actions,
            h("button", { class: "btn good", onclick: function () { record(q, true, []); } }, "Je savais ✓"),
            h("button", { class: "btn bad", onclick: function () { record(q, false, []); } }, "À revoir ✗"));
        } else {
          append(actions, nextBtn(S));
        }
      }
      append(m, actions);
      return;
    }

    var order = S.order[q.id] || q.choices.map(function (_, i) { return i; });
    var list = h("div", { class: "choices" });
    order.forEach(function (ci, pos) {
      var cls = "choice";
      if (answered) {
        var isAns = q.answer.indexOf(ci) >= 0;
        var wasPicked = res.picked.indexOf(ci) >= 0;
        if (isAns && wasPicked) cls += " correct";
        else if (isAns) cls += " missed";
        else if (wasPicked) cls += " wrong";
      } else if (S.picked.indexOf(ci) >= 0) {
        cls += " picked";
      }
      append(list, h("button", {
        class: cls, disabled: answered, "data-key": pos + 1,
        onclick: function () { choose(q, ci); }
      }, h("span", { class: "key" }, String(pos + 1)), h("span", { html: md(q.choices[ci]) })));
    });
    append(m, list);

    if (answered) {
      append(m, feedback(q, res));
      append(actions, nextBtn(S));
    } else if (q.type === "multi") {
      append(actions, h("button", {
        class: "btn primary", disabled: !S.picked.length,
        onclick: function () { record(q, sameSet(S.picked, q.answer), S.picked.slice()); }
      }, "Valider"));
    }
    append(actions, h("button", { class: "btn ghost", onclick: renderResults }, "Terminer"));
    append(m, actions);
  }

  function choose(q, ci) {
    var S = db.session;
    if (q.type === "multi") {
      var k = S.picked.indexOf(ci);
      if (k >= 0) S.picked.splice(k, 1); else S.picked.push(ci);
      save();
      renderQuestionKeepScroll();
    } else {
      record(q, q.answer.length === 1 && q.answer[0] === ci, [ci]);
    }
  }

  function renderQuestionKeepScroll() {
    var y = window.scrollY;
    renderQuestion();
    window.scrollTo(0, y);
  }

  function nextBtn(S) {
    var last = S.i + 1 >= S.ids.length;
    return h("button", { class: "btn primary", onclick: next }, last ? "Voir le résultat" : "Suivante →");
  }

  function feedback(q, res) {
    var box = h("div", { class: "feedback" + (res.ok === true ? " ok" : res.ok === false ? " ko" : "") });
    if (q.type !== "open") {
      append(box, h("strong", null, res.ok ? "Bonne réponse" : "Raté"));
      if (!res.ok) {
        append(box, h("p", { class: "expected", html: "Réponse : " + q.answer.map(function (i) { return md(q.choices[i]); }).join(" · ") }));
      }
    } else {
      append(box, h("strong", null, "Éléments de réponse"));
    }
    append(box, explanation(q));
    if (q.ref) append(box, ficheLink(q.ref));
    return box;
  }

  // Explication : markdown inline, ou bloc (paragraphes, listes, liens vers les fiches) si q.block.
  function explanation(q) {
    if (q.block && MD) return h("div", { class: "expl", html: MD.render(q.explanation || "", { link: ficheLinkHtml }).html });
    return h("p", { html: md(q.explanation || "") });
  }

  function ficheLink(ref) {
    var parts = ref.split("#");
    var file = parts[0].split("/").pop();
    var anchor = parts[1] ? decodeURIComponent(parts[1]) : "";
    if (fiches[file]) {
      return h("button", { class: "link fiche-link", onclick: function () { openFiche(file, anchor); } }, "📖 Revoir la fiche");
    }
    return h("a", { class: "link fiche-link", href: "../" + ref, target: "_blank", rel: "noopener" }, "📖 Revoir la fiche");
  }

  // ---------------------------------------------------------------- écran : résultats
  function renderResults() {
    var S = db.session;
    if (!S) return renderHome();
    var ids = S.ids.filter(function (id) { var r = S.results[id]; return r && r.ok !== null && r.ok !== undefined; });
    var ok = ids.filter(function (id) { return S.results[id].ok; });
    var wrong = ids.filter(function (id) { return !S.results[id].ok; });
    if (ids.length) {
      db.history.unshift({
        ts: Date.now(), total: ids.length, ok: ok.length,
        themes: Array.from(new Set(ids.map(function (id) { return byId.get(id).theme; })))
      });
      db.history = db.history.slice(0, 50);
    }
    db.session = null;
    save();

    var m = screen("results");
    var rate = ids.length ? ok.length / ids.length : null;
    append(m, h("section", { class: "card center" },
      h("h2", null, "Résultat"),
      h("p", { class: "score" + (rate === null ? "" : rate >= 0.8 ? " good" : rate >= 0.5 ? " mid" : " low") },
        ok.length + " / " + ids.length),
      h("p", { class: "hint" }, rate === null ? "Aucune réponse." : pct(rate) + " de bonnes réponses")));

    // par thème
    var per = {};
    ids.forEach(function (id) {
      var th = byId.get(id).theme;
      per[th] = per[th] || { ok: 0, n: 0 };
      per[th].n++;
      if (S.results[id].ok) per[th].ok++;
    });
    var keys = Object.keys(per);
    if (keys.length > 1) {
      append(m, h("section", { class: "card" }, h("h2", null, "Par thème"),
        h("table", { class: "stats" }, h("tbody", null, keys.map(function (k) {
          return h("tr", null, h("td", null, theme(k).label), h("td", { class: "num" }, per[k].ok + " / " + per[k].n));
        })))));
    }

    if (wrong.length) {
      append(m, h("section", { class: "card" }, h("h2", null, "À revoir (" + wrong.length + ")"),
        wrong.map(function (id) {
          var q = byId.get(id);
          return h("details", { class: "review" },
            h("summary", { html: md(q.question) }),
            q.type !== "open" ? h("p", { class: "expected", html: "Réponse : " + q.answer.map(function (i) { return md(q.choices[i]); }).join(" · ") }) : null,
            explanation(q),
            q.ref ? ficheLink(q.ref) : null);
        })));
    }

    append(m, h("div", { class: "actions" },
      wrong.length ? h("button", { class: "btn primary", onclick: function () { startSession(shuffle(wrong.slice())); } }, "Rejouer les erreurs") : null,
      h("button", { class: "btn", onclick: renderHome }, "Accueil")));
  }

  // ---------------------------------------------------------------- écran : statistiques
  function renderStats() {
    var m = screen("stats");
    var ess = essAll();
    var essRow = null;
    if (ess.length) {
      var es = statsOf(ess);
      essRow = h("tr", { class: "ess-row" },
        h("td", null, h("button", {
          class: "link", title: "Session Essentiel du poste",
          onclick: function () { startSession(pick(db.prefs, essPool({ themes: [], essScope: "all" }))); }
        }, "Essentiel du poste")),
        h("td", { class: "num" }, es.total),
        h("td", { class: "num" }, es.seen),
        h("td", { class: "num" }, es.mastered),
        h("td", { class: "num" + (es.wrong ? " bad" : "") }, es.wrong),
        h("td", { class: "num" }, pct(es.rate)));
    }
    var rows = themes.map(function (t) {
      var s = themeStats(t.id);
      return h("tr", null,
        h("td", null, h("button", {
          class: "link", title: "Session sur ce thème",
          onclick: function () { startSession(pick(Object.assign({}, db.prefs, { themes: [t.id], mode: "smart" }))); }
        }, t.label)),
        h("td", { class: "num" }, s.total),
        h("td", { class: "num" }, s.seen),
        h("td", { class: "num" }, s.mastered),
        h("td", { class: "num" + (s.wrong ? " bad" : "") }, s.wrong),
        h("td", { class: "num" }, pct(s.rate)));
    });
    append(m,
      h("section", { class: "card" },
        h("h2", null, "Progression par thème"),
        h("p", { class: "hint" }, "Toucher un thème lance une session sur ce thème."),
        h("div", { class: "table-wrap" }, h("table", { class: "stats" },
          h("thead", null, h("tr", null, ["Thème", "Q", "Vues", "OK", "✗", "Réussite"].map(function (x) { return h("th", null, x); }))),
          h("tbody", null, essRow, rows)))),
      db.history.length ? h("section", { class: "card" },
        h("h2", null, "Dernières sessions"),
        h("table", { class: "stats" }, h("tbody", null, db.history.slice(0, 15).map(function (x) {
          return h("tr", null,
            h("td", null, new Date(x.ts).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })),
            h("td", null, x.themes.length > 3 ? x.themes.length + " thèmes" : x.themes.map(function (id) { return theme(id).label; }).join(", ")),
            h("td", { class: "num" }, x.ok + " / " + x.total));
        })))) : null,
      dataSection()
    );
  }

  // Export/import par copier-coller (fonctionne aussi dans un cadre qui bloque téléchargements et dialogues),
  // plus fichier quand c'est possible. Fusion : pour chaque question, la donnée la plus récente gagne.
  function dataSection() {
    var msg = h("p", { class: "hint" }, "Pour passer d'un appareil à l'autre : exporter, copier le texte, le coller sur l'autre appareil, importer.");
    var area = h("textarea", { rows: 4, placeholder: "Progression au format JSON" });
    var resetArmed = false;
    var resetBtn = h("button", { class: "btn bad", onclick: function () {
      if (!resetArmed) {
        resetArmed = true;
        resetBtn.textContent = "Confirmer : tout effacer";
        setTimeout(function () { resetArmed = false; resetBtn.textContent = "Réinitialiser"; }, 4000);
        return;
      }
      var p = db.prefs; db = defaults(); db.prefs = p; save(); renderStats();
    } }, "Réinitialiser");

    function exportData() {
      var json = JSON.stringify({ stats: db.stats, history: db.history });
      area.value = json;
      area.select();
      var done = function (ok) { msg.textContent = ok ? "Copié dans le presse-papiers." : "Sélectionne le texte et copie-le."; };
      try { navigator.clipboard.writeText(json).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
      try {
        var a = h("a", { href: URL.createObjectURL(new Blob([json], { type: "application/json" })), download: "quiz-progression.json" });
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) { /* téléchargement bloqué */ }
    }

    function merge(txt) {
      try {
        var d = JSON.parse(txt);
        if (!d || !d.stats) throw new Error("format");
        Object.keys(d.stats).forEach(function (id) {
          var a = db.stats[id], b = d.stats[id];
          if (!a || (b.ts || 0) > (a.ts || 0)) db.stats[id] = b;
        });
        db.history = (d.history || []).concat(db.history).sort(function (x, y) { return y.ts - x.ts; }).slice(0, 50);
        save();
        renderStats();
      } catch (e) {
        msg.textContent = "Données invalides : colle le JSON exporté.";
      }
    }

    function importData() {
      if (area.value.trim()) { merge(area.value); return; }
      var input = h("input", { type: "file", accept: "application/json,.json" });
      input.addEventListener("change", function () {
        if (input.files[0]) input.files[0].text().then(merge);
      });
      input.click();
    }

    return h("section", { class: "card" },
      h("h2", null, "Données"),
      msg,
      area,
      h("div", { class: "row wrap", style: "margin-top:.5rem" },
        h("button", { class: "btn", onclick: exportData }, "Exporter"),
        h("button", { class: "btn", onclick: importData }, "Importer (collé ou fichier)"),
        resetBtn));
  }

  // ---------------------------------------------------------------- fiches
  function renderFicheList() {
    var m = screen("fiches");
    var hasFiches = Object.keys(fiches).length > 0;
    append(m, h("section", { class: "card" },
      h("h2", null, "Fiches de révision"),
      hasFiches ? null : h("p", { class: "warn" }, "Fiches non embarquées : lancer `node tools/build.mjs` pour générer data/fiches.js."),
      h("ul", { class: "fiche-list" }, fiches[ESS_FICHE] ? h("li", null,
        h("button", { class: "link", onclick: function () { openFiche(ESS_FICHE, ""); } }, fiches[ESS_FICHE].title),
        " ", h("span", { class: "prio" }, "à faire en premier")) : null, themes.map(function (t) {
        var f = fiches[t.fiche];
        return h("li", null, f
          ? h("button", { class: "link", onclick: function () { openFiche(t.fiche, ""); } }, f.title)
          : h("a", { class: "link", href: "../01-fiches/" + t.fiche, target: "_blank", rel: "noopener" }, t.label),
          " ", h("span", { class: "prio" }, stars(t.prio)));
      }))));
  }

  // Liens markdown : http(s) en externe, "NN-xxx.md#ancre" vers la fiche embarquée, le reste en texte.
  function ficheLinkHtml(href, text) {
    if (/^https?:\/\//i.test(href)) return '<a href="' + MD.esc(href) + '" target="_blank" rel="noopener">' + text + "</a>";
    var mm = href.match(/^(?:\.\/)?(\d\d-[\w-]+\.md)(?:#(.*))?$/);
    if (mm && fiches[mm[1]]) {
      return '<a href="#" data-fiche="' + MD.esc(mm[1]) + '" data-anchor="' + MD.esc(mm[2] || "") + '">' + text + "</a>";
    }
    return "<span>" + text + "</span>";
  }

  var ficheOpen = false;
  function openFiche(file, anchor) {
    var f = fiches[file];
    var view = document.getElementById("fiche");
    var body = document.getElementById("fiche-body");
    document.getElementById("fiche-title").textContent = f.title;
    var r = MD.render(f.md, { idPrefix: "f-", link: ficheLinkHtml });
    body.innerHTML = r.html;
    view.hidden = false;
    document.body.classList.add("fiche-open");
    if (!ficheOpen) {
      ficheOpen = true;
      try { history.pushState({ fiche: true }, ""); } catch (e) { /* iframe sandbox */ }
    }
    var target = anchor ? document.getElementById("f-" + decodeURIComponent(anchor)) : null;
    if (target) {
      target.scrollIntoView();
      target.classList.add("flash");
    } else {
      view.scrollTop = 0;
    }
  }

  function closeFiche(fromPop) {
    if (!ficheOpen) return;
    ficheOpen = false;
    document.getElementById("fiche").hidden = true;
    document.body.classList.remove("fiche-open");
    if (!fromPop) { try { history.back(); } catch (e) { /* ignore */ } }
  }

  // ---------------------------------------------------------------- démarrage
  function wire() {
    document.getElementById("nav-home").addEventListener("click", function () { closeFiche(); renderHome(); });
    document.getElementById("nav-stats").addEventListener("click", function () { closeFiche(); renderStats(); });
    document.getElementById("nav-fiches").addEventListener("click", function () { closeFiche(); renderFicheList(); });
    document.getElementById("fiche-close").addEventListener("click", function () { closeFiche(); });
    main().addEventListener("click", function (e) {
      var a = e.target.closest("a[data-fiche]");
      if (!a) return;
      e.preventDefault();
      openFiche(a.getAttribute("data-fiche"), a.getAttribute("data-anchor"));
    });
    document.getElementById("fiche-body").addEventListener("click", function (e) {
      var a = e.target.closest("a[data-fiche]");
      if (!a) return;
      e.preventDefault();
      openFiche(a.getAttribute("data-fiche"), a.getAttribute("data-anchor"));
    });
    window.addEventListener("popstate", function () { closeFiche(true); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && ficheOpen) { closeFiche(); return; }
      if (ficheOpen || main().getAttribute("data-screen") !== "question") return;
      if (e.target.tagName === "TEXTAREA" || e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^[1-9]$/.test(e.key)) {
        var b = main().querySelector('.choice[data-key="' + e.key + '"]:not([disabled])');
        if (b) { e.preventDefault(); b.click(); }
      } else if (e.key === "Enter") {
        var p = main().querySelector(".actions .btn.primary:not([disabled])");
        if (p) { e.preventDefault(); p.click(); }
      }
    });
  }

  function start() {
    var order = themes.map(function (t) { return t.id; });
    all.sort(function (a, b) {
      return order.indexOf(a.theme) - order.indexOf(b.theme) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    wire();
    renderHome();
  }

  function boot() {
    if (window.QUIZ_BUNDLED) { start(); return; }
    var srcs = themes
      .filter(function (t) { return !all.some(function (q) { return q.theme === t.id; }); })
      .map(function (t) { return "data/" + t.id + ".js"; });
    if (!Object.keys(fiches).length) srcs.push("data/fiches.js");
    if (!all.some(function (q) { return q.track; })) srcs.push("data/essentiel.js");
    var pending = srcs.length;
    if (!pending) { start(); return; }
    srcs.forEach(function (src) {
      var s = document.createElement("script");
      s.src = src;
      s.async = false;
      s.onload = s.onerror = function () { if (--pending === 0) start(); };
      document.head.appendChild(s);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

  </script>

  <script>
// Généré par tools/build.mjs à partir de 01-fiches/ — ne pas modifier à la main.
QUIZ.registerFiches({
 "01-agile.md": {
  "title": "01 — Agile & \"you build it, you ship it, you run it\" (agile)",
  "md": "# 01 — Agile & \"you build it, you ship it, you run it\" (`agile`)\n\n## En 30 secondes\nL'agilité, c'est livrer de la valeur par petits incréments, avec des boucles de feedback\ncourtes (produit, code, prod). Dans une squad produit comme User & KYC, l'équipe possède\nson périmètre de bout en bout : elle conçoit, code, teste, déploie et **exploite** en prod\n(astreinte, monitoring, incidents). \"You build it, you run it\" (Werner Vogels, Amazon)\nresponsabilise : on écrit du code qu'on sera content de débugger à 3h du matin.\n\n## Notions clés\n\n### Scrum\n- **Rôles** : Product Owner (valeur, backlog), Scrum Master (processus, obstacles), Developers.\n- **Événements** : Sprint (1–4 semaines), Sprint Planning, Daily (15 min, synchro sur l'objectif\n  de sprint, pas un reporting), Sprint Review (démo produit aux parties prenantes),\n  Rétrospective (amélioration du processus).\n- **Artefacts** : Product Backlog, Sprint Backlog, Increment. Engagements : Product Goal,\n  Sprint Goal, **Definition of Done**.\n- **Definition of Ready** (non officielle Scrum) vs **Definition of Done** (officielle) :\n  DoD typique en banque = code revu, tests verts, couverture des règles métier, déployé en\n  recette, monitoré (dashboards + alertes), doc/ADR à jour, sécurité vérifiée.\n\n### Kanban\n- Flux continu, limites de WIP, métriques de flux : **lead time**, **cycle time**, throughput.\n- Adapté au run / support / équipes plateformes.\n\n### Squads / modèle \"Spotify\"\n- Squad = équipe pluridisciplinaire autonome sur un domaine (≈ un **bounded context** DDD).\n- Tribe (groupe de squads), Chapter (même métier transverse), Guild (communauté d'intérêt).\n- Loi de Conway : l'architecture reflète l'organisation → découper les équipes selon les\n  domaines métier (Inverse Conway Maneuver). Lien direct avec DDD et microservices.\n\n### You build it, you ship it, you run it\n- **Build** : qualité intégrée (TDD, revue, CI).\n- **Ship** : CI/CD, déploiements fréquents et sûrs (feature flags, blue/green, canary).\n- **Run** : observabilité, alerting, astreinte, postmortems sans blâme, SLO.\n- Métriques **DORA** (DevOps Research and Assessment, ne pas confondre avec le règlement DORA) :\n  deployment frequency, lead time for changes, change failure rate, time to restore\n  (MTTR). Récemment : rework rate / fiabilité.\n\n### Pratiques d'ingénierie agile (XP)\n- TDD, pair/mob programming, intégration continue, refactoring continu, propriété collective\n  du code, petits commits, trunk-based development.\n- User stories : format \"En tant que… je veux… afin de…\", critères d'acceptation en\n  Given/When/Then (pont vers BDD), **INVEST** (Independent, Negotiable, Valuable, Estimable,\n  Small, Testable). Découpage vertical (une tranche de bout en bout) plutôt qu'horizontal.\n- Estimation : story points relatifs, planning poker, #NoEstimates (compter les items).\n\n### Agile en milieu réglementé\n- Contraintes : traçabilité des changements, séparation des tâches, validations conformité,\n  audits. Ça se gère **dans** le flux : exigences réglementaires dans la DoD, approbations\n  dans les pipelines (environnements protégés), traçabilité ticket ↔ commit ↔ déploiement.\n\n## Pièges et nuances\n- Le daily n'est pas un point de reporting au manager.\n- La vélocité n'est pas une mesure de productivité et ne se compare pas entre équipes.\n- \"Agile\" ≠ pas de doc : on documente ce qui sert (ADR, runbooks, contrats d'API).\n- Le run n'est pas une punition : c'est la source de feedback la plus riche sur le design.\n- Postmortem **blameless** : on cherche les causes systémiques, pas un coupable.\n\n## Questions d'entretien probables\n- **Que mets-tu dans une Definition of Done ?** Revue, tests, CI verte, déployé, observabilité\n  (logs/métriques/alertes), sécurité, doc/ADR, critères d'acceptation validés par le PO.\n- **Que signifie pour toi \"you build it, you run it\" ?** Responsabilité de bout en bout ; le design\n  intègre dès le départ l'exploitabilité (logs structurés, corrélation, health checks,\n  dashboards, alertes actionnables, runbooks) ; l'équipe fait l'astreinte → incitation à la qualité.\n- **Comment découper une grosse story ?** Verticalement : par règle métier, par cas nominal puis\n  cas d'erreur, par type de client, par canal ; livrer un premier incrément observable.\n- **Raconte un incident de prod que tu as géré.** Détection → mitigation (rollback, feature flag)\n  → communication → cause racine → actions correctives → postmortem.\n- **Comment gères-tu un désaccord technique dans l'équipe ?** Faits, critères explicites,\n  spike/POC timeboxé, ADR, décision réversible si possible, désaccord puis engagement.\n\n## Pour aller plus loin\n- Scrum Guide 2020 : https://scrumguides.org\n- *Accelerate* (Forsgren, Humble, Kim) — métriques DORA.\n- *Team Topologies* (Skelton, Pais) — stream-aligned teams, charge cognitive.\n- Google SRE Book (gratuit en ligne) — postmortems, SLO.\n"
 },
 "02-csharp.md": {
  "title": "02 — C# moderne & runtime .NET (csharp)",
  "md": "# 02 — C# moderne & runtime .NET (`csharp`)\n\n> **Mode d'emploi.** Chaque notion suit le même schéma : une explication courte, lisible sans\n> connaître le sujet, puis un encadré **À retenir** (ce qu'il faut savoir dire en entretien).\n> La veille de l'entretien, relire uniquement les encadrés.\n\n## En 30 secondes\n.NET (ex-.NET Core) est le runtime open source, cross-platform, qui a remplacé .NET Framework\n(Windows only, maintenu mais figé en 4.8.1). Rythme : une version majeure par an en novembre,\n**LTS** les années paires (3 ans de support), **STS** les années impaires (24 mois depuis .NET 9).\nRepères : .NET 8 LTS (nov. 2023), .NET 9 STS, **.NET 10 LTS (nov. 2025, C# 14)**, .NET 11 (nov. 2026,\n**à vérifier** au moment de l'entretien). Un senior doit maîtriser : types valeur/référence,\nmémoire et GC, async/await, LINQ, délégués et lambdas, génériques, DI, nullabilité, et les apports\nrécents du langage.\n\n## Notions clés\n\n### .NET Framework vs .NET (Core)\n**Le principe.** .NET Framework (2002) est la plateforme historique : liée à Windows et à IIS,\ninstallée sur la machine, elle évolue très peu depuis 4.8. En 2016, Microsoft a réécrit la\nplateforme pour la rendre cross-platform et performante : **.NET Core**. Depuis .NET 5 (2020), le mot\n\"Core\" a disparu : on dit simplement \".NET\". Les deux coexistent encore dans les SI bancaires, d'où\nles projets de migration.\n\n| | .NET Framework 4.x | .NET 5+ |\n|---|---|---|\n| OS | Windows | Windows, Linux, macOS, conteneurs |\n| Hébergement web | IIS + System.Web | Kestrel (+ IIS/Nginx/YARP en reverse proxy) |\n| Config | `web.config`/`app.config` | `appsettings.json`, variables d'env, Key Vault… |\n| DI | pas native | native (`Microsoft.Extensions.DependencyInjection`) |\n| Absent côté .NET | — | WCF serveur (→ CoreWCF/gRPC), Web Forms, Remoting, AppDomains |\n| Partage de code | .NET Standard 2.0 = compatible avec les deux |\n\n**.NET Standard** n'est pas un runtime : c'est un contrat d'API commun. Une librairie qui cible\n`netstandard2.0` est utilisable à la fois depuis .NET Framework 4.6.1+ et depuis .NET : pratique pour\nmigrer progressivement (on extrait le code métier dans une lib `netstandard2.0`, puis on migre les\napplications une par une).\n\n> **À retenir**\n> - .NET Framework = Windows, figé. .NET = cross-platform, une version par an, LTS les années paires.\n> - Migration : WCF serveur, Web Forms, `System.Web`, AppDomains n'existent pas en .NET.\n> - .NET Standard 2.0 = pont pour partager du code pendant une migration.\n\n### Types et mémoire\n**Le principe.** En C#, chaque type est soit un **type valeur**, soit un **type référence**.\n- Une variable de type valeur (`int`, `decimal`, `bool`, `DateTime`, `enum`, tout `struct`)\n  **contient directement la donnée**. L'affecter à une autre variable **copie** la donnée.\n- Une variable de type référence (`class`, `string`, tableaux, délégués) contient une **adresse**\n  vers un objet stocké sur le **tas managé**. L'affecter copie l'adresse : les deux variables\n  désignent **le même objet**.\n\n```csharp\nvar a = new Point(1, 2);      // struct\nvar b = a;  b.X = 10;         // a.X vaut toujours 1 : b est une copie\n\nvar c = new Client(\"Ana\");    // class\nvar d = c;  d.Nom = \"Bob\";    // c.Nom vaut \"Bob\" : c et d désignent le même objet\n```\n\n**Boxing.** Quand un type valeur est converti en `object` (ou en interface), .NET crée une \"boîte\"\nsur le tas pour le contenir : c'est une allocation, donc du travail pour le GC. Exemple :\n`object o = 42;` ou une vieille `ArrayList` d'`int`. Les génériques (`List<int>`) évitent le boxing.\n\n**`string` est immuable** : chaque modification crée une nouvelle chaîne. Concaténer dans une\nboucle de 10 000 tours = 10 000 chaînes intermédiaires → utiliser `StringBuilder`.\n\n**`record`** (C# 9) : une classe dont l'égalité se fait **par valeur** (deux records avec les mêmes\npropriétés sont `==`), avec `ToString` lisible, copie non destructive `with` et déconstruction.\n`record struct` (C# 10) : la même chose en type valeur. Idéal pour les Value Objects DDD, les DTO et\nles événements.\n\n```csharp\npublic record Money(decimal Amount, string Currency);\nvar m1 = new Money(10m, \"EUR\");\nvar m2 = m1 with { Amount = 20m };   // nouvelle instance, m1 inchangé\nbool same = m1 == new Money(10m, \"EUR\");   // true : égalité par valeur\n```\n\n**Performance sans allocation** : `readonly struct`, paramètres `in`/`ref`, `ref struct`,\n`Span<T>` / `Memory<T>`. Un `Span<T>` est une \"fenêtre\" sur une zone mémoire contiguë (tableau, pile,\nmémoire native) sans copie. C'est un `ref struct` : il ne peut **pas vivre sur le tas** (pas de champ\nde classe, pas de capture par lambda, pas de passage à travers un `await`). `Memory<T>` est son\néquivalent stockable.\n\n> **À retenir**\n> - Valeur = copie de la donnée ; référence = copie de l'adresse (objet partagé).\n> - Boxing = type valeur → `object` = allocation. Les génériques l'évitent.\n> - `record` = égalité par valeur + `with` → Value Objects, DTO, événements.\n> - `Span<T>` = vue sans copie, interdite sur le tas et à travers un `await`.\n\n### Garbage Collector\n**Le principe.** En .NET, on ne libère pas la mémoire à la main : le **Garbage Collector** (GC)\ndétecte périodiquement les objets que plus rien ne référence et récupère leur mémoire. Il repose sur\nune observation : **la plupart des objets meurent jeunes** (variables temporaires d'une requête). Le\ntas est donc découpé en **générations** :\n- **gen 0** : objets récents, collectée très souvent et très vite ;\n- **gen 1** : tampon entre les deux ;\n- **gen 2** : objets qui ont survécu (caches, singletons), collectée rarement, coûteuse.\n\nUn objet qui survit à une collecte est \"promu\" à la génération suivante. Cas particuliers :\n**LOH** (Large Object Heap, objets ≥ 85 000 octets, collectés avec la gen 2, non compactés par\ndéfaut) et **POH** (Pinned Object Heap, objets épinglés en mémoire).\n\n**Modes** : Workstation GC (applis desktop) vs **Server GC** (un tas par cœur, défaut en ASP.NET\nCore), concurrent/background GC. Depuis .NET 9, **DATAS** (activé par défaut avec Server GC) adapte la\ntaille du tas à la charge. Conteneurs : le GC respecte les limites mémoire du cgroup ;\n`DOTNET_GCHeapHardLimit` si besoin.\n\n**Le GC gère la mémoire, pas les ressources.** Une connexion SQL, un fichier ou une socket doivent\nêtre fermés au plus tôt, de façon déterministe : c'est le rôle de `IDisposable` et du mot clé `using`\n(`await using` pour `IAsyncDisposable`). Le finaliseur (`~MaClasse()`) n'est qu'un filet de sécurité.\n\n```csharp\nawait using var connection = new SqlConnection(cs);   // Dispose appelé en fin de bloc,\nawait connection.OpenAsync(ct);                        // même en cas d'exception\n```\n\n**Fuites mémoire typiques** (oui, c'est possible avec un GC : un objet encore référencé n'est jamais\ncollecté) : abonnement à un `event` jamais retiré, cache statique sans éviction, `HttpClient` mal\ngéré, closure qui capture un gros objet.\n\n> **À retenir**\n> - Générations 0/1/2 : collecter souvent les objets jeunes, rarement les vieux. LOH ≥ 85 000 octets.\n> - Server GC par défaut en ASP.NET Core ; respecte les limites du conteneur.\n> - `IDisposable` / `using` pour les ressources (connexions, fichiers), pas pour la mémoire.\n> - Fuite en .NET = référence oubliée (event, cache statique, closure).\n\n### async / await\n**Le principe.** Un appel HTTP ou SQL passe l'essentiel de son temps à **attendre** le réseau. En\ncode synchrone, le thread reste bloqué pendant cette attente, à ne rien faire. Sur un serveur, les\nthreads sont une ressource limitée : sous charge, ils sont tous bloqués et les requêtes s'empilent.\n\nAvec `async`/`await`, pendant l'attente, le thread est **rendu au pool** et peut servir une autre\nrequête. Quand la réponse arrive, la suite de la méthode (la **continuation**) reprend sur un thread\ndu pool. Le compilateur réalise ce découpage en transformant la méthode en **machine à états**.\n**Aucun thread n'est créé ni bloqué** pour attendre une I/O.\n\n```csharp\npublic async Task<Customer> GetCustomerAsync(Guid id, CancellationToken ct)\n{\n    var response = await _http.GetAsync($\"/customers/{id}\", ct);  // thread libéré ici\n    response.EnsureSuccessStatusCode();                            // reprise après la réponse\n    return (await response.Content.ReadFromJsonAsync<Customer>(ct))!;\n}\n```\n\nUne `Task` (ou `Task<T>`) représente une opération en cours qui produira un résultat (ou une\nexception) plus tard. `await` dit : \"si ce n'est pas fini, rends la main et reprends ici quand ce\nsera fini\".\n\n**Règles d'usage**\n- **Ne jamais bloquer** sur de l'async : `.Result`, `.Wait()`, `GetAwaiter().GetResult()` →\n  deadlock (si un SynchronizationContext attend le thread bloqué : UI, ASP.NET classique) et\n  **thread pool starvation** sous charge. \"Async all the way\".\n- `async void` uniquement pour les event handlers : ailleurs, l'exception n'est pas observable par\n  l'appelant et peut faire tomber le process. Toujours `async Task`.\n- **`CancellationToken`** propagé partout (requête HTTP annulée → requête SQL annulée).\n- `Task.WhenAll` pour lancer des I/O indépendantes en parallèle ; `Parallel.ForEachAsync` avec\n  `MaxDegreeOfParallelism` pour en traiter beaucoup en bornant la concurrence.\n- `Task` vs **`ValueTask`** : `ValueTask` évite une allocation quand le résultat est souvent déjà\n  disponible (cache) ; ne jamais l'attendre deux fois.\n- `ConfigureAwait(false)` : utile dans les librairies ; inutile en ASP.NET Core (pas de\n  SynchronizationContext).\n- `Task.Run` dans une API ASP.NET Core pour \"rendre async\" du code synchrone : inutile, consomme un\n  autre thread du même pool. `Task.Run` sert à décharger du **calcul** CPU (UI, batch).\n\n**Outils de concurrence asynchrone**\n- `IAsyncEnumerable<T>` + `await foreach` : consommer un flux élément par élément (pagination,\n  streaming).\n- `Channel<T>` : file producteur/consommateur en mémoire.\n- `SemaphoreSlim(n)` + `await WaitAsync()` : limiter à n opérations simultanées. Le mot clé `lock`\n  ne peut pas contenir d'`await`.\n\n> **À retenir**\n> - `await` libère le thread pendant l'I/O ; pas de thread dédié à l'attente.\n> - Jamais `.Result`/`.Wait()` : deadlock + starvation. Jamais `async void` hors event handler.\n> - `CancellationToken` partout, `Task.WhenAll` pour paralléliser, `SemaphoreSlim` pour borner.\n\n### LINQ\n**Le principe.** LINQ (Language Integrated Query) est un ensemble de méthodes d'extension\n(`Where`, `Select`, `OrderBy`, `GroupBy`…) qui permettent d'interroger n'importe quelle collection\nen leur passant des **lambdas** (voir [délégués](#délégués--delegate-action-func)).\n\n```csharp\nvar adultsToVerify = customers\n    .Where(c => c.Age >= 18 && c.KycStatus == KycStatus.Pending)\n    .OrderBy(c => c.CreatedAt)\n    .Select(c => c.Id);\n```\n\n**Exécution différée.** La ligne ci-dessus **n'exécute rien** : elle décrit une requête. Le travail\na lieu quand on énumère le résultat (`foreach`, `ToList()`, `Count()`, `First()`…). Conséquence :\nénumérer deux fois = exécuter deux fois (deux requêtes SQL, ou deux parcours). Si on a besoin du\nrésultat plusieurs fois, le matérialiser une fois avec `ToList()`.\n\n**`IEnumerable<T>` vs `IQueryable<T>`.**\n- `IEnumerable<T>` : la requête s'exécute **en mémoire**, en appelant les lambdas (délégués `Func`).\n- `IQueryable<T>` (EF Core) : la requête est un **arbre d'expressions** traduit en SQL et exécuté\n  par la base. Un `AsEnumerable()` ou `ToList()` trop tôt rapatrie toute la table avant de filtrer.\n\n**Méthodes à connaître** : `First` (exception si vide) vs `FirstOrDefault` (défaut si vide) vs\n`Single` (exception si 0 ou plus d'1). `Any()` plutôt que `Count() > 0`. `ToDictionary`,\n`ToLookup`, `Chunk`, `DistinctBy`, `MaxBy` (.NET 6+), `CountBy`/`AggregateBy`/`Index` (.NET 9).\n\n> **À retenir**\n> - Exécution différée : rien ne se passe avant l'énumération ; énumérer 2 fois = exécuter 2 fois.\n> - `IEnumerable` = en mémoire (délégués) ; `IQueryable` = traduit en SQL (arbre d'expressions).\n> - `Any()` > `Count() > 0` ; `Single` vérifie l'unicité, `First` non.\n\n### Délégués : `delegate`, `Action`, `Func`\n**Le principe.** Un **délégué** est un type qui représente \"une méthode ayant telle signature\".\nUne variable de ce type contient une **référence vers une méthode** (et vers l'objet sur lequel\nl'appeler) : on peut la stocker, la passer en paramètre et l'appeler plus tard. C'est l'équivalent\ntypé du fait de passer une fonction en paramètre en Python ou en JavaScript.\n\n```csharp\n// 1. Déclarer un type délégué : \"une méthode qui prend un Document et retourne un bool\"\npublic delegate bool DocumentRule(Document doc);\n\n// 2. Toute méthode ou lambda compatible peut lui être affectée\nstatic bool IsNotExpired(Document d) => d.ExpiresOn > DateOnly.FromDateTime(DateTime.UtcNow);\n\nDocumentRule rule = IsNotExpired;                 // \"method group\" : référence à une méthode\nDocumentRule hasNumber = d => d.Number is not null;   // lambda = méthode anonyme\nbool ok = rule(document);                         // appel (équivaut à rule.Invoke(document))\n```\n\n**`Action` et `Func` : les délégués génériques prêts à l'emploi.** Déclarer un type délégué pour\nchaque signature serait fastidieux. .NET fournit des délégués génériques qui couvrent presque tous\nles cas :\n\n| Type | Signature | Exemple |\n|---|---|---|\n| `Action` | aucun paramètre, ne retourne rien (`void`) | `Action log = () => Console.WriteLine(\"ok\");` |\n| `Action<T1, …, T16>` | 1 à 16 paramètres, `void` | `Action<string> print = Console.WriteLine;` |\n| `Func<TResult>` | aucun paramètre, retourne `TResult` | `Func<DateTime> now = () => DateTime.UtcNow;` |\n| `Func<T1, …, T16, TResult>` | 1 à 16 paramètres ; le **dernier** type est le retour | `Func<decimal, decimal, decimal> add = (a, b) => a + b;` |\n| `Predicate<T>` | 1 paramètre, retourne `bool` (historique) | `list.Find(x => x.IsActive)` |\n\nMoyen mnémotechnique : **Action agit** (pas de résultat), **Func calcule** (renvoie un résultat).\n\nOn déclare encore un `delegate` nommé quand on veut un nom métier explicite (`RequestDelegate`\ndans ASP.NET Core), ou quand la signature a des paramètres `ref`/`out`/`in`, que `Func`/`Action` ne\nsupportent pas. Attention : `Predicate<T>` et `Func<T, bool>` ont la même forme mais sont des types\n**différents**, non convertibles implicitement.\n\n**Où on les croise tous les jours**\n- **LINQ** : `Where(Func<T, bool>)`, `Select(Func<T, TResult>)`.\n- **Stratégie légère** : une table de règles au lieu d'un `switch` ou d'une hiérarchie de classes.\n  ```csharp\n  private static readonly Dictionary<DocumentType, Func<Document, bool>> Rules = new()\n  {\n      [DocumentType.IdCard]   = d => d.Number?.Length == 12,\n      [DocumentType.Passport] = d => d.Mrz is not null,\n  };\n  bool isValid = Rules[doc.Type](doc);\n  ```\n- **Callbacks et code à exécuter plus tard** : `Func<Task>` passé à une politique de retry,\n  `Func<IDbConnection>` injecté comme factory.\n- **ASP.NET Core** : les minimal APIs (`app.MapGet(\"/health\", () => Results.Ok())`) et les\n  middlewares (`app.Use(async (context, next) => { …; await next(context); })`) sont des délégués.\n\n**Multicast et `event`.** Un délégué peut référencer **plusieurs** méthodes (`+=` pour ajouter,\n`-=` pour retirer). L'appel les exécute toutes, dans l'ordre ; s'il y a une valeur de retour, seule\nla **dernière** est récupérée ; si l'une lève une exception, les suivantes ne sont pas appelées.\nUn **`event`** est un délégué protégé : de l'extérieur on peut seulement s'abonner (`+=`) ou se\ndésabonner (`-=`) ; seule la classe propriétaire peut le déclencher. Convention :\n`EventHandler<TEventArgs>`. Un abonné non désabonné reste référencé par l'émetteur → fuite mémoire.\n\n```csharp\npublic class KycService\n{\n    public event EventHandler<CustomerVerifiedEventArgs>? CustomerVerified;\n    private void OnVerified(Customer c) => CustomerVerified?.Invoke(this, new(c.Id));\n}\nkycService.CustomerVerified += (sender, e) => _notifier.Send(e.CustomerId);\n```\n\n> **À retenir**\n> - Délégué = référence typée vers une méthode, qu'on peut stocker, passer, appeler plus tard.\n> - `Action` = ne retourne rien ; `Func<…, TResult>` = le dernier type est le retour ;\n>   `Predicate<T>` = `bool`, historique.\n> - Lambda = méthode anonyme convertie en délégué.\n> - `delegate` nommé : nom métier ou paramètres `ref`/`out`.\n> - Multicast : `+=` ; seul le dernier retour est gardé. `event` = délégué encapsulé (abonnement\n>   seulement depuis l'extérieur).\n\n### Lambdas, closures et arbres d'expression\n**Closure (capture de variable).** Une lambda peut utiliser une variable locale de la méthode qui\nl'entoure : on dit qu'elle la **capture**. Le compilateur déplace alors cette variable dans une\nclasse cachée partagée entre la méthode et la lambda. Deux conséquences :\n1. la lambda voit **la variable elle-même**, pas une copie de sa valeur au moment de la création ;\n2. la capture coûte une **allocation** (la classe cachée), à surveiller dans le code très sollicité.\n\n```csharp\nvar actions = new List<Action>();\nfor (int i = 0; i < 3; i++)\n    actions.Add(() => Console.Write(i));\nactions.ForEach(a => a());   // affiche \"333\" : les 3 lambdas partagent la même variable i\n// avec foreach (C# 5+), chaque tour a sa propre variable → \"012\"\n```\n\nUne **lambda `static`** (C# 9) interdit toute capture : `static x => x * 2`. Le compilateur garantit\nalors l'absence d'allocation cachée.\n\n**Piège async : lambda `async` passée à une `Action`.** Une `Action` ne retourne rien, donc une\nlambda `async` convertie en `Action` devient un **`async void`** : personne n'attend la fin, et une\nexception n'est pas observée (crash possible).\n\n```csharp\nitems.ForEach(async item => await SendAsync(item));   // ForEach prend une Action<T> → asy
