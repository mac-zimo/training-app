nc void !\n\nforeach (var item in items) await SendAsync(item);     // séquentiel, correct\nawait Task.WhenAll(items.Select(item => SendAsync(item)));   // parallèle : Func<T, Task>\n```\n\n**Arbres d'expression : `Expression<Func<…>>`.** La même syntaxe lambda peut produire deux choses\nselon le type cible :\n- vers un `Func<…>` : du **code compilé**, exécutable ;\n- vers un `Expression<Func<…>>` : une **structure de données** qui décrit le code (un arbre\n  \"accès à la propriété `DueDate`, comparaison `<`, constante…\"). Un provider comme EF Core lit cet\n  arbre et le **traduit en SQL**.\n\n```csharp\nFunc<Order, bool> isLate = o => o.DueDate < today;\ndb.Orders.Where(isLate).ToList();       // Enumerable.Where : charge TOUTE la table, filtre en mémoire\n\nExpression<Func<Order, bool>> isLateExpr = o => o.DueDate < today;\ndb.Orders.Where(isLateExpr).ToList();   // Queryable.Where : WHERE DueDate < @today côté SQL\n```\n\n> **À retenir**\n> - Une closure capture la **variable**, pas sa valeur ; elle coûte une allocation. `static` lambda\n>   = pas de capture.\n> - Lambda `async` dans une `Action` = `async void` caché (ex. `List.ForEach(async …)`).\n> - `Func` = code exécuté en mémoire ; `Expression<Func>` = description traduisible en SQL. Passer un\n>   `Func` à un `IQueryable` filtre en mémoire après avoir tout chargé.\n\n### `Lazy<T>` : initialisation paresseuse\n**Le principe.** Certains objets sont coûteux à créer (chargement d'un référentiel, connexion,\nclient lourd) et ne sont pas toujours utilisés. `Lazy<T>` **retarde la création jusqu'au premier\naccès** à `.Value`, puis **garde le résultat** : les accès suivants renvoient la même instance. Par\ndéfaut, c'est **thread-safe** : même si dix threads accèdent à `.Value` en même temps, la factory\nn'est exécutée qu'une fois.\n\n```csharp\npublic class CountryRiskService\n{\n    private readonly Lazy<IReadOnlyDictionary<string, RiskLevel>> _risks =\n        new(() => LoadHighRiskCountries());          // méthode static ; rien n'est chargé ici\n\n    public RiskLevel RiskOf(string countryCode) =>\n        _risks.Value[countryCode];                   // 1er appel : chargement ; ensuite : cache\n}\n```\n`IsValueCreated` indique si la valeur a déjà été créée.\n\n**Modes de thread-safety** (`LazyThreadSafetyMode`)\n\n| Mode | Comportement | Usage |\n|---|---|---|\n| `ExecutionAndPublication` (défaut) | une seule exécution de la factory, les autres threads attendent | cas général |\n| `PublicationOnly` | plusieurs threads peuvent exécuter la factory ; le premier résultat gagne, les autres sont jetés | factory sans effet de bord, éviter un verrou |\n| `None` | aucune protection, le plus rapide | accès mono-thread uniquement |\n\n**Piège : l'exception mise en cache.** Avec une factory et le mode par défaut, si la factory lève\nune exception, **l'exception est mémorisée** : chaque accès à `.Value` relance la même exception,\nsans jamais réessayer. Pour une ressource réseau, une panne transitoire de 2 secondes rend le service\ninutilisable jusqu'au redémarrage. Parades : `PublicationOnly` (ne met pas l'exception en cache), ou\nrecréer le `Lazy` en cas d'échec.\n\n**Patterns utiles**\n- **Cache concurrent sans double calcul.** `ConcurrentDictionary.GetOrAdd(key, factory)` peut\n  exécuter la factory **plusieurs fois** en cas d'accès simultanés (une seule valeur est gardée,\n  mais le calcul coûteux a eu lieu plusieurs fois). En stockant des `Lazy`, seul le `Lazy` retenu\n  est évalué :\n  ```csharp\n  private readonly ConcurrentDictionary<Guid, Lazy<Task<Customer>>> _cache = new();\n\n  public Task<Customer> GetAsync(Guid id) =>\n      _cache.GetOrAdd(id, key => new Lazy<Task<Customer>>(() => LoadAsync(key))).Value;\n  ```\n- **`Lazy<Task<T>>` = \"async lazy\"** : l'opération asynchrone est lancée une seule fois et tous les\n  appelants attendent la même `Task`. Même piège que plus haut : une `Task` en échec reste en cache →\n  retirer l'entrée (`TryRemove`) quand elle échoue.\n- **`LazyInitializer.EnsureInitialized(ref _field, factory)`** : même idée sans objet `Lazy`\n  intermédiaire.\n- **Singleton** : `private static readonly Lazy<T> _instance = new(() => new T());`. En ASP.NET Core,\n  préférer `AddSingleton` : le conteneur crée déjà l'instance au premier besoin.\n\nLe conteneur DI de Microsoft ne sait **pas** injecter automatiquement un `Lazy<T>` ni un `Func<T>`\n(Autofac le fait) : il faut les enregistrer explicitement.\n\n> **À retenir**\n> - `Lazy<T>` = créé au premier `.Value`, une seule fois, thread-safe par défaut.\n> - Mode par défaut : l'exception de la factory est mise en cache (pas de retry).\n> - `ConcurrentDictionary<K, Lazy<V>>` garantit qu'une factory coûteuse ne s'exécute qu'une fois.\n> - `Lazy<Task<T>>` = async lazy ; penser à retirer l'entrée si la tâche échoue.\n\n### Génériques\n**Le principe.** Les génériques permettent d'écrire un type ou une méthode **une seule fois pour\nplusieurs types**, tout en restant typé à la compilation. `List<Customer>` n'accepte que des\n`Customer` : pas de cast, pas d'erreur à l'exécution, pas de boxing pour `List<int>` (contrairement à\nl'ancienne `ArrayList` qui stockait des `object`).\n\n**Contraintes** : restreindre les types acceptés pour pouvoir utiliser leurs capacités.\n```csharp\npublic T Max<T>(T a, T b) where T : IComparable<T> => a.CompareTo(b) >= 0 ? a : b;\n```\nContraintes disponibles : `class`, `struct`, `new()`, `notnull`, `unmanaged`, une classe de base, une\ninterface.\n\n**Variance** (pour les interfaces et délégués génériques) :\n- **covariance `out`** : `IEnumerable<string>` est utilisable là où on attend\n  `IEnumerable<object>`, car `T` n'est qu'en **sortie** (on ne fait que lire) ;\n- **contravariance `in`** : une `Action<object>` est utilisable là où on attend une\n  `Action<string>`, car `T` n'est qu'en **entrée** (qui sait traiter n'importe quel objet sait\n  traiter une chaîne) ;\n- `List<T>` est **invariante** : une `List<string>` n'est pas une `List<object>`, sinon on pourrait y\n  ajouter un `int`.\n\n> **À retenir**\n> - Génériques = réutilisation + typage fort + pas de boxing.\n> - Contraintes `where T : …` pour appeler des membres de `T`.\n> - `out` = covariance (sortie, `IEnumerable<out T>`, `Func<out TResult>`) ; `in` = contravariance\n>   (entrée, `Action<in T>`).\n\n### Nullabilité\n**Le principe.** La `NullReferenceException` est l'erreur la plus fréquente en .NET. Depuis C# 8,\navec `<Nullable>enable</Nullable>` (activé par défaut dans les nouveaux projets), le compilateur\ndistingue `string` (**ne devrait jamais être null**) et `string?` (**peut être null**), et émet des\navertissements quand on risque de déréférencer un null.\n\n```csharp\nstring? middleName = customer.MiddleName;   // peut être null\nint len = middleName?.Length ?? 0;          // ?. s'arrête si null ; ?? valeur par défaut\n_cache ??= new();                           // affecte seulement si null\nstring name = maybeNull!;                   // \"!\" : je garantis que ce n'est pas null (à justifier)\n```\n\nAttributs pour aider l'analyse : `[NotNullWhen(true)]` (ex. `TryGetValue`), `[MemberNotNull]`.\nC'est une **analyse statique** : elle n'existe pas à l'exécution. Une API publique doit donc toujours\nvalider ses entrées (`ArgumentNullException.ThrowIfNull(customer)`).\n\n> **À retenir**\n> - `string?` = peut être null ; `string` = ne devrait pas l'être. Avertissements du compilateur.\n> - Pas de garantie à l'exécution : valider les entrées publiques.\n> - `!` (null-forgiving) = dette, à justifier.\n\n### Pattern matching\n**Le principe.** Tester la **forme** d'une valeur (son type, ses propriétés, des plages de valeurs)\net en extraire des données en une seule expression, plutôt qu'une cascade de `if`/`else` et de casts.\nTrès utile pour exprimer des règles métier lisibles.\n\n```csharp\nvar fee = account switch\n{\n    { Type: AccountType.Premium } => 0m,                 // pattern de propriété\n    { Balance: < 0 } => 10m,                             // pattern relationnel\n    PersonalAccount { Age: >= 18 and < 26 } => 1m,       // type + propriétés + and\n    _ => 5m                                              // cas par défaut (discard)\n};\nif (evt is CustomerVerified { Level: KycLevel.Full } verified) { ... }   // test + extraction\nint[] arr = [1, 2, 3];\nif (arr is [1, .., var last]) { ... }   // list patterns (C# 11)\n```\n\n> **À retenir**\n> - `switch` expression + patterns de type, propriété, relationnels (`<`, `>=`), logiques\n>   (`and`, `or`, `not`), list patterns.\n> - Le compilateur signale un `switch` non exhaustif : toujours penser au cas `_`.\n\n### Évolutions du langage à connaître\n- **C# 9** : records, `init`, top-level statements, patterns relationnels/logiques, lambdas `static`.\n- **C# 10** : global usings, file-scoped namespaces, record struct, type naturel des lambdas\n  (`var f = (int x) => x * 2;`).\n- **C# 11** : `required`, raw string literals `\"\"\"`, list patterns, generic math, `file` types.\n- **C# 12** (.NET 8) : **primary constructors** sur les classes, **collection expressions** `[..]`,\n  alias de n'importe quel type, paramètres lambda par défaut.\n- **C# 13** (.NET 9) : `params` sur collections (`params ReadOnlySpan<T>`), nouveau type `Lock`,\n  propriétés partielles.\n- **C# 14** (.NET 10) : **extension members** (blocs `extension`, propriétés d'extension),\n  mot clé **`field`** dans les accesseurs, affectation null-conditionnelle `a?.B = x`,\n  conversions implicites vers `Span`, `nameof` sur génériques non liés.\n- **C# 15** (.NET 11, nov. 2026) : **à vérifier**.\n\n```csharp\n// C# 12 : primary constructor + collection expression\npublic class KycService(ICustomerRepository repo, TimeProvider clock)\n{\n    private readonly string[] _allowedCountries = [\"FR\", \"BE\", \"LU\"];\n}\n// C# 14 : field dans un accesseur (plus besoin de champ privé explicite)\npublic string Email { get; set => field = value.Trim().ToLowerInvariant(); }\n```\n\n> **À retenir** : savoir citer et montrer 2 ou 3 nouveautés récentes (primary constructors,\n> collection expressions, `field`, extension members) pour prouver qu'on est à jour.\n\n### Injection de dépendances\n**Le principe.** Une classe ne crée pas elle-même ses dépendances (`new SqlCustomerRepository()`) :\nelle les **reçoit**, en général par son constructeur, sous forme d'interfaces. Un **conteneur** (en\n.NET : `Microsoft.Extensions.DependencyInjection`) sait construire tout le graphe d'objets à partir\ndes enregistrements. Bénéfices : couplage faible, implémentation remplaçable (tests avec des\ndoubles, changement de base), configuration centralisée.\n\n```csharp\nbuilder.Services.AddScoped<ICustomerRepository, SqlCustomerRepository>();\nbuilder.Services.AddSingleton(TimeProvider.System);\n\npublic class OnboardingHandler(ICustomerRepository repo, TimeProvider clock) { ... }\n```\n\n**Durées de vie**\n\n| Durée de vie | Instance | Exemple |\n|---|---|---|\n| **Transient** | nouvelle à chaque résolution | service léger sans état |\n| **Scoped** | une par requête HTTP (ou par scope) | `DbContext`, unit of work |\n| **Singleton** | une pour toute l'application | cache, `TimeProvider`, client thread-safe |\n\n**Captive dependency** : un Singleton qui reçoit un service Scoped (ex. `DbContext`) le garde pour\ntoujours → état partagé entre requêtes, `DbContext` (non thread-safe) utilisé en concurrence.\nDétecté au démarrage par `ValidateScopes` (actif en Development). Règle : une dépendance doit vivre\nau moins aussi longtemps que celui qui la reçoit.\n\n**À connaître aussi**\n- `IHttpClientFactory` / clients typés : évite l'épuisement de sockets et les problèmes de DNS liés à\n  `new HttpClient()` par requête.\n- Options pattern : `IOptions<T>` (singleton), `IOptionsSnapshot<T>` (scoped, relu par requête),\n  `IOptionsMonitor<T>` (singleton avec notification de changement). Validation `ValidateOnStart()`.\n- Keyed services (.NET 8) : plusieurs implémentations d'une même interface, choisies par clé\n  (`[FromKeyedServices(\"sms\")]`).\n- `IHostedService` / `BackgroundService` : tâches de fond (ex. consommateur Service Bus).\n\n> **À retenir**\n> - DI = recevoir ses dépendances au lieu de les créer → testabilité, découplage.\n> - Transient / Scoped / Singleton. Piège : Scoped capturé par un Singleton (captive dependency).\n> - `IHttpClientFactory` plutôt que `new HttpClient()`.\n\n### Exceptions\n**Le principe.** Une exception signale qu'une opération **n'a pas pu se dérouler normalement**\n(base indisponible, bug, argument invalide). Elle remonte la pile d'appels jusqu'au premier `catch`\ncompatible. Lever une exception coûte cher et rend le flux moins lisible : on ne s'en sert pas pour\nles cas métier **attendus** (solde insuffisant, document refusé), qu'on modélise plutôt par un\n**Result pattern** (`Result<T>`, `OneOf`) ou par des exceptions de domaine explicites.\n\n```csharp\ntry { await _client.GetAsync(url, ct); }\ncatch (HttpRequestException ex) when (ex.StatusCode == HttpStatusCode.NotFound)   // filtre\n{\n    return null;\n}\ncatch (Exception ex)\n{\n    _logger.LogError(ex, \"Échec appel {Url}\", url);\n    throw;          // relance en conservant la stack trace (\"throw ex;\" la réinitialiserait)\n}\n```\n\n> **À retenir**\n> - Exceptions pour l'exceptionnel ; Result pattern pour les échecs métier attendus.\n> - `throw;` conserve la stack trace, `throw ex;` la perd.\n> - Filtres `when` ; ne jamais avaler une exception ; logger une seule fois, avec contexte.\n\n### Argent et dates (critique en banque)\n**Montants.** `double` et `float` stockent les nombres en base 2 : beaucoup de décimales simples\nn'y sont pas représentables exactement (`0.1 + 0.2` donne `0.30000000000000004`). Pour de l'argent :\n**`decimal`** (base 10), idéalement encapsulé dans un Value Object `Money` (montant + devise ISO 4217).\n\n**Arrondi.** `Math.Round` arrondit par défaut **au pair le plus proche** (`MidpointRounding.ToEven`,\ndit \"arrondi bancaire\") : `Math.Round(2.5m) == 2`, `Math.Round(3.5m) == 4`. Préciser\n`MidpointRounding.AwayFromZero` si la règle métier dit \"arrondi commercial\".\n\n**Dates.** Stocker et calculer en UTC avec `DateTimeOffset` ; `DateOnly` pour une date sans heure\n(date de naissance) ; `TimeProvider` (.NET 8) injecté pour rendre le temps testable\n(`FakeTimeProvider` dans les tests).\n\n> **À retenir**\n> - `decimal` pour l'argent, jamais `double`. Value Object `Money`.\n> - `Math.Round` = arrondi bancaire par défaut ; être explicite.\n> - UTC / `DateTimeOffset`, `DateOnly`, `TimeProvider` injecté.\n\n## Pièges et nuances\n- `==` sur `record` compare les valeurs ; sur `class` la référence (sauf surcharge).\n- Un `struct` mutable copié silencieusement → modifications perdues.\n- `foreach` sur une `List<T>` modifiée pendant le parcours → `InvalidOperationException`.\n- `Task.Run` dans ASP.NET Core pour \"rendre async\" un code synchrone = inutile, consomme un thread.\n- `static` mutable partagé entre requêtes = bug de concurrence.\n- `GetHashCode` doit être cohérent avec `Equals` (clés de dictionnaire).\n- `IEnumerable` retourné depuis un `using` : le `DbContext` est disposé avant l'énumération.\n- `List<T>.ForEach(async x => …)` : la lambda devient `async void`, rien n'est attendu.\n- Closure dans une boucle `for` : toutes les lambdas voient la dernière valeur de l'indice.\n- `Func<T, bool>` passé à `Where` sur un `IQueryable` : filtrage en mémoire après chargement complet.\n- Délégué multicast avec valeur de retour : seul le dernier résultat est récupéré.\n- `Lazy<T>` avec factory : une exception est mise en cache définitivement (mode par défaut).\n- `ConcurrentDictionary.GetOrAdd(key, factory)` : la factory peut s'exécuter plusieurs fois.\n\n## Questions d'entretien probables\n- **Différence `class` / `struct` / `record` ?** Référence vs valeur ; record = égalité par valeur\n  + `with` ; struct pour petits types immuables (< 16 octets conseillé).\n- **Comment fonctionne async/await ? Pourquoi éviter `.Result` ?** Machine à états, continuation,\n  pas de thread bloqué pendant l'I/O ; `.Result` bloque un thread, risque de deadlock et de starvation.\n- **`IEnumerable` vs `IQueryable` ?** Exécution en mémoire (délégués) vs traduction en requête par un\n  provider (arbre d'expressions).\n- **Qu'est-ce qu'un délégué ? Différence `Action` / `Func` ?** Référence typée vers une méthode ;\n  `Action` ne retourne rien, `Func` retourne son dernier paramètre de type. Usages : LINQ, callbacks,\n  stratégie, events, middlewares.\n- **Différence entre un délégué et un `event` ?** L'`event` encapsule le délégué : l'extérieur peut\n  seulement s'abonner/se désabonner, seul le propriétaire déclenche.\n- **Qu'est-ce qu'une closure ? Un piège ?** Capture de la variable (pas de sa valeur), allocation ;\n  boucle `for`, lambda `async` dans une `Action`.\n- **À quoi sert `Lazy<T>` ? Est-ce thread-safe ?** Création différée et unique ; thread-safe par\n  défaut (`ExecutionAndPublication`) ; exception mise en cache ; `ConcurrentDictionary<K, Lazy<V>>`.\n- **Durées de vie DI, et le piège classique ?** Captive dependency (Scoped dans Singleton).\n- **Pourquoi `IHttpClientFactory` ?** Pooling des handlers, rotation DNS, configuration centralisée,\n  intégration Polly/resilience.\n- **Qu'est-ce qui a changé de .NET Framework à .NET 8/10 ?** Cross-platform, perf, Kestrel, DI/config/\n  logging natifs, minimal APIs, AOT, conteneurs ; pertes : WCF serveur, Web Forms, AppDomains.\n- **Comment représenter un montant ?** `decimal` + devise (Value Object `Money`), arrondi explicite.\n\n## Pour aller plus loin\n- What's new in C# 14 / .NET 10 : https://learn.microsoft.com/dotnet/csharp/whats-new/\n- Délégués et lambdas : https://learn.microsoft.com/dotnet/csharp/programming-guide/delegates/\n- Lazy initialization : https://learn.microsoft.com/dotnet/framework/performance/lazy-initialization\n- Stephen Toub — articles \"Performance improvements in .NET\" (blog .NET).\n- *C# in Depth* (Jon Skeet) ; *Concurrency in C# Cookbook* (Stephen Cleary).\n"
 },
 "03-algo.md": {
  "title": "03 — Algorithmique, collections, concurrence (algo)",
  "md": "# 03 — Algorithmique, collections, concurrence (`algo`)\n\n## En 30 secondes\n\"Produire des algorithmes robustes\" = choisir la bonne structure de données, connaître la\ncomplexité de ce qu'on écrit, gérer les cas limites (vide, null, doublons, bornes, débordement),\net rester correct sous concurrence. En entretien : raisonner à voix haute, donner la complexité,\nécrire les tests des cas limites d'abord.\n\n## Notions clés\n\n### Complexité (notation O)\n- O(1) accès tableau / dictionnaire ; O(log n) recherche dichotomique, `SortedDictionary` ;\n  O(n) parcours ; O(n log n) tri ; O(n²) double boucle → souvent remplaçable par un `HashSet`/`Dictionary`.\n- Complexité spatiale aussi : charger 1,6 milliard de points en mémoire n'est pas une option →\n  streaming, agrégation incrémentale, pagination.\n\n### Collections .NET\n| Besoin | Collection | Coût |\n|---|---|---|\n| Liste indexée | `List<T>` | accès O(1), ajout amorti O(1), insertion au milieu O(n) |\n| Recherche par clé | `Dictionary<K,V>` | O(1) moyen |\n| Unicité / appartenance | `HashSet<T>` | O(1) moyen |\n| Trié par clé | `SortedDictionary` (arbre) / `SortedList` (tableaux) | O(log n) |\n| FIFO / LIFO | `Queue<T>` / `Stack<T>` | O(1) |\n| Priorité | `PriorityQueue<TElement,TPriority>` (.NET 6) | O(log n) |\n| Lecture seule figée | `FrozenDictionary`/`FrozenSet` (.NET 8) | lecture optimisée |\n| Immuable | `ImmutableList`, `ImmutableDictionary` | partage sûr entre threads |\n| Concurrent | `ConcurrentDictionary`, `ConcurrentQueue`, `Channel<T>` | thread-safe |\n\n- Exposer `IReadOnlyCollection<T>`/`IReadOnlyList<T>` depuis un agrégat (encapsulation DDD).\n\n### Techniques classiques\n- Deux pointeurs, fenêtre glissante, hash map pour \"a-t-on déjà vu\", tri + parcours,\n  dichotomie, récursion avec mémoïsation, parcours BFS/DFS (graphes de dépendances),\n  tri topologique (ordonnancement), machine à états (workflow d'onboarding).\n- Agrégations temporelles (séries de mesures) : buckets par pas de temps, moyenne glissante,\n  gestion des trous et doublons, fuseaux horaires.\n\n### Robustesse\n- Valider les entrées aux frontières (guard clauses), types forts (Value Objects) pour rendre\n  les états invalides non représentables.\n- Débordements : `checked`, `long`, `decimal` ; division par zéro ; listes vides ; égalité de flottants.\n- Idempotence : rejouer une opération donne le même résultat (essentiel en messaging).\n- Déterminisme : injecter l'horloge (`TimeProvider`) et l'aléatoire pour tester.\n\n### Concurrence\n- **Race condition** : lecture-modification-écriture non atomique. Outils : `lock`/`Lock`,\n  `Interlocked`, `ConcurrentDictionary.AddOrUpdate/GetOrAdd`, structures immuables.\n- `GetOrAdd(key, factory)` peut appeler la factory plusieurs fois → `Lazy<T>` dans la valeur.\n- Async : `SemaphoreSlim(1,1)` comme verrou asynchrone ; `Channel<T>` pour pipeline borné\n  (back-pressure).\n- **Concurrence distribuée** (plusieurs instances) : un `lock` en mémoire ne suffit plus →\n  concurrence optimiste (ETag / colonne `rowversion` / version d'agrégat), verrou distribué\n  (lease Blob, Redis), sessions Service Bus pour sérialiser par clé.\n- Deadlock : ordre d'acquisition des verrous cohérent, timeouts.\n\n## Pièges et nuances\n- Optimiser sans mesurer (BenchmarkDotNet, profiler, APM) ; le goulot est souvent l'I/O.\n- `Dictionary` non thread-safe même en lecture si une écriture est concurrente.\n- `List.Contains` dans une boucle = O(n²) caché.\n- LINQ lisible > boucle micro-optimisée, sauf chemin chaud mesuré.\n\n## Questions d'entretien probables\n- **Trouver les doublons dans une liste de clients (par email normalisé) ?** `HashSet` ou `GroupBy`,\n  O(n) ; normalisation (casse, espaces), cas vide.\n- **Comment éviter qu'un même message traité deux fois débite deux fois ?** Clé d'idempotence\n  stockée avec contrainte d'unicité dans la même transaction que l'effet.\n- **Deux instances de ton service modifient le même dossier client : que se passe-t-il ?**\n  Concurrence optimiste (version/ETag), retry sur conflit, ou sérialisation par clé.\n- **Tu dois agréger des millions de points : approche ?** Streaming (`IAsyncEnumerable`), agrégation\n  côté base, pré-calcul, partitionnement, ne stocker que les dérivés.\n\n## Pour aller plus loin\n- BenchmarkDotNet ; *Grokking Algorithms* ; doc `System.Collections.Concurrent` et `System.Threading.Channels`.\n"
 },
 "04-aspnet-api.md": {
  "title": "04 — ASP.NET Core & API REST (aspnet-api)",
  "md": "# 04 — ASP.NET Core & API REST (`aspnet-api`)\n\n## En 30 secondes\nUne API REST expose des **ressources** via HTTP, avec des verbes à la sémantique précise\n(sûreté, idempotence), des codes de statut corrects, un contrat versionné et documenté\n(OpenAPI), une sécurité OAuth2/OIDC et des erreurs normalisées (ProblemDetails, RFC 9457).\nASP.NET Core = pipeline de middlewares + endpoints (controllers ou minimal APIs) sur Kestrel.\n\n## Notions clés\n\n### HTTP et REST\n| Verbe | Sûr | Idempotent | Usage |\n|---|---|---|---|\n| GET | oui | oui | lire |\n| POST | non | **non** | créer / déclencher une action |\n| PUT | non | oui | remplacer entièrement |\n| PATCH | non | non (en général) | modification partielle (JSON Patch / Merge Patch) |\n| DELETE | non | oui | supprimer |\n\n- Codes : `200` OK, `201` Created (+ header `Location`), `202` Accepted (traitement asynchrone),\n  `204` No Content, `400` Bad Request, `401` non authentifié, `403` authentifié mais non autorisé,\n  `404`, `409` Conflict (concurrence, état incompatible), `412` Precondition Failed (ETag),\n  `422` Unprocessable Content (règle métier violée), `429` Too Many Requests, `500`, `502`/`503`/`504`.\n- **Idempotency-Key** sur POST sensibles (paiements, création de compte) : le serveur mémorise\n  la clé et renvoie la même réponse au rejeu.\n- Concurrence optimiste HTTP : `ETag` + `If-Match` → `412` si la ressource a changé.\n- Pagination (offset/limit vs **cursor/keyset**, plus stable et performant), filtrage, tri.\n- Versioning : URL (`/v1/`), header, media type. Ne jamais casser un contrat publié (ajout de\n  champs OK, suppression/renommage = nouvelle version).\n- Opérations longues : `202 Accepted` + ressource de statut (`/operations/{id}`) ou webhook.\n- Niveaux de maturité de Richardson (0 à 3, HATEOAS).\n\n### Pipeline ASP.NET Core\n- `Program.cs` : `WebApplication.CreateBuilder` → services (DI) → `app.Use...` middlewares → endpoints.\n- **L'ordre des middlewares compte** : exception handler → HTTPS/HSTS → routing → CORS →\n  authentication → authorization → rate limiter → endpoints.\n- Middleware custom : `async (context, next) => { ...; await next(context); ... }`.\n- Filtres MVC (action/exception/result filters) vs middlewares (transverses à toute requête).\n- Minimal APIs : `app.MapPost(\"/customers\", handler)`, `TypedResults`, `MapGroup`, endpoint filters,\n  validation intégrée (.NET 10, **à vérifier**).\n- Gestion d'erreurs : `AddProblemDetails()` + `UseExceptionHandler()` + `IExceptionHandler` (.NET 8).\n- Health checks : `/health/live` (process vivant) vs `/health/ready` (dépendances OK) — utilisés par\n  App Service, AKS, Container Apps.\n- Rate limiting natif (.NET 7) : fixed window, sliding window, token bucket, concurrency.\n- Output caching, response compression, `IHttpClientFactory` + resilience\n  (`Microsoft.Extensions.Http.Resilience`, Polly v8 : retry, circuit breaker, timeout, hedging).\n- OpenAPI : `Microsoft.AspNetCore.OpenApi` natif (.NET 9+), Swashbuckle historique.\n\n### Sécurité des API\n- **OAuth 2.0** (autorisation déléguée) + **OpenID Connect** (identité, ID token).\n- Flux : **Authorization Code + PKCE** (apps web/mobile/SPA), **Client Credentials** (service à\n  service), On-Behalf-Of (API qui appelle une API au nom de l'utilisateur). Implicit et Password = obsolètes.\n- **JWT** : header.payload.signature ; vérifier signature, `iss`, `aud`, `exp`, `nbf` ; scopes /\n  rôles. Ne jamais mettre de données sensibles dans le payload (encodé en base64, pas chiffré).\n- ASP.NET Core : `AddAuthentication().AddJwtBearer()` ou `Microsoft.Identity.Web` (Entra ID),\n  policies `AddAuthorization(o => o.AddPolicy(...))`, `[Authorize(Policy = \"...\")]`.\n- Pas d'**IDOR** : vérifier que la ressource demandée appartient bien à l'appelant\n  (OWASP API #1 : Broken Object Level Authorization).\n- mTLS entre services sensibles ; APIM en façade (validation JWT, quotas).\n\n### gRPC et autres\n- gRPC (HTTP/2, Protobuf, contrat fort, streaming) pour le service à service interne ;\n  remplaçant naturel de WCF. REST pour les API publiques/partenaires.\n\n## Pièges et nuances\n- POST non idempotent + retry client = double création → clé d'idempotence.\n- `401` vs `403` souvent confondus.\n- Exposer les entités EF directement en API → couplage, over-posting, fuite de données → DTO.\n- `async` de bout en bout, `CancellationToken` depuis `HttpContext.RequestAborted`.\n- Ne pas renvoyer de stack trace en prod (ProblemDetails sans détails internes).\n- CORS n'est pas une sécurité côté serveur ; c'est une protection du navigateur.\n\n## Questions d'entretien probables\n- **PUT vs PATCH, POST idempotent ?** Voir tableau ; POST rendu idempotent via `Idempotency-Key`.\n- **Comment versionner une API consommée par des partenaires ?** Version majeure dans l'URL,\n  évolutions rétrocompatibles, dépréciation annoncée (header `Deprecation`/`Sunset`), contrats testés.\n- **Comment sécuriser une API appelée par un autre microservice ?** Client Credentials avec Managed\n  Identity / Entra ID, validation de l'audience, scopes/app roles, réseau privé.\n- **Ordre des middlewares, pourquoi `UseAuthentication` avant `UseAuthorization` ?** L'autorisation\n  a besoin de l'identité établie.\n- **Comment gérer une opération longue (ex. vérification d'identité) ?** `202` + statut + événement/webhook.\n\n## Pour aller plus loin\n- RFC 9110 (HTTP semantics), RFC 9457 (Problem Details), draft IETF `Idempotency-Key`.\n- Microsoft REST API Guidelines (GitHub microsoft/api-guidelines).\n- OWASP API Security Top 10 (2023).\n"
 },
 "05-clean-code.md": {
  "title": "05 — Clean Code, SOLID, design patterns (clean-code)",
  "md": "# 05 — Clean Code, SOLID, design patterns (`clean-code`)\n\n## En 30 secondes\nLe code est lu beaucoup plus souvent qu'il n'est écrit. Clean Code = noms qui révèlent\nl'intention, fonctions courtes à un seul niveau d'abstraction, pas de duplication de\nconnaissance, dépendances maîtrisées, tests. SOLID donne cinq principes pour un design\nqui supporte le changement. Les design patterns sont un vocabulaire partagé de solutions,\npas une liste à appliquer partout.\n\n## Notions clés\n\n### Clean Code (Robert C. Martin) — essentiel\n- **Nommage** : intention, langage métier (ubiquitous language DDD), pas d'abréviations,\n  pas de `Manager`/`Helper`/`Utils` fourre-tout.\n- **Fonctions** : petites, une seule chose, un seul niveau d'abstraction, peu de paramètres,\n  pas d'arguments booléens (signe de deux fonctions), pas d'effets de bord cachés,\n  **Command/Query Separation** (une méthode modifie OU retourne).\n- **Guard clauses** et retours anticipés plutôt que `if` imbriqués (Gilded Rose !).\n- Commentaires : expliquer le **pourquoi**, pas le quoi ; le code doit dire le quoi.\n- **DRY** (duplication de connaissance, pas de texte), **KISS**, **YAGNI**.\n- **Tell, don't ask** et **loi de Déméter** (pas de `a.B.C.D()`).\n- **Boy Scout Rule** : laisser le code un peu plus propre qu'on l'a trouvé.\n\n### SOLID\n- **S — Single Responsibility** : une classe n'a qu'une raison de changer (un seul acteur métier).\n- **O — Open/Closed** : ouvert à l'extension, fermé à la modification. Ex. ajouter \"Conjured\" dans\n  Gilded Rose en ajoutant une classe, sans toucher au code des autres articles.\n- **L — Liskov Substitution** : un sous-type doit pouvoir remplacer son parent sans casser les\n  attentes (contre-exemple : `Square : Rectangle` ; une méthode qui lève `NotSupportedException`).\n- **I — Interface Segregation** : interfaces petites et ciblées côté client.\n- **D — Dependency Inversion** : les modules métier dépendent d'abstractions qu'ils possèdent ;\n  l'infrastructure implémente (base de l'architecture hexagonale). DI = mécanisme, DIP = principe.\n\n### Code smells (Fowler) → refactoring associé\n| Smell | Remède |\n|---|---|\n| Long Method | Extract Method |\n| Large Class | Extract Class |\n| Long Parameter List | Introduce Parameter Object |\n| Duplicated Code | Extract Method / Pull Up |\n| Switch Statements répétés sur un type | Replace Conditional with Polymorphism |\n| Primitive Obsession (string email, decimal amount) | Value Object |\n| Feature Envy | Move Method |\n| Data Clumps | Extract Class / Value Object |\n| Shotgun Surgery | Move Method/Field pour regrouper |\n| Divergent Change | Extract Class |\n| Magic numbers / strings | constantes nommées |\n| Anemic Domain Model | déplacer le comportement dans les entités |\n\n### Design patterns (GoF) utiles au quotidien\n- **Création** : Factory Method, Abstract Factory, Builder (tests : Test Data Builder), Singleton\n  (via DI, pas en statique).\n- **Structure** : Adapter (ports/adapters, ACL), Decorator (cache, logging, retry autour d'un service ;\n  Scrutor `Decorate`), Facade, Composite, Proxy.\n- **Comportement** : **Strategy** (règle variable selon le type — Gilded Rose), **State** (machine à états\n  d'un dossier KYC), Template Method, Chain of Responsibility (pipeline de validations, middlewares,\n  behaviors MediatR), Observer (événements), Command (CQRS), Specification (règles métier composables),\n  Visitor.\n- Patterns d'entreprise : Repository, Unit of Work, Mediator, Outbox, Result.\n\n### Composition plutôt qu'héritage\n- L'héritage couple fortement ; préférer composition + interfaces. Héritage seulement pour un vrai\n  \"est-un\" stable.\n\n## Pièges et nuances\n- Over-engineering : créer une interface pour chaque classe \"au cas où\", patterns sans besoin.\n  Le bon niveau d'abstraction dépend du changement **probable**.\n- DRY mal appliqué couple deux concepts qui se ressemblent par accident.\n- Petites méthodes ≠ éclatement illisible ; garder la cohésion.\n- Clean Code reste un livre d'opinions : savoir argumenter, pas réciter.\n\n## Questions d'entretien probables\n- **Explique SOLID avec un exemple de ton code.** Préparer un exemple concret par lettre (au moins S, O, D).\n- **Strategy vs State ?** Strategy : algorithme choisi par le client, interchangeable. State : le\n  comportement change selon l'état interne, les états gèrent les transitions.\n- **Qu'est-ce qu'un modèle anémique et pourquoi est-ce un problème ?** Entités = sacs de propriétés,\n  logique dans des services → invariants non protégés, duplication. DDD remet le comportement dans le domaine.\n- **Comment rendre ce `switch` extensible ?** Polymorphisme / dictionnaire de stratégies + factory ;\n  mais un `switch` exhaustif sur un enum fermé peut rester le plus lisible.\n- **Quand ne pas appliquer DRY ?** Quand la duplication est accidentelle (deux bounded contexts).\n\n## Pour aller plus loin\n- *Clean Code* (R. C. Martin), *Refactoring* 2e éd. (M. Fowler) et https://refactoring.com/catalog/\n- *Head First Design Patterns* ; https://refactoring.guru (smells + patterns illustrés).\n"
 },
 "06-tests.md": {
  "title": "06 — TDD, BDD, tests .NET (tests)",
  "md": "# 06 — TDD, BDD, tests .NET (`tests`)\n\n## En 30 secondes\nLes tests sont le filet de sécurité qui permet de changer le code sans peur — condition\ndu refactoring et du déploiement continu. **TDD** : écrire un test qui échoue, le faire passer\navec le code le plus simple, refactorer (Red → Green → Refactor). **BDD** : décrire le\ncomportement attendu en langage métier (Given/When/Then) avec le PO, et en faire des tests\nexécutables. En .NET : xUnit, un framework d'assertions, des doubles de test, et\nWebApplicationFactory / Testcontainers pour l'intégration.\n\n## Notions clés\n\n### TDD\n- Cycle : **Red** (test qui échoue pour la bonne raison) → **Green** (code minimal, \"fake it\",\n  triangulation) → **Refactor** (code ET tests, sous tests verts).\n- Les 3 lois (Uncle Bob) ; baby steps ; un seul test rouge à la fois.\n- Écoles : **Chicago/classique** (état, vrais objets, mocks aux frontières) vs **London/mockiste**\n  (outside-in, interactions, mocks des collaborateurs). Savoir les nommer et dire ce qu'on préfère :\n  en général classique dans le domaine, doubles aux ports (I/O).\n- Bénéfices : design émergent testable, documentation vivante, feedback rapide. Coûts : discipline,\n  tests fragiles s'ils testent l'implémentation.\n\n### Structure d'un test\n- **AAA** : Arrange / Act / Assert (ou Given / When / Then).\n- Nommage : `Quality_never_negative_when_item_expires` ou `Method_Scenario_Expected`.\n- Un comportement par test ; tester le comportement public, pas les détails privés.\n- **FIRST** : Fast, Independent, Repeatable, Self-validating, Timely.\n\n### xUnit (vs NUnit/MSTest)\n```csharp\npublic class MoneyTests\n{\n    [Fact]\n    public void Adding_two_amounts_in_same_currency_sums_them()\n    {\n        var result = Money.Eur(10m) + Money.Eur(5.5m);\n        Assert.Equal(Money.Eur(15.5m), result);\n    }\n\n    [Theory]\n    [InlineData(-1)]\n    [InlineData(-0.01)]\n    public void Negative_amount_is_rejected(decimal amount)\n        => Assert.Throws<ArgumentOutOfRangeException>(() => Money.Eur(amount));\n}\n```\n- `[Fact]`, `[Theory]` + `[InlineData]` / `[MemberData]` / `[ClassData]` / `TheoryData<T>`.\n- **Une nouvelle instance de la classe de test par test** : setup dans le constructeur, teardown via\n  `IDisposable` / `IAsyncLifetime`.\n- Partage de contexte coûteux : `IClassFixture<T>` (par classe), `ICollectionFixture<T>` (entre classes).\n- `ITestOutputHelper` pour logger. Tests parallèles par collection par défaut.\n- xUnit v3 (2024–2025) : nouvelle génération, exécutables de test, `TestContext` (**à vérifier** la\n  version utilisée dans le repo Gilded Rose).\n- Assertions : `Assert.*`, **Shouldly** ou **AwesomeAssertions** (fork libre de FluentAssertions —\n  FluentAssertions v8 est passé sous licence commerciale en 2025).\n\n### Doubles de test (Meszaros)\n- **Dummy** (remplit un paramètre), **Stub** (réponses préprogrammées), **Spy** (enregistre les appels),\n  **Mock** (attentes vérifiées sur les interactions), **Fake** (implémentation simplifiée qui marche :\n  repository en mémoire).\n- Librairies : **NSubstitute**, Moq (controverse SponsorLink en 2023), FakeItEasy.\n- Règle : \"ne mocke pas ce que tu ne possèdes pas\" → envelopper les SDK externes derrière un port.\n- Préférer des fakes en mémoire pour les repositories : tests plus lisibles et robustes.\n\n### Pyramide (et alternatives)\n- Beaucoup de tests unitaires, moins d'intégration, peu de E2E. Variante \"testing trophy\"/\"honeycomb\"\n  pour microservices : beaucoup de tests d'intégration au niveau du service.\n- **Intégration ASP.NET Core** : `WebApplicationFactory<Program>` (serveur en mémoire), remplacement de\n  services via `ConfigureTestServices`.\n- **Testcontainers** : vraie base SQL Server/PostgreSQL, émulateur Cosmos DB / Service Bus en Docker.\n- **Tests de contrat** entre microservices : Pact (consumer-driven contracts).\n- Tests d'architecture : NetArchTest / ArchUnitNET (le domaine ne référence pas l'infrastructure).\n\n### Tests sur du legacy (clé pour Gilded Rose)\n- **Characterization tests** (M. Feathers) : capturer le comportement **actuel**, même bugué, avant\n  de modifier.\n- **Approval / snapshot testing** : sortie entière comparée à un fichier approuvé (`*.verified.txt`).\n  Librairies : **Verify** (Verify.Xunit / Verify.XunitV3), ApprovalTests.Net.\n  Combinaisons : générer toutes les combinaisons (noms × sellIn × quality) et approuver la sortie.\n- **Couverture** : coverlet + ReportGenerator ; vise la couverture des branches du code à refactorer.\n- **Mutation testing** : **Stryker.NET** modifie le code (mutants) ; si les tests passent encore,\n  le mutant \"survit\" → trou dans le filet. Mesure la qualité réelle des tests, pas juste la couverture.\n\n### BDD\n- Conversations avant outils : **Three Amigos** (PO, dev, testeur), **Example Mapping**\n  (règles, exemples, questions).\n- Gherkin :\n  ```gherkin\n  Feature: Vérification d'identité à l'onboarding\n    Scenario: Client majeur avec pièce valide\n      Given un prospect né le 1990-05-12\n      And une pièce d'identité valide jusqu'au 2030-01-01\n      When il soumet son dossier\n      Then son dossier passe au statut \"En vérification\"\n  ```\n- Outils .NET : **Reqnroll** (successeur open source de SpecFlow, arrêté fin 2024), LightBDD.\n- BDD fonctionne aussi sans Gherkin : nommer les tests en langage métier.\n\n### Propriétés et autres techniques\n- Property-based testing : **FsCheck** / CsCheck (ex. \"la qualité reste dans [0,50] pour tout item normal\").\n- Temps testable : `TimeProvider` + `FakeTimeProvider` (.NET 8).\n\n## Pièges et nuances\n- 100 % de couverture ne prouve rien : couverture ≠ assertions pertinentes (→ mutation testing).\n- Tests trop couplés à l'implémentation (mocks partout) = cassent à chaque refactoring.\n- Tests non déterministes (`DateTime.Now`, ordre, parallélisme, réseau) = \"flaky\" → perte de confiance.\n- `Thread.Sleep` dans les tests asynchrones : préférer des signaux/polling borné.\n- TDD n'interdit pas de réfléchir au design avant ; il le fait émerger par petits pas.\n\n## Questions d'entretien probables\n- **Pratiques-tu le TDD ? Montre-moi.** Être prêt à le faire en live dans le kata (Conjured).\n- **Mock vs stub vs fake ?** Voir doubles de test.\n- **Comment tester un code legacy sans tests ?** Seams, characterization/approval tests, couverture,\n  mutation testing, puis refactoring en petits pas.\n- **Comment tester un handler Service Bus / une Azure Function ?** Logique métier extraite et testée\n  unitairement ; intégration avec émulateur/Testcontainers ; contrats de messages.\n- **Différence TDD/BDD ?** TDD : technique de conception du code par les tests ; BDD : collaboration sur\n  le comportement attendu, langage métier, tests d'acceptation.\n\n## Pour aller plus loin\n- *Test Driven Development: By Example* (Kent Beck) ; *Growing Object-Oriented Software, Guided by Tests*\n  (Freeman, Pryce) ; *Unit Testing Principles, Practices, and Patterns* (Khorikov).\n- Verify : https://github.com/VerifyTests/Verify ; Stryker.NET : https://stryker-mutator.io\n"
 },
 "07-refacto.md": {
  "title": "07 — Refactoring & code legacy, préparation Gilded Rose (refacto)",
  "md": "# 07 — Refactoring & code legacy, préparation Gilded Rose (`refacto`)\n\n## En 30 secondes\nRefactorer = changer la structure du code **sans changer son comportement observable**, par\npetites transformations sûres, sous la protection de tests. Code legacy = \"code sans tests\"\n(Michael Feathers). Sur un kata comme Gilded Rose, l'équipe évalue surtout la **démarche** :\nfilet de tests d'abord, petits pas, commits fréquents, noms métier, design final lisible et\nextensible, et capacité à expliquer ses choix à voix haute. Même démarche sur un kata inconnu, et\nmême grille de lecture pour une revue de code : comprendre, hiérarchiser, proposer en petits pas.\n\n## Notions clés\n\n### Principes\n- **Make the change easy, then make the easy change** (Kent Beck) : d'abord refactorer pour rendre\n  l'ajout simple, puis ajouter la feature.\n- Deux casquettes : on refactore **ou** on ajoute du comportement, jamais les deux en même temps.\n- Petits pas, tests verts après chaque pas, commit à chaque état vert (possibilité de revenir).\n- Utiliser les **refactorings automatisés de l'IDE** (Rider/ReSharper/Visual Studio) : plus sûrs.\n\n### Algorithme du changement sur code legacy (Feathers)\n1. Identifier les points de changement.\n2. Trouver les points de test.\n3. Casser les dépendances (**seams** : endroit où on peut changer le comportement sans modifier le code\n   à cet endroit — paramètre, interface, méthode virtuelle, sous-classe de test).\n4. Écrire les tests (characterization).\n5. Faire les changements et refactorer.\n\n### Catalogue utile (Fowler)\nExtract Method / Function, Inline Method, Rename, Extract Variable, Replace Temp with Query,\nDecompose Conditional, Consolidate Conditional Expression, **Replace Nested Conditional with Guard\nClauses**, **Replace Conditional with Polymorphism**, Replace Type Code with Subclasses / Strategy,\nIntroduce Parameter Object, Move Method, Extract Class, Split Loop, Slide Statements.\n\n### Techniques pour conditionnels imbriqués\n- Inverser les conditions (`!=` ↔ `==`) pour les rendre positives et lisibles.\n- **Lift-up conditional** (Emily Bache) : remonter une condition répétée en tête et dupliquer le code\n  dans chaque branche, puis simplifier chaque branche → isole le comportement par type d'article.\n- Supprimer le code mort révélé par la couverture.\n- Extraire des constantes nommées (`MaxQuality = 50`, `\"Aged Brie\"`).\n\n### Strangler Fig (à l'échelle d'un système)\n- Remplacer progressivement un système legacy en interceptant les appels (façade/proxy, ex. **YARP**)\n  et en migrant fonctionnalité par fonctionnalité. Pertinent pour la modernisation .NET Framework → .NET\n  et vers Azure (voir fiche `azure`).\n- **Branch by abstraction** : introduire une abstraction, deux implémentations, basculer, supprimer l'ancienne.\n\n## Gilded Rose — ce qu'il faut savoir\n\n### Règles métier (README du kata)\n- Chaque article a `SellIn` (jours restants pour vendre) et `Quality`. Chaque jour, les deux baissent.\n- Date dépassée (`SellIn < 0`) → la qualité baisse **deux fois plus vite**.\n- `Quality` jamais négative, jamais **> 50**.\n- **\"Aged Brie\"** : la qualité augmente avec le temps (deux fois plus vite après la date, dans\n  l'implémentation existante).\n- **\"Sulfuras, Hand of Ragnaros\"** : légendaire, ne se vend jamais, qualité fixe à **80**, ne change pas.\n- **\"Backstage passes to a TAFKAL80ETC concert\"** : +1 ; **+2 si SellIn ≤ 10** ; **+3 si SellIn ≤ 5** ;\n  **0 après le concert**.\n- **Nouvelle exigence** : les articles **\"Conjured\"** se dégradent deux fois plus vite que les normaux.\n- **Contrainte** : ne pas modifier la classe `Item` ni la propriété `Items` (appartiennent au \"gobelin\").\n  On peut rendre `UpdateQuality` et la classe `GildedRose` comme on veut.\n\n### Démarche recommandée (à dire à voix haute)\n1. **Lire** le README et le code, poser les questions (Conjured Aged Brie ? casse des noms ? Conjured\n   = nom qui commence par \"Conjured\" ?). Annoncer le plan.\n2. **Faire tourner** les tests existants (souvent un seul test qui échoue volontairement : `\"fixme\"`).\n3. **Filet de sécurité** :\n   - approval test sur la sortie du `TextTestFixture` (N jours) avec **Verify**, ou\n   - test combinatoire : tous les noms × plusieurs `SellIn` (-1, 0, 1, 5, 6, 10, 11) × plusieurs\n     `Quality` (0, 1, 49, 50, 80) → approuver la sortie ;\n   - vérifier la **couverture des branches** (100 % des branches de `UpdateQuality`) ;\n   - optionnel : **Stryker.NET** pour vérifier que le filet détecte les mutations.\n4. **Commit** \"add characterization tests\".\n5. **Refactorer en petits pas** (tests verts + commit à chaque pas) :\n   extraire une méthode par article → lift-up conditional sur le nom → constantes → simplifier chaque\n   branche → introduire le design cible.\n6. **Ajouter Conjured en TDD** (test rouge → vert), ce qui doit être trivial grâce au refactoring.\n7. **Conclure** : expliquer le design, les limites, ce qu'on ferait ensuite.\n\n### Designs cibles possibles (savoir comparer)\n| Design | Pour | Contre |\n|---|---|---|\n| Méthodes privées par catégorie + `switch` sur le nom | simple, lisible, rapide | `switch` à modifier pour chaque nouvel article |\n| **Strategy** : `IItemUpdater` par catégorie + factory (dictionnaire nom → updater) | Open/Closed, testable par catégorie | plus de classes |\n| Wrapper polymorphe (`ItemWrapper` abstrait autour de `Item`) | respecte la contrainte \"ne pas toucher Item\" | allocation de wrappers |\n| Table de règles / paramètres (taux de dégradation, bornes) | déclaratif | Backstage moins naturel |\n\nPoints d'attention : la factory doit gérer le préfixe \"Conjured\", la qualité bornée (clamp `Math.Clamp`\npour [0, 50] hors Sulfuras), l'ordre \"décrémenter SellIn puis appliquer la règle d'expiration\" fidèle à\nl'existant.\n\n### Ce que le jury observe\n- Tests **avant** toute modification. Commits petits et nommés.\n- Pas de \"big bang rewrite\" : réécrire de zéro en devinant les règles = drapeau rouge.\n- Nommage métier, suppression des magic strings.\n- Gestion du temps : un design simple terminé > un design ambitieux à moitié fait.\n- Communication : raisonner à voix haute, accepter les suggestions (souvent en pair programming).\n\n## Kata inconnu et revue de code en entretien\n\n### Kata inédit (ex. généré par IA), sans IA pour le coder\nUn kata généré par IA ressemble souvent à un kata classique \"maquillé\" (règles métier imbriquées, cas limites\ncachés, code de départ verbeux). Ce qui est évalué ne change pas : la démarche.\n1. **5 premières minutes** : lire tout l'énoncé, reformuler, lister les règles et les **cas limites** (bornes,\n   valeurs nulles/vides, ordre des règles, arrondis), poser les questions, écrire les hypothèses en commentaire\n   ou dans un `NOTES.md`.\n2. **Identifier le type** : code existant à faire évoluer → démarche legacy (caractérisation d'abord) ;\n   énoncé greenfield → TDD (liste d'exemples = liste de tests, du plus simple au plus riche).\n3. **Annoncer le plan et la timebox** (\"10 min de filet, 20 min de refactoring/feature, 5 min de bilan\").\n4. **Petits pas, commits fréquents**, design minimal qui fait passer les tests, refactoring sur vert.\n5. **Bilan à 5 min de la fin** même si inachevé : ce qui marche, ce qui manque, ce qu'on ferait ensuite.\n- Sans IA : les **refactorings automatisés de l'IDE** et les snippets/templates sont autorisés et rassurent\n  (rename, extract method, inline, change signature). Les maîtriser au clavier.\n- Si l'IA est interdite et que l'IDE en propose (Copilot, complétion pleine ligne), la **désactiver avant** et le\n  dire : une suggestion IA acceptée par réflexe serait mal perçue.\n\n### Revue de code existant\n**Posture** : on relit comme une PR d'un collègue. Commencer par le **contexte** (que fait ce code, quel est\nle besoin ?), lire les **tests** en premier s'il y en a, puis le code. Hiérarchiser à voix haute :\n**bloquant** (bug, sécurité, perte de données) > **important** (perf, résilience, testabilité, design) >\n**suggestion** (lisibilité, nommage) > **nit** (style, à laisser au formatter/analyzer). Formuler en\nquestions ou propositions argumentées, souligner aussi ce qui est bien fait. Ne pas tout réécrire : proposer\nle correctif minimal pour chaque point bloquant, et un test qui l'aurait détecté.\n\n**Checklist C# / .NET** (ce qu'on plante typiquement dans un extrait à relire) :\n- **Correction** : cas limites (null, liste vide, bornes, division), égalité/arrondi, logique inversée,\n  `DateTime.Now` non testable et sans fuseau (préférer `TimeProvider`), état mutable partagé.\n- **Argent** : `double`/`float` pour des montants (→ `decimal`, arrondi explicite, devise).\n- **Async** : `.Result`/`.Wait()` (deadlock, threads bloqués), `async void` hors event handler, absence de\n  `CancellationToken`, `Task` non attendue (fire-and-forget), `await` dans une boucle au lieu de `Task.WhenAll`\n  quand c'est sûr.\n- **Ressources** : `new HttpClient()` par appel (épuisement de sockets → `IHttpClientFactory`), `IDisposable`\n  non libéré, `DbContext` singleton ou partagé entre threads.\n- **Exceptions** : `catch (Exception)` vide ou qui avale l'erreur, `throw ex` (perd la stack → `throw;`),\n  exceptions pour le flux normal.\n- **Données / EF Core** : requête N+1, `ToList()` trop tôt, pas de pagination, SQL concaténé (injection),\n  pas de transaction là où il en faut, absence de gestion de concurrence.\n- **Sécurité** : secret en dur, données personnelles (identité, IBAN, pièce d'identité) **dans les logs**,\n  absence d'autorisation sur un endpoint, validation d'entrée manquante, désérialisation permissive.\n- **Messaging** : consumer non idempotent, `Complete` avant traitement, pas de dead-letter, publication\n  d'événement hors transaction (→ outbox).\n- **Design** : méthode trop longue, responsabilités mélangées (I/O + règles métier), dépendances concrètes\n  non injectables, primitive obsession (`string` pour un IBAN, un statut KYC), magic strings, duplication.\n- **Tests** : tests qui testent les mocks, assertions absentes ou trop faibles, tests dépendants de l'ordre\n  ou de l'horloge, noms qui ne décrivent pas le comportement.\n\n**Code généré par IA** (probable si le kata l'est) : API ou overload inventés, sur-ingénierie (interfaces et\nfactories inutiles), cas limites ignorés, gestion d'erreur décorative, commentaires qui paraphrasent le code,\ntests qui valident l'implémentation au lieu du besoin. Bon point à mentionner auprès d'un tech lead pro-IA :\nla revue devient le goulot, d'où l'intérêt de PR petites et d'analyzers en CI.\n\n## Pièges et nuances\n- Un refactoring qui change le comportement (même pour corriger un bug apparent) n'est plus un\n  refactoring : signaler le bug, demander au \"métier\", le corriger dans un commit séparé avec un test.\n- Approval tests : vérifier que la sortie approuvée couvre bien tous les cas (sinon faux sentiment de sécurité).\n- Ne pas modifier `Item` (piège classique du kata).\n- Trop d'abstraction pour 4 types d'articles peut être critiqué : justifier par l'extensibilité attendue.\n\n## Questions d'entretien probables\n- **Comment abordes-tu un code legacy que tu ne connais pas ?** Comprendre (lecture, run, logs), filet de\n  tests (caractérisation), petits refactorings sûrs, commits fréquents, mesurer (couverture/mutation).\n- **Qu'est-ce qu'un seam ?** Endroit où l'on peut substituer un comportement sans éditer le code à cet\n  endroit (interface, paramètre, méthode virtuelle).\n- **Réécriture vs refactoring ?** Refactoring incrémental par défaut (risque, valeur continue) ;\n  réécriture/strangler si la base est irrécupérable, avec un filet de non-régression.\n- **Quand t'arrêtes-tu de refactorer ?** Quand le changement demandé est simple et le code lisible ;\n  la valeur décroît ensuite.\n- **Comment fais-tu une revue de code ?** Contexte et besoin d'abord, tests ensuite, puis code ; hiérarchiser\n  bloquant / important / suggestion ; commentaires argumentés et actionnables ; automatiser le style (analyzers,\n  `dotnet format`) pour concentrer l'humain sur le fond ; PR petites.\n- **Qu'est-ce qui te fait bloquer une PR ?** Bug ou régression, faille de sécurité ou fuite de données\n  personnelles, absence de test sur une règle métier, changement non réversible sans plan (migration de schéma).\n\n## Pour aller plus loin\n- Repo : https://github.com/emilybache/GildedRose-Refactoring-Kata (dossier `csharp.xUnit`).\n- Emily Bache — vidéos \"Gilded Rose refactoring\" (lift-up conditional) et livre *Technical Agile Coaching*.\n- *Working Effectively with Legacy Code* (M. Feathers) ; *Refactoring* (M. Fowler).\n"
 },
 "08-ddd.md": {
  "title": "08 — Domain Driven Design (ddd)",
  "md": "# 08 — Domain Driven Design (`ddd`)\n\n## En 30 secondes\nDDD (Eric Evans, 2003) : concentrer l'effort sur le **domaine métier** complexe, en construisant\navec les experts un **langage omniprésent** (ubiquitous language) et un modèle exprimé\ndirectement dans le code. **Stratégique** : découper le système en **bounded contexts** cohérents\net cartographier leurs relations (context map). **Tactique** : modéliser chaque contexte avec\nentités, value objects, agrégats, événements de domaine, repositories. Le DDD sert à gérer la\ncomplexité métier ; il n'est pas utile partout (CRUD simple).\n\n## Notions clés\n\n### Stratégique\n- **Domaine / sous-domaines** : **core** (avantage concurrentiel, on y investit), **supporting**\n  (nécessaire, spécifique), **generic** (acheter/réutiliser : auth, envoi d'emails).\n- **Bounded Context** : frontière explicite dans laquelle un modèle et son langage sont cohérents.\n  \"Client\" n'a pas le même sens dans *Onboarding/KYC*, *Comptes*, *Paiements*, *Lutte anti-fraude*.\n- **Ubiquitous Language** : mêmes mots dans les conversations, les tickets, le code, les tests.\n- **Context Map** — relations entre contextes :\n  - Partnership, Shared Kernel (modèle partagé, couplage fort) ;\n  - Customer/Supplier (amont/aval) ; Conformist (l'aval subit le modèle amont) ;\n  - **Anti-Corruption Layer (ACL)** : couche de traduction qui protège notre modèle d'un modèle externe\n    (ex. API d'un prestataire de vérification d'identité, système legacy) ;\n  - Open Host Service + Published Language (API/événements publics documentés) ;\n  - Separate Ways.\n- **Event Storming** (Alberto Brandolini) : atelier post-its pour découvrir le domaine — événements\n  (orange, au passé), commandes (bleu), acteurs, agrégats (jaune), policies (lilas, \"quand X alors Y\"),\n  systèmes externes (rose), read models (vert), hotspots (rouge).\n- Bounded context ≈ frontière naturelle d'un microservice ou d'une squad (loi de Conway).\n\n### Tactique\n- **Entity** : identité stable dans le temps (`CustomerId`), cycle de vie, égalité par identité.\n- **Value Object** : défini par ses valeurs, **immuable**, auto-validé, égalité par valeur, sans identité\n  (`Money`, `Email`, `Iban`, `Address`, `DateOfBirth`). Combat la *primitive obsession*. En C# : `record`.\n- **Aggregate** : grappe d'entités/VO traitée comme une unité de cohérence, avec une **Aggregate Root**\n  seule point d'entrée. Il garantit ses **invariants** dans une transaction.\n  Règles de Vaughn Vernon :\n  1. protéger les vrais invariants dans les frontières de l'agrégat ;\n  2. concevoir de **petits agrégats** ;\n  3. référencer les autres agrégats **par identifiant** uniquement ;\n  4. **cohérence éventuelle** entre agrégats (via événements de domaine) — une transaction = un agrégat.\n- **Domain Event** : fait métier passé, nommé au passé (`IdentityVerified`, `CustomerOnboarded`),\n  immuable ; déclenche des réactions dans le même contexte ou d'autres (integration events).\n- **Domain Service** : logique métier qui n'appartient naturellement à aucune entité (sans état).\n- **Application Service** : orchestre un cas d'usage (charge l'agrégat, appelle le domaine, persiste,\n  publie) — pas de règle métier.\n- **Repository** : abstraction de collection d'agrégats (un repository **par agrégat**, pas par table) ;\n  interface dans le domaine, implémentation en infrastructure.\n- **Factory** : création complexe d'agrégats.\n- **Specification** : règle métier réutilisable et composable (`IsAdult`, `IsHighRiskCountry`).\n- Domain events vs **integration events** : les premiers sont internes au contexte ; les seconds sont\n  un contrat public versionné publié sur le bus (Service Bus).\n\n### Exemple : agrégat d'onboarding KYC (squad User & KYC)\n```csharp\npublic sealed class CustomerOnboarding  // Aggregate Root\n{\n    private readonly List<IDomainEvent> _events = [];\n    private readonly List<SubmittedDocument> _documents = [];\n\n    public OnboardingId Id { get; }\n    public OnboardingStatus Status { get; private set; } = OnboardingStatus.Draft;\n    public IReadOnlyList<SubmittedDocument> Documents => _documents;\n    public IReadOnlyList<IDomainEvent> Events => _events;\n\n    public void SubmitIdentityDocument(DocumentType type, DocumentRef reference, DateOnly expiresOn, DateOnly today)\n    {\n        if (Status is not (OnboardingStatus.Draft or OnboardingStatus.AwaitingDocuments))\n            throw new DomainException(\"Documents can only be submitted before verification.\");\n        if (expiresOn <= today)\n            throw new DomainException(\"Expired identity document.\");\n        _documents.Add(new SubmittedDocument(type, reference, expiresOn));\n        Status = OnboardingStatus.AwaitingVerification;\n        _events.Add(new IdentityDocumentSubmitted(Id, type));\n    }\n\n    public void MarkVerified(RiskLevel risk)\n    {\n        if (Status != OnboardingStatus.AwaitingVerification)\n            throw new DomainException(\"Nothing to verify.\");\n        Status = risk == RiskLevel.High ? OnboardingStatus.EnhancedDueDiligence : OnboardingStatus.Verified;\n        _events.Add(new CustomerVerified(Id, risk));\n    }\n}\n```\nPoints à souligner : setters privés, collection exposée en lecture seule, invariants dans les méthodes\nmétier, transitions d'état explicites (machine à états), événements levés, horloge passée en paramètre.\n\n### DDD et refactoring\n- Refactoring vers un modèle plus profond (*deep model*) ; extraire des VO depuis des primitives ;\n  déplacer la logique des services anémiques vers les entités.\n- Ne pas imposer DDD tactique à un sous-domaine générique/CRUD.\n\n## Pièges et nuances\n- Agrégats trop gros (tout le client avec tous ses comptes et transactions) → contention, perf.\n- Bounded context ≠ microservice obligatoirement (un monolithe modulaire peut contenir plusieurs contextes).\n- Partager les entités entre contextes via une librairie commune = couplage caché (Shared Kernel subi).\n- Repository générique `IRepository<T>` exposant `IQueryable` = fuite d'abstraction.\n- DDD ≠ des dossiers \"Entities/ValueObjects\" : c'est d'abord le langage et les frontières.\n- Événement de domaine nommé comme une commande (`VerifyCustomer`) = erreur.\n\n## Questions d'entretien probables\n- **Entity vs Value Object ?** Identité vs valeurs ; VO immuable, remplaçable.\n- **Comment choisis-tu les frontières d'un agrégat ?** Par invariants transactionnels réels ; petits ;\n  références par ID ; cohérence éventuelle sinon.\n- **Que se passe-t-il si une règle couvre deux agrégats ?** Revoir les frontières, ou cohérence éventuelle\n  via événements + saga/process manager, ou domain service + compensation.\n- **Qu'est-ce qu'un bounded context ? Exemple dans une banque ?** Onboarding/KYC, Comptes, Cartes,\n  Paiements, Conformité LCB-FT, Authentification forte (SCA).\n- **ACL : quand et comment ?** Intégration avec un fournisseur externe ou un legacy : adapter + traducteur,\n  le modèle externe ne \"fuit\" pas dans le domaine.\n- **Comment introduirais-tu DDD dans un legacy ?** Event Storming, identifier le core domain, strangler,\n  ACL autour du legacy, extraire progressivement un contexte.\n\n## Pour aller plus loin\n- *Domain-Driven Design* (Evans, \"blue book\") ; *Implementing DDD* (Vernon, \"red book\") ;\n  *Domain-Driven Design Distilled* (Vernon, court) ; *Learning DDD* (Vlad Khononov).\n- DDD Crew (GitHub) : context mapping, bounded context canvas.\n- Microsoft : \"Design a DDD-oriented microservice\" (eShopOnContainers guide).\n"
 },
 "09-archi.md": {
  "title": "09 — Clean Architecture, hexagonale, CQRS (archi)",
  "md": "# 09 — Clean Architecture, hexagonale, CQRS (`archi`)\n\n## En 30 secondes\nHexagonale (Ports & Adapters, Cockburn), Onion (Palermo) et Clean Architecture (Uncle Bob)\npartagent une seule idée : **le domaine métier au centre, sans dépendance vers l'infrastructure ;\nles dépendances pointent vers l'intérieur.** L'infrastructure (BDD, bus, HTTP, SDK Azure)\nimplémente des interfaces (ports) définies par le cœur. **CQRS** sépare le modèle d'écriture\n(commandes, invariants, agrégats) du modèle de lecture (requêtes, projections optimisées).\n\n## Notions clés\n\n### Hexagonale / Ports & Adapters\n- **Ports primaires (driving)** : ce que l'application offre (cas d'usage) ; appelés par les adapters\n  primaires : contrôleur REST, Azure Function, consumer Service Bus, test.\n- **Ports secondaires (driven)** : ce dont l'application a besoin (repository, publisher, client\n  externe) ; implémentés par les adapters secondaires : EF Core, Cosmos, Service Bus, HTTP.\n- Bénéfice : tester le cœur sans infrastructure ; changer de techno sans toucher au métier.\n\n### Clean Architecture — couches typiques d'une solution .NET\n```\nsrc/\n  Kyc.Domain/          # entités, VO, agrégats, événements, interfaces repo — aucune dépendance\n  Kyc.Application/     # cas d'usage (commands/queries + handlers), ports, DTO, validation\n  Kyc.Infrastructure/  # EF Core/Cosmos, Service Bus, clients HTTP, Key Vault — implémente les ports\n  Kyc.Api/             # composition root (DI), endpoints, middlewares, auth\ntests/\n  Kyc.Domain.Tests/  Kyc.Application.Tests/  Kyc.Api.IntegrationTests/  Kyc.ArchitectureTests/\n```\n- Règle de dépendance : Api → Application → Domain ; Infrastructure → Application/Domain.\n  Vérifiable par des tests d'architecture (NetArchTest).\n- **Composition root** : seul endroit qui connaît toutes les implémentations (Program.cs).\n- Alternative : **Vertical Slice Architecture** (Jimmy Bogard) : organiser par fonctionnalité\n  (`Features/SubmitDocument/`) plutôt que par couche ; couplage fort dans une slice, faible entre slices.\n  Souvent combinée à CQRS. Savoir comparer.\n- **Monolithe modulaire** : modules par bounded context dans un seul déployable, frontières strictes\n  (pas d'accès direct aux tables d'un autre module) → étape raisonnable avant les microservices.\n\n### CQRS\n- **Command** : intention de changer l'état (`SubmitIdentityDocument`), impératif, peut échouer, ne\n  retourne rien ou un identifiant. **Query** : lit sans effet de bord.\n- Niveaux :\n  1. séparer les méthodes/handlers (même base) ;\n  2. modèles de lecture dédiés (DTO projetés, requêtes SQL/Dapper directes) ;\n  3. **stores séparés** : écriture (event store / base normalisée) → projections asynchrones vers des\n     read models (Cosmos, SQL dénormalisé, cache, index de recherche) — **cohérence éventuelle**.\n- Bénéfices : modèles optimisés séparément, scalabilité lecture/écriture indépendante, domaine plus pur.\n- Coûts : complexité, cohérence éventuelle à gérer côté UX (afficher \"en cours\", read-your-writes).\n- CQRS n'implique **pas** Event Sourcing, mais ES implique presque toujours CQRS.\n\n### MediatR et alternatives\n- MediatR : `IRequest<T>` + `IRequestHandler`, **pipeline behaviors** (validation FluentValidation,\n  logging, transaction, idempotence). Depuis 2025, MediatR (et AutoMapper) sont passés sous licence\n  commerciale (Jimmy Bogard / Lucky Penny) → alternatives : handlers injectés directement,\n  Wolverine, Mediator (source generator), Brighter (**à vérifier** pour l'état actuel).\n- On peut faire du CQRS sans librairie : interfaces `ICommandHandler<TCommand>` + décorateurs.\n\n### ADR (Architecture Decision Records)\n- Courte note versionnée : contexte, décision, alternatives, conséquences. Trace des choix (utile aussi\n  pour l'audit en banque).\n\n## Pièges et nuances\n- Clean Architecture mal appliquée = cérémonie : 6 projets, mappings partout, pour un CRUD.\n- Le domaine qui référence EF Core (attributs `[Table]`, `DbContext`) viole la règle de dépendance —\n  configurer via `IEntityTypeConfiguration` en infrastructure. Compromis pragmatiques acceptables si assumés.\n- Abstraire `DbContext` derrière un repository générique n'apporte rien ; un repository par agrégat oui.\n- CQRS avec projections asynchrones : prévoir le rejeu/reconstruction des projections.\n\n## Questions d'entretien probables\n- **Différence hexagonale / onion / clean ?** Même principe (dépendances vers le centre) ; vocabulaires et\n  découpages différents ; hexagonale insiste sur ports/adapters symétriques.\n- **Où mets-tu la validation ?** Format/syntaxe à l'entrée (API/application) ; invariants métier dans le\n  domaine (VO, agrégat). Pas de duplication de règles métier dans l'API.\n- **Pourquoi CQRS ? Quand ne pas l'utiliser ?** Lectures/écritures aux besoins très différents, domaine\n  riche ; pas pour un CRUD simple.\n- **Comment gères-tu la cohérence éventuelle côté front ?** Statut \"en cours\", retour de l'ID et polling,\n  notifications (SignalR/webhooks), lecture sur le write model juste après écriture si nécessaire.\n- **Vertical slices vs couches ?** Cohésion par feature vs séparation technique ; souvent mix des deux.\n\n## Pour aller plus loin\n- Alistair Cockburn — \"Hexagonal Architecture\" (article original).\n- *Clean Architecture* (R. C. Martin) ; Jason Taylor / Steve \"Ardalis\" Smith — templates Clean Architecture .NET.\n- Greg Young — \"CQRS Documents\" ; Martin Fowler — \"CQRS\" (bliki).\n"
 },
 "10-microservices.md": {
  "title": "10 — Microservices & patterns distribués (microservices)",
  "md": "# 10 — Microservices & patterns distribués (`microservices`)\n\n## En 30 secondes\nUn microservice est un service autonome, aligné sur un **bounded context**, qui possède **ses\ndonnées**, se déploie indépendamment et communique via API ou messages. Bénéfices : autonomie\ndes équipes, déploiements indépendants, scalabilité ciblée, isolation des pannes. Prix :\ncomplexité distribuée (réseau non fiable, cohérence éventuelle, observabilité, versioning des\ncontrats). Les patterns clés : **Database per service, Outbox, Inbox/idempotence, Saga,\nAPI Gateway, Circuit Breaker / Retry, Correlation ID**.\n\n## Notions clés\n\n### Principes\n- **Faible couplage, forte cohésion** ; découpe par capacité métier / bounded context, jamais par couche\n  technique.\n- **Database per service** : aucune autre équipe ne lit tes tables ; partage via API/événements.\n- Déploiement indépendant ; contrats versionnés et rétrocompatibles.\n- **Fallacies of distributed computing** : le réseau n'est pas fiable, la latence n'est pas nulle,\n  la bande passante n'est pas infinie, le réseau n'est pas sûr, la topologie change, etc.\n- Anti-pattern : **monolithe distribué** (services qui doivent être déployés ensemble, appels\n  synchrones en chaîne, base partagée).\n\n### Communication\n- **Synchrone** (REST/gRPC) : simple, couplage temporel (si B tombe, A échoue). À limiter en chaîne.\n- **Asynchrone** (messages/événements, Service Bus) : découplage temporel, absorption des pics, mais\n  cohérence éventuelle et debugging plus difficile.\n- **Commande** (un destinataire, \"fais ceci\") vs **événement** (diffusé, \"ceci s'est produit\").\n- **Orchestration** (un coordinateur dit qui fait quoi) vs **chorégraphie** (chacun réagit aux événements).\n  Orchestration : visibilité du processus (Durable Functions, process manager). Chorégraphie : couplage\n  faible mais flux implicite difficile à suivre.\n\n### Cohérence des données\n- Pas de transaction distribuée (2PC à éviter, non supporté entre la plupart des services cloud).\n- **Saga** : suite de transactions locales, chacune publiant un événement ; en cas d'échec,\n  **transactions de compensation** (annuler/rembourser). Orchestrée ou chorégraphiée.\n- **Transactional Outbox** : le problème du *dual write* (écrire en base ET publier sur le bus : l'un\n  peut échouer). Solution : écrire l'état métier **et** le message dans une table `Outbox` dans la\n  **même transaction** ; un relais (background service, CDC, change feed Cosmos) publie ensuite sur le bus\n  et marque le message comme envoyé. Garantie : **at-least-once**.\n- **Inbox / consommateur idempotent** : le consommateur enregistre l'ID des messages traités (contrainte\n  d'unicité) dans la même transaction que l'effet → les doublons sont ignorés.\n- **Exactly-once** de bout en bout n'existe pas en pratique : at-least-once + idempotence = effectively-once.\n- Outils .NET qui implémentent outbox/inbox/sagas : MassTransit (licence commerciale depuis v9, **à vérifier**),\n  NServiceBus (commercial), Wolverine, Brighter, Dapr.\n\n### Résilience\n- **Timeout** sur tout appel réseau ; **Retry** avec backoff exponentiel + jitter, uniquement sur erreurs\n  transitoires et opérations idempotentes ; **Circuit Breaker** (ouvert après N échecs, semi-ouvert pour\n  tester) ; **Bulkhead** (isoler les ressources) ; **Fallback** ; **Hedging**.\n- .NET : `Microsoft.Extensions.Http.Resilience` (`AddStandardResilienceHandler()`) basé sur Polly v8.\n- **Rate limiting** et back-pressure ; **load shedding**.\n- Health checks liveness/readiness ; arrêt gracieux (terminer les messages en cours).\n\n### Infrastructure de microservices\n- **API Gateway** (Azure API Management, YARP) : routage, auth, quotas, agrégation ; **BFF** (Backend for\n  Frontend) par type de client.\n- Service discovery, configuration centralisée (Azure App Configuration), secrets (Key Vault).\n- Conteneurs + orchestrateur (AKS, Azure Container Apps), ou serverless (Azure Functions).\n- **Dapr** (intégré à Container Apps) : building blocks pub/sub, state, invocation, secrets.\n- **.NET Aspire** : orchestration locale, service defaults (OpenTelemetry, health checks, résilience),\n  intégrations Azure ; facilite le dev local de plusieurs services.\n- Observabilité distribuée : **correlation ID / trace context W3C** (`traceparent`) propagé en HTTP et\n  dans les messages (fiche `observabilite`).\n\n## Pièges et nuances\n- Commencer en microservices sans connaître les frontières du domaine → mauvais découpage coûteux.\n  \"Monolith first\" (Fowler) ou monolithe modulaire, puis extraction.\n- Retry sans idempotence = doublons ; retry sans backoff = tempête de requêtes (retry storm).\n- Événements trop \"gras\" (tout l'état) vs trop \"maigres\" (le consommateur doit rappeler l'API) :\n  choisir consciemment (event-carried state transfer vs notification).\n- Versionner les messages : ajout de champs optionnels, consommateurs tolérants (tolerant reader).\n- Plus de services = plus de pipelines, dashboards, alertes : coût de run réel.\n\n## Questions d'entretien probables\n- **Comment garantir qu'un événement est publié si la base est mise à jour ?** Transactional Outbox.\n- **Le même message arrive deux fois : que fais-tu ?** Consommateur idempotent (Inbox, clé naturelle,\n  upsert, version d'agrégat).\n- **Explique une saga sur un exemple bancaire.** Ouverture de compte : KYC validé → création du compte →\n  émission de la carte ; si la carte échoue, compenser (statut, notification) ; orchestrateur avec états\n  persistés et timeouts.\n- **Synchrone ou asynchrone entre deux services ?** Asynchrone si l'appelant n'a pas besoin de la réponse\n  immédiatement ou si la disponibilité doit être découplée ; synchrone pour une lecture nécessaire à la réponse.\n- **Comment découper un monolithe ?** Event Storming → bounded contexts → strangler fig, extraction du\n  contexte le plus autonome/le plus utile, ACL, données migrées avec synchronisation temporaire.\n- **Comment débugger une requête qui traverse 5 services ?** Traces distribuées, correlation ID dans les\n  logs, dashboards par service, APM (Datadog).\n\n## Pour aller plus loin\n- *Building Microservices* 2e éd. (Sam Newman) ; *Microservices Patterns* (Chris Richardson) et microservices.io.\n- Microsoft : \".NET Microservices: Architecture for Containerized .NET Applications\" (eBook gratuit).\n- Azure Architecture Center : \"Cloud design patterns\".\n"
 },
 "11-event-sourcing.md": {
  "title": "11 — Event Sourcing (event-sourcing)",
  "md": "# 11 — Event Sourcing (`event-sourcing`)\n\n## En 30 secondes\nAu lieu de stocker l'état courant, on stocke la **suite immuable des événements** qui l'ont produit\n(`CustomerRegistered`, `IdentityDocumentSubmitted`, `CustomerVerified`…). L'état est obtenu en\n**rejouant** les événements (fold). Bénéfices : **audit trail complet et natif** (précieux en banque),\nvoyage dans le temps, projections multiples, intégration naturelle par événements. Coûts : complexité,\nversioning des événements, cohérence éventuelle des lectures, RGPD (données immuables).\n\n## Notions clés\n\n### Vocabulaire\n- **Stream** : séquence d'événements d'une instance d'agrégat (`onboarding-42`).\n- **Event store** : stockage append-only des streams, avec **version** par stream.\n- **Rehydratation** : charger les événements du stream et les appliquer (`Apply`) pour reconstruire l'agrégat.\n- **Projection** : consommateur qui transforme les événements en **read model** (CQRS) ; reconstructible\n  en rejouant depuis le début.\n- **Snapshot** : état sauvegardé à la version N pour éviter de rejouer des milliers d'événements.\n- **Upcasting** : transformer un ancien format d'événement vers le nouveau à la lecture.\n\n### Mécanique côté agrégat\n```csharp\npublic abstract class EventSourcedAggregate\n{\n    private readonly List<object> _uncommitted = [];\n    public int Version { get; private set; } = -1;\n    public IReadOnlyList<object> UncommittedEvents => _uncommitted;\n\n    protected void Raise(object @event) { Apply(@event); _uncommitted.Add(@event); }\n\n    public void LoadFromHistory(IEnumerable<object> history)\n    {\n        foreach (var e in history) { Apply(e); Version++; }\n    }\n    protected abstract void Apply(object @event);   // change l'état, AUCUNE règle métier\n}\n```\n- Les **méthodes métier** valident les invariants puis lèvent l'événement ; `Apply` ne fait que muter l'état\n  (il doit pouvoir rejouer des événements anciens sans jamais échouer).\n- Sauvegarde : `AppendToStream(streamId, expectedVersion, events)` → **concurrence optimiste** : si la\n  version en base ≠ version attendue, conflit (`409`) → recharger et réessayer ou rejeter.\n\n### Implémentations en .NET / Azure\n- **EventStoreDB / KurrentDB** (base dédiée, subscriptions) ; **Marten** (event store sur PostgreSQL, projections\n  inline/async) ; **Cosmos DB** fait maison :\n  - container `events`, **partition key = streamId** (tous les événements d'un agrégat dans la même\n    partition logique) ;\n  - `id` = `{streamId}-{version}` → l'unicité de l'id **dans la partition** garantit la concurrence optimiste ;\n  - **TransactionalBatch** pour écrire plusieurs événements atomiquement (même partition) ;\n  - **Change Feed** (processor ou Azure Function Cosmos DB trigger) pour alimenter projections et publier\n    les événements d'intégration sur Service Bus (sert d'outbox naturelle).\n  - Attention à la limite de 20 Go par partition logique (streams courts = OK).\n- SQL Server : table `Events(StreamId, Version, Type, Data, Metadata, Timestamp)` avec clé unique\n  `(StreamId, Version)`.\n\n### Événements : conception\n- Nommés au passé, en langage métier, granularité métier (pas `CustomerUpdated` générique).\n- Métadonnées : `eventId`, `occurredAt`, `causationId`, `correlationId`, `userId`/acteur, version de schéma.\n- **Versioning** : ajouter des champs optionnels ; nouveaux types d'événements ; upcasters ; ne jamais réécrire\n  l'historique (sauf procédure exceptionnelle de type \"copy-and-replace\").\n- Événements **de domaine** (internes, riches) ≠ **événements d'intégration** (contrat public stable, publiés\n  vers les autres contextes).\n\n### Projections\n- Inline (synchrone avec l'écriture) vs asynchrones (cohérence éventuelle).\n- Idempotentes : stocker la dernière position/version traitée ; rejouables.\n- Plusieurs read models pour plusieurs besoins (écran conseiller, reporting conformité, recherche).\n\n### Event Sourcing et RGPD\n- Problème : événements immuables vs droit à l'effacement.\n- Solutions : ne pas mettre les données personnelles dans les événements (référence vers un store séparé\n  effaçable), ou **crypto-shredding** (chiffrer les PII avec une clé par personne ; supprimer la clé rend les\n  données illisibles).\n- En banque, l'obligation de conservation LCB-FT (5 ans après la fin de la relation) prime souvent sur\n  l'effacement : base légale \"obligation légale\" (fiche `banque`).\n\n## Pièges et nuances\n- Event Sourcing partout = sur-ingénierie ; à réserver aux contextes où l'historique a une valeur métier\n  (KYC, comptes, conformité, workflow).\n- Event Sourcing ≠ Event-Driven Architecture : on peut publier des événements sans faire d'ES.\n- Requêtes ad hoc sur l'event store = mauvaise idée → projections.\n- Ne pas publier directement les événements de domaine internes comme contrat public.\n- Logique métier dans `Apply` = rejeu impossible quand les règles changent.\n\n## Questions d'entretien probables\n- **Event Sourcing : avantages / inconvénients ?** Audit, historique, projections, debugging temporel ;\n  vs complexité, versioning, cohérence éventuelle, RGPD, courbe d'apprentissage.\n- **Comment gères-tu la concurrence ?** Version attendue à l'écriture (optimistic concurrency).\n- **Comment reconstruire un read model corrompu ?** Le supprimer et rejouer tous les événements (projection\n  idempotente, checkpoint remis à zéro).\n- **Un agrégat a 50 000 événements, que fais-tu ?** Snapshots, ou revoir la conception (stream trop long,\n  cycle de vie à découper : \"closing the books\").\n- **Comment publier de manière fiable vers Service Bus ?** Change feed / subscription de l'event store comme\n  outbox → publisher idempotent (MessageId = eventId + duplicate detection).\n- **Pourquoi c'est pertinent pour du KYC ?** Traçabilité réglementaire : qui a validé quoi, quand, sur quelle\n  base, état du dossier à une date donnée (contrôle ACPR, audit).\n\n## Pour aller plus loin\n- Greg Young — \"Versioning in an Event Sourced System\" (livre gratuit Leanpub).\n- Martin Fowler — \"Event Sourcing\" ; Oskar Dudycz — blog event-driven.io (exemples .NET, Marten).\n- Microsoft Learn — \"Event Sourcing pattern\" (Azure Architecture Center) et \"Cosmos DB change feed design patterns\".\n"
 },
 "12-messaging.md": {
  "title": "12 — Azure Service Bus & messaging (messaging)",
